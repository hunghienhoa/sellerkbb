name: Deploy & Backup SellerKBB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sellerkbb-main
  cancel-in-progress: true

jobs:
  safety-preflight:
    name: Safety gate — code, data contracts, PC/mobile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare and Firestore deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CF_TOKEN CF_ACCOUNT FIREBASE_SERVICE_ACCOUNT FIREBASE_PROJECT_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing deployment credential: $key. Refusing all deployments."
              exit 1
            fi
          done
          echo "Both Cloudflare and Firebase credentials are configured."
      - name: Validate GMV/KPI regression and app version
        run: npm run check
      - name: Validate storage bindings and deployment safety
        run: node scripts/deployment-safety.mjs
      - name: Browser smoke test (desktop + mobile)
        run: |
          npm install --no-save puppeteer-core axe-core@4.14.0
          node scripts/ui-browser-test.mjs
          AXE_PATH=node_modules/axe-core/axe.min.js node scripts/ui-audit.mjs
      - name: Build Worker before changing production resources
        run: npm run build
      - name: Regression check new /preview skin and unchanged live page
        env:
          RUN_PREVIEW_BROWSER_TEST: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-new-ui-preview.mjs

  deploy-firestore:
    needs: safety-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules and indexes (never user data)
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only firestore:rules,firestore:indexes

  deploy-cloudflare:
    needs: [safety-preflight, deploy-firestore]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "Commit ${{ github.sha }}"
      - name: Verify live source, version and commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERIFY_CLOUDFLARE: 'true'
        run: node scripts/verify-deployment.mjs

  release-backup:
    name: Release source backup
    needs: [deploy-cloudflare, deploy-firestore]
    if: ${{ always() && needs.deploy-cloudflare.result == 'success' && needs.deploy-firestore.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout completed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          WRANGLER_VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' wrangler.toml)"
          test -n "$VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$WRANGLER_VERSION"
          grep -Fq "version:'${VERSION}-preview'" public/index.html
          grep -Fq ">v${VERSION}</span>" public/index.html
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build source ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip --output="sellerkbb-v${VERSION}-src.zip" HEAD

      - name: Write release notes from README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 == "## 🆕 Cập nhật mới nhất — v" ver { capture=1; next }
            capture && /^---$/ { exit }
            capture { print }
          ' README.md > release-changes.md
          if ! grep -q '^- ' release-changes.md; then
            echo "- Cập nhật SellerKBB v$VERSION." > release-changes.md
          fi
          {
            printf '# SellerKBB v%s\n\n' "$VERSION"
            printf '## ✨ Tính năng/cập nhật trong bản này\n\n'
            cat release-changes.md
            printf '\n## 📦 Backup mã nguồn\n\n'
            printf -- '- Source code đúng theo commit: %s\n' "$GITHUB_SHA"
            printf -- '- File: sellerkbb-v%s-src.zip\n' "$VERSION"
            printf -- '- Kèm Source ZIP/TAR mặc định do GitHub tạo.\n'
            printf '\n## ⚠️ Lưu ý\n\n'
            printf '%s\n' 'Release chỉ backup mã nguồn/SRC. Release không chứa dữ liệu Firestore, dữ liệu Cloudflare KV đang chạy, TikTok token, Firebase service account hoặc các secret.'
            printf '\n%s\n' 'Muốn khôi phục: vào Releases → chọn version → đưa link Release đó cho AI và yêu cầu khôi phục SellerKBB về đúng Release, chạy test PC/mobile rồi deploy lại.'
          } > release-notes.md

      - name: Create or refresh Release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="sellerkbb-v${VERSION}-src.zip"

          # Tìm cả Release đã publish lẫn draft còn sót từ lần upload bị gián đoạn.
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "'"$TAG"'") | .id' | head -n 1 || true)"

          if [ -n "$RELEASE_ID" ]; then
            echo "Release/draft $TAG already exists (id=$RELEASE_ID); refreshing idempotently."

            # Cập nhật đúng commit + notes và publish draft nếu có.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="SellerKBB $TAG" \
              -f body="$(cat release-notes.md)" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null

            # --clobber bảo đảm retry không lỗi vì asset cùng tên đã tồn tại.
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "SellerKBB $TAG" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Backfill legacy Release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          backfill_release() {
            TAG="$1"
            TITLE="$2"
            shift 2
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              return
            fi
            BODY="$(gh release view "$TAG" --json body --jq '.body')"
            if printf '%s' "$BODY" | grep -q '## ✨ Tính năng/cập nhật trong bản này'; then
              return
            fi
            FILE="/tmp/${TAG}.md"
            {
              printf '# SellerKBB %s\n\n' "$TAG"
              printf '## ✨ Tính năng/cập nhật trong bản này\n\n'
              for ITEM in "$@"; do
                printf -- '- %s\n' "$ITEM"
              done
              printf '\n## 📦 Backup mã nguồn\n\n'
              printf -- '- File backup SRC: sellerkbb-%s-src.zip\n' "$TAG"
              printf '\n## ⚠️ Lưu ý\n\n'
              printf '%s\n' 'Release chỉ backup mã nguồn/SRC, không chứa dữ liệu Firestore, Cloudflare KV, TikTok token hoặc secret.'
            } > "$FILE"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$FILE"
          }

          backfill_release "v1.10.0" "SellerKBB v1.10.0" \
            "Thêm cơ chế tự tạo Release backup sau khi test hoàn tất." \
            "Chỉ giữ tối đa 5 Release gần nhất và đính kèm ZIP mã nguồn." \
            "Xây lại README chi tiết dành cho người không chuyên IT."

          backfill_release "v1.11.0" "SellerKBB v1.11.0" \
            "Dùng ảnh đại diện Google/Gmail cho tài khoản người dùng." \
            "Thêm menu hồ sơ cá nhân với tên, Gmail, vai trò, trạng thái, quyền truy cập và Đăng xuất." \
            "Hiển thị avatar trong danh sách tài khoản và KPI khi có hồ sơ tương ứng."

          backfill_release "v1.12.0" "SellerKBB v1.12.0" \
            "Đổi giao diện sang tím pastel và chia sidebar theo Báo cáo / Công cụ / Quản trị." \
            "Cân chỉnh logo SellerKBB LIVE và sắp xếp tài khoản theo Admin → Vận hành → Host." \
            "Thêm khung BO_HO_SO_KPI_KHANGCHOU theo năm hiện tại ở trạng thái đang phát triển."

          backfill_release "v1.13.0" "SellerKBB v1.13.0" \
            "Thêm quy trình KPI thủ công theo từng người cho phiên Campaign/Mega." \
            "Cho nhập GMV sau hoàn/hủy và KPI riêng của từng cá nhân, không tự chia GMV tổng." \
            "KPI thủ công đã lưu tự cộng vào KPI nhân sự và giữ lại sau reload."

      - name: Keep only newest 5 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RELEASE_TAGS < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          echo "Current releases: ${#RELEASE_TAGS[@]}"
          if [ "${#RELEASE_TAGS[@]}" -gt 5 ]; then
            for TAG in "${RELEASE_TAGS[@]:5}"; do
              echo "Removing old backup Release: $TAG"
              gh release delete "$TAG" --cleanup-tag -y || true
            done
          fi

      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### ✅ SellerKBB backup completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: **$TAG**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP attached" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: **5 newest Releases**" >> "$GITHUB_STEP_SUMMARY"

name: Deploy & Backup SellerKBB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sellerkbb-main
  cancel-in-progress: true

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Browser smoke test (desktop + mobile)
        run: |
          npm install --no-save puppeteer-core
          node scripts/ui-browser-test.mjs
      - run: npm run build
      - name: Detect Cloudflare secrets
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Cloudflare Worker
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-firestore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect Firebase secrets
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate Google Cloud
        if: steps.firebase.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules and indexes
        if: steps.firebase.outputs.configured == 'true'
        run: |
          npm install -g firebase-tools
          firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only firestore:rules,firestore:indexes

  release-backup:
    name: Release source backup
    needs: [deploy-cloudflare, deploy-firestore]
    if: ${{ always() && needs.deploy-cloudflare.result == 'success' && needs.deploy-firestore.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout completed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          WRANGLER_VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' wrangler.toml)"
          test -n "$VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$WRANGLER_VERSION"
          grep -Fq "version:'${VERSION}-preview'" public/index.html
          grep -Fq ">v${VERSION}</span>" public/index.html
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build source ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip --output="sellerkbb-v${VERSION}-src.zip" HEAD

      - name: Write release notes with changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -v "^$TAG$" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          mapfile -t CHANGES < <(git log "$RANGE" --pretty=format:%s | grep -E '^(feat|fix)(\([^)]*\))?:' || true)
          {
            printf '# SellerKBB v%s\n\n' "$VERSION"
            printf '## ✨ Tính năng/cập nhật trong bản này\n\n'
            if [ "${#CHANGES[@]}" -eq 0 ]; then
              printf '%s\n' '- Cập nhật kỹ thuật và hoàn thiện độ ổn định của SellerKBB.'
            else
              for ITEM in "${CHANGES[@]}"; do
                CLEAN="$(printf '%s' "$ITEM" | sed -E 's/^(feat|fix)(\([^)]*\))?:[[:space:]]*//')"
                printf -- '- %s\n' "$CLEAN"
              done
            fi
            printf '\n## 📦 Backup mã nguồn\n\n'
            printf -- '- Source code đúng theo commit: %s\n' "$GITHUB_SHA"
            printf -- '- File: sellerkbb-v%s-src.zip\n' "$VERSION"
            printf -- '- Kèm Source ZIP/TAR mặc định do GitHub tạo.\n'
            printf '\n## ⚠️ Lưu ý\n\n'
            printf '%s\n' 'Release chỉ backup mã nguồn/SRC. Release không chứa dữ liệu Firestore, dữ liệu Cloudflare KV đang chạy, TikTok token, Firebase service account hoặc các secret.'
            printf '\n%s\n' 'Muốn khôi phục: vào Releases → chọn version → đưa link Release đó cho AI và yêu cầu khôi phục SellerKBB về đúng Release, chạy test PC/mobile rồi deploy lại.'
          } > release-notes.md

      - name: Create or refresh Release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing it to the newest completed commit."
            gh release delete "$TAG" --cleanup-tag -y
          fi
          gh release create "$TAG" "sellerkbb-v${VERSION}-src.zip" \
            --target "$GITHUB_SHA" \
            --title "SellerKBB $TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Keep only newest 5 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RELEASE_TAGS < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          echo "Current releases: ${#RELEASE_TAGS[@]}"
          if [ "${#RELEASE_TAGS[@]}" -gt 5 ]; then
            for TAG in "${RELEASE_TAGS[@]:5}"; do
              echo "Removing old backup Release: $TAG"
              gh release delete "$TAG" --cleanup-tag -y || true
            done
          fi

      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### ✅ SellerKBB backup completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: **$TAG**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP attached" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: **5 newest Releases**" >> "$GITHUB_STEP_SUMMARY"

    function reconcileFilterDefinitions(orders){
      const defs=[
        ['all','Tất cả'],
        ['packing','Chờ đóng hàng'],
        ['carrier','Chờ vận chuyển'],
        ['transport','Đang vận chuyển'],
        ['delivery','Đang giao'],
        ['delivered','Đã giao'],
        ['returning','Đang hoàn / trả'],

        ['cancelled','Đã hủy'],
        ['completed','Hoàn tất'],
        ['processing','Đang xử lý']

      orders.forEach(o=>{const key=reconcileOrderState(o);counter[key]=(counter[key]||0)+1;});

    async function loadReconciliation(sessionId,force=false){
      const session=state.sessions.find(s=>s.id===sessionId), root=$('#reconcileModalBody');
      if(!session||!root||state.reconcileModalSessionId!==sessionId)return;
      root.classList.remove('has-data');
      root.innerHTML='<div class="reconcile-loading">Đang tải trạng thái đơn từ TikTok…</div>';
      const refresh=$('#reconcileModalRefresh');
      const refreshStartedAt=performance.now();
      if(refresh){
        refresh.disabled=true;
        refresh.classList.add('is-refreshing');
        refresh.setAttribute('aria-busy','true');
        refresh.innerHTML=icon('refresh',14)+' Đang tải…';
      }
      try{
        const result=PREVIEW?previewReconciliation(session):await api('/api/tiktok/reconcile/live?live_id='+encodeURIComponent(session.liveId||session.id)+(force?'&refresh=1':''));
        result.kpiSummary=deriveKpiSummaryFromReconciliation(result);
        session.reconciliation=result.kpiSummary;
        if(result?.live?.affiliateDataAvailable===true){
          session.affiliateDataAvailable=true;
          session.affiliateDataConsistent=result.live.affiliateDataConsistent!==false;
          session.shopProductGmvAmount=Number(result.live.shopProductGmvAmount||0);
          session.affiliateGmvAmount=Number(result.live.affiliateGmvAmount||0);
          session.affiliateItemsSold=Number(result.live.affiliateItemsSold||0);
          session.affiliateSkuOrders=Number(result.live.affiliateSkuOrders||0);
          session.affiliateCommissionAvailable=result.live.affiliateCommissionAvailable===true;
          session.affiliateCommissionAmount=session.affiliateCommissionAvailable?Number(result.live.affiliateCommissionAmount||0):0;
          session.affiliateSource=result.live.affiliateSource||session.affiliateSource||'';
        }
        if(state.reconcileModalSessionId===sessionId)renderReconcileResult(session,result);
        renderKpi();
        renderDashboard();
      }catch(error){
        if(state.reconcileModalSessionId===sessionId){
          root.classList.add('has-data');
          root.innerHTML='<div class="notice bad">Không đối soát được phiên này: '+esc(error.message||String(error))+'</div>';
        }
      }finally{
        const remaining=Math.max(0,450-(performance.now()-refreshStartedAt));
        if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
        if(refresh){
          refresh.disabled=false;
          refresh.classList.remove('is-refreshing');
          refresh.removeAttribute('aria-busy');
          refresh.innerHTML=icon('refresh',14)+' Làm mới';
        }
      }
    }
    function previewReconciliation(session){
      const samples=[
        {status:'AWAITING_SHIPMENT',after:null},
        {status:'AWAITING_COLLECTION',after:null},
        {status:'PARTIALLY_SHIPPING',after:null},
        {status:'IN_TRANSIT',after:null},
        {status:'DELIVERED',after:null},
        {status:'IN_TRANSIT',after:'BUYER_SHIPPED_ITEM'},
        {status:'DELIVERED',after:'RETURN_OR_REFUND_REQUEST_COMPLETE'},
        {status:'CANCELLED',after:null},
        {status:'COMPLETED',after:null}
      ];
      const orders=samples.map((sample,i)=>{
        const amount=Math.round(finalGmv(session)/11)+(i*95000);
        const refunded=sample.after==='RETURN_OR_REFUND_REQUEST_COMPLETE';
        return {
          id:'ORD-'+String(i+1).padStart(4,'0'),
          status:sample.status,
          amount,
          netAmount:sample.status==='CANCELLED'?0:(refunded?Math.round(amount*.62):amount),
          currency:session.currency||'VND',
          attribution:i<5?'live_signal':'time_window_single_live',
          finalized:sample.status==='CANCELLED'||sample.status==='COMPLETED',
          aftersales:sample.after?[{status:sample.after,refundTotal:refunded?Math.round(amount*.38):0}]:[]
        };
      });
      const counts={total:orders.length,awaitingPacking:1,awaitingCarrier:1,transporting:1,outForDelivery:2,delivered:2,completed:1,cancelled:1,returning:1,refunded:1};
      const previewAffiliate=affiliateFigures(session);
      const result={
        live:{
          analyticsGmvAmount:finalGmv(session),
          affiliateDataAvailable:previewAffiliate.available,
          shopProductGmvAmount:previewAffiliate.shop,
          affiliateGmvAmount:previewAffiliate.affiliate,
          affiliateItemsSold:previewAffiliate.affiliateItems,
          affiliateCommissionAvailable:false,
          affiliateCommissionAmount:null
        },
        scope:{aftersalesAvailable:true,overlapAmbiguous:false,overlapCount:0},
        policy:{reconciliationProtectionDays:60},
        counts,
        totals:{
          orderWindowAmount:orders.reduce((a,o)=>a+o.amount,0),
          provisionalNetAmount:orders.reduce((a,o)=>a+o.netAmount,0),
          confirmedLiveSignalAmount:orders.filter(o=>o.attribution==='live_signal').reduce((a,o)=>a+o.netAmount,0)
        },
        orders
      };
      result.kpiSummary=deriveKpiSummaryFromReconciliation(result);
      return result;
    }
    function renderReconcile(){

    function liveEndTime(s){
      const start=s?.startTime?.toDate?.();
      const explicit=s?.endTime?.toDate?.();
      if(start instanceof Date&&!Number.isNaN(start.getTime())&&explicit instanceof Date&&!Number.isNaN(explicit.getTime())&&explicit.getTime()>start.getTime()) return s.endTime;
      const duration=Number(s?.durationSeconds||0);
      if(!(start instanceof Date)||Number.isNaN(start.getTime())||duration<=0)return null;
      const calculated=new Date(start.getTime()+duration*1000);
      if(Number.isNaN(calculated.getTime())||calculated.getTime()<=start.getTime())return null;
      return {toDate:()=>calculated};
    }
    function fmtLiveTimeRange(s){
      const start=s?.startTime?.toDate?.();
      const end=liveEndTime(s)?.toDate?.();
      if(!(start instanceof Date)||Number.isNaN(start.getTime())||start.getFullYear()<2020)return '—';
      const p=n=>String(n).padStart(2,'0');
      const startDate=`${p(start.getDate())}/${p(start.getMonth()+1)}/${start.getFullYear()}`;
      const startTime=`${p(start.getHours())}:${p(start.getMinutes())}`;
      if(!(end instanceof Date)||Number.isNaN(end.getTime())||end.getFullYear()<2020)return `${startDate} Vào lúc ${startTime}`;
      const endTime=`${p(end.getHours())}:${p(end.getMinutes())}`;
      const sameDay=start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()&&start.getDate()===end.getDate();
      if(sameDay)return `${startDate} Vào lúc ${startTime}-${endTime}`;
      const endDate=`${p(end.getDate())}/${p(end.getMonth()+1)}/${end.getFullYear()}`;
      return `${startDate} Vào lúc ${startTime}-${endDate} ${endTime}`;
    }

    function affiliateFigures(session){
      const total=Math.max(0,Number(finalGmv(session)||0));
      const previewAvailable=PREVIEW&&session?.affiliateDataAvailable!==false;
      const available=(session?.affiliateDataAvailable===true&&session?.creatorGmvAvailable===true)||previewAvailable;
      const previewAffiliate=previewAvailable&&session?.affiliateDataAvailable!==true?Math.round(total*((String(session?.id||'').charCodeAt(0)%5+17)/100)):0;
      const affiliate=available?Math.max(0,Number(session?.affiliateDataAvailable===true?session.affiliateGmvAmount:previewAffiliate)||0):null;
      const shop=available?Math.max(0,Number(session?.affiliateDataAvailable===true?session.shopProductGmvAmount:Math.max(0,total-(affiliate||0)))||0):null;
      const itemsTotal=Math.max(0,Number(session?.currentItemsSold??session?.recordedItemsSold??0));
      const affiliateItems=available?Math.max(0,Number(session?.affiliateDataAvailable===true?session.affiliateItemsSold:Math.round(itemsTotal*((affiliate||0)/Math.max(1,total))))||0):null;
      // The creator-side commission-attributed GMV and seller-side last-click
      // GMV are NOT mathematically interchangeable according to TikTok.
      // Expose their gap only as a comparison, never as verified Affiliate GMV.
      const creator=Number(session?.creatorGmvAmount);
      const seller=Number(session?.sellerGmvAmount);
      const estimateAvailable=!available && session?.creatorGmvAvailable===true &&
        Number.isFinite(creator)&&Number.isFinite(seller)&&seller>0&&creator>=seller;
      const estimate=estimateAvailable?Math.max(0,Math.round(creator-seller)):null;
      return {total,available,shop,affiliate,affiliateItems,estimateAvailable,estimate};
    }

    function affiliateLiveSummary(sessions){
      const rows=(sessions||[]).map(session=>({session,fig:affiliateFigures(session)}));
      const known=rows.filter(x=>x.fig.available);
      const total=rows.reduce((sum,x)=>sum+x.fig.total,0);
      const shop=known.reduce((sum,x)=>sum+Number(x.fig.shop||0),0);
      const affiliate=known.reduce((sum,x)=>sum+Number(x.fig.affiliate||0),0);
      const estimates=rows.filter(x=>!x.fig.available && x.fig.estimateAvailable);
      return {total,shop,affiliate,knownCount:known.length,totalCount:rows.length,
        estimateCount:estimates.length,estimateTotal:estimates.reduce((sum,x)=>sum+Number(x.fig.estimate||0),0)};
    }

    function normalizedManualKpiEntries(session){
      return (Array.isArray(session?.manualKpiEntries)?session.manualKpiEntries:[])
        .map((entry,index)=>{
          const role=entry?.role==='operator'?'operator':'host';
          const gmv=Math.max(0,Number(entry?.gmv||0));
          return {
            uid:String(entry?.uid||''),

            role,
            gmv,
            kpi:Math.round(gmv*(role==='operator'?.001:.003)),

          };
        })
        .filter(entry=>entry.uid||entry.name);
    }

    function manualKpiHostTotal(entries){
      return (entries||[]).filter(entry=>entry?.role==='host').reduce((sum,entry)=>sum+Math.max(0,Number(entry?.gmv||0)),0);
    }

    function manualKpiBalance(session,hostTotal){
      const figures=sessionGmvFigures(session);
      const finalAvailable=figures.final!==null;
      const limit=finalAvailable?Math.max(0,Number(figures.final||0)):0;
      const total=Math.max(0,Number(hostTotal||0));
      if(!finalAvailable){
        return {status:total>0?'draft':'waiting',finalAvailable:false,limit:0,total,remaining:0,excess:0,countable:false};
      }
      if(total>limit){
        return {status:'excess',finalAvailable:true,limit,total,remaining:0,excess:total-limit,countable:false};
      }
      if(total===0){
        return {status:'empty',finalAvailable:true,limit,total,remaining:limit,excess:0,countable:false};
      }
      if(total===limit){
        return {status:'matched',finalAvailable:true,limit,total,remaining:0,excess:0,countable:true};
      }
      return {status:'under',finalAvailable:true,limit,total,remaining:limit-total,excess:0,countable:true};
    }

    function manualKpiValidation(session,entries=normalizedManualKpiEntries(session)){
      return manualKpiBalance(session,manualKpiHostTotal(entries));
    }

    function manualKpiBalanceHtml(session,hostTotal){
      const v=manualKpiBalance(session,hostTotal);
      const currency=session.currency||'VND';
      let tone='warn', message='';
      if(v.status==='matched'){
        tone='ok'; message='GMV thủ công khớp hoàn toàn với GMV sau khi hoàn hủy. Dữ liệu đủ điều kiện cộng vào KPI đã chốt.';
      }else if(v.status==='under'){
        tone='warn'; message='Còn '+fmtMoney(v.remaining,currency)+' GMV chưa phân bổ. Vẫn có thể lưu và chỉ tính KPI trên phần GMV đã nhập.';
      }else if(v.status==='excess'){
        tone='bad'; message='GMV các Host đang vượt GMV sau khi hoàn hủy '+fmtMoney(v.excess,currency)+'. Hệ thống chặn lưu cho tới khi sửa lại.';
      }else if(v.status==='draft'){
        tone='draft'; message='Phiên chưa có GMV sau khi hoàn hủy đã chốt. Dữ liệu được lưu nháp và chưa cộng vào KPI đã chốt.';
      }else if(v.status==='waiting'){
        tone='draft'; message='Chưa có GMV sau khi hoàn hủy đã chốt. Khi nhập KPI thủ công, hệ thống sẽ lưu ở trạng thái nháp.';
      }else{
        tone='warn'; message='Chưa phân bổ GMV cho Host.';
      }
      const lastLabel=v.status==='excess'?'Vượt GMV':v.finalAvailable?'Còn chưa phân bổ':'Trạng thái';
      const lastValue=v.status==='excess'?fmtMoney(v.excess,currency):v.finalAvailable?fmtMoney(v.remaining,currency):'Chờ đối soát';
      return `<div class="manual-kpi-balance">
        <div class="manual-kpi-balance-item"><span>GMV sau khi hoàn hủy</span><b>${v.finalAvailable?fmtMoney(v.limit,currency):'Chưa chốt'}</b></div>
        <div class="manual-kpi-balance-item"><span>GMV Host đã phân bổ</span><b>${fmtMoney(v.total,currency)}</b></div>
        <div class="manual-kpi-balance-item"><span>${lastLabel}</span><b>${lastValue}</b></div>
      </div><div class="manual-kpi-validation ${tone}" data-manual-validation-status="${v.status}">${message}</div>`;
    }

    function buildKpiRows(sessions=kpiSessionsForMonth()){
      const map=new Map();
      const ensure=(uid,name,currency)=>{
        const key=uid||name;
        if(!key)return null;
        let cur=map.get(key);
        if(!cur){
          cur={
            uid:uid||'',
            name:name||'',
            roles:new Set(),
            finalAutoGmv:0,
            provisionalAutoGmv:0,
            manualGmv:0,
            waitingGrossGmv:0,
            finalAutoKpi:0,
            provisionalAutoKpi:0,
            manualKpi:0,
            finalSessions:0,
            provisionalSessions:0,
            waitingSessions:0,
            currency:currency||'VND'
          };
          map.set(key,cur);
        }
        if(name&&!cur.name)cur.name=name;
        if(currency)cur.currency=currency;
        return cur;
      };

      const applyAuto=(cur,role,session)=>{
        if(!cur)return;
        cur.roles.add(role);
        const rate=role==='operator'?.001:.003;
        const basis=automaticKpiBasis(session);
        if(!basis.usable){
          cur.waitingSessions++;
          cur.waitingGrossGmv+=basis.gross;
          return;
        }
        const kpi=basis.gmv*rate;
        if(basis.status==='final'){
          cur.finalSessions++;
          cur.finalAutoGmv+=basis.gmv;
          cur.finalAutoKpi+=kpi;
        }else{
          cur.provisionalSessions++;
          cur.provisionalAutoGmv+=basis.gmv;
          cur.provisionalAutoKpi+=kpi;
        }
      };

      for(const session of sessions){
        if(isManualKpi(session)){
          const manualEntries=normalizedManualKpiEntries(session);
          const validation=manualKpiValidation(session,manualEntries);
          if(validation.countable){
            for(const entry of manualEntries){
              const cur=ensure(entry.uid,entry.name,entry.currency||session.currency);
              if(!cur)continue;
              cur.roles.add(entry.role);
              cur.manualGmv+=entry.gmv;
              cur.manualKpi+=entry.kpi;
            }
          }
          continue;
        }
        if(session.hostUid||session.hostName){
          applyAuto(ensure(session.hostUid,session.hostName,session.currency),'host',session);
        }
        if(session.operatorUid||session.operatorName){
          applyAuto(ensure(session.operatorUid,session.operatorName,session.currency),'operator',session);
        }
      }

      return [...map.values()].map(row=>{
        const finalGmvAmount=row.finalAutoGmv+row.manualGmv;
        const finalKpi=row.finalAutoKpi+row.manualKpi;
        const provisionalGmv=row.provisionalAutoGmv;
        const provisionalKpi=row.provisionalAutoKpi;
        return {
          ...row,
          roles:[...row.roles],
          autoGmv:row.finalAutoGmv+row.provisionalAutoGmv,
          autoKpi:row.finalAutoKpi+row.provisionalAutoKpi,
          finalGmv:finalGmvAmount,
          provisionalGmv,
          gmv:finalGmvAmount+provisionalGmv,
          finalKpi,
          provisionalKpi,
          kpi:finalKpi+provisionalKpi
        };
      }).sort((a,b)=>b.kpi-a.kpi);
    }

    function kpiRoleSummary(row){
      const roles=Array.isArray(row?.roles)?row.roles:[];
      if(roles.length===1)return roleLabel(roles[0]);
      if(roles.length>1)return 'Nhiều vai trò';
      return 'KPI thủ công';
    }

    function manualMoneyNumber(value){
      const digits=String(value??'').replace(/[^0-9]/g,'');
      return Math.max(0,Number(digits||0));
    }

    function manualMoneyInputDisplay(value){
      return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(manualMoneyNumber(value));
    }

    function manualMoneyDisplay(value){
      return manualMoneyInputDisplay(value)+'đ';
    }

    function setManualMoneyInput(input,value){
      if(!input)return;
      if('value' in input)input.value=manualMoneyInputDisplay(value);
      else input.textContent=manualMoneyDisplay(value);
    }

    function formatManualMoneyInput(input){
      if(!input)return;
      const raw=String(input.value||'');
      const caret=Number.isFinite(input.selectionStart)?input.selectionStart:raw.length;
      const digitsBefore=raw.slice(0,caret).replace(/[^0-9]/g,'').length;
      const formatted=manualMoneyInputDisplay(raw);
      input.value=formatted;
      let pos=0,seen=0;
      while(pos<formatted.length&&seen<digitsBefore){
        if(/[0-9]/.test(formatted[pos]))seen++;
        pos++;
      }
      try{input.setSelectionRange(pos,pos)}catch{}
    }

    function manualKpiPeople(role=''){
      return role?staffForRole(role):[...staffForRole('host'),...staffForRole('operator')];
    }

    function manualKpiPersonOptions(role,value=''){
      const people=manualKpiPeople(role);
      return '<option value="">— Chọn '+(role==='operator'?'nhân viên vận hành':'Host')+' —</option>'+
        people.map(u=>`<option value="${u.id}" ${u.id===staffSelectionId(role,value,'')?'selected':''}>${esc(u.displayName)}</option>`).join('');
    }

    function manualKpiEditorEntries(session){
      return session?.kpiDraft?.status==='pending'
        ?normalizedManualKpiEntries({manualKpiEntries:session.kpiDraft.entries,currency:session.currency})
        :normalizedManualKpiEntries(session);
    }
    function manualKpiPairs(session){
      const entries=manualKpiEditorEntries(session);
      const pairs=[];
      for(const entry of entries){
        if(entry.role==='host'){
          pairs.push({host:entry,operator:null});
          continue;
        }
        let target=[...pairs].reverse().find(pair=>!pair.operator);
        if(!target){target={host:null,operator:null};pairs.push(target);}
        target.operator=entry;
      }
      return pairs;
    }

    function bindManualKpiPair(row){
      const gmvInput=row.querySelector('[data-manual-host-gmv]');
      const hostKpiInput=row.querySelector('[data-manual-host-kpi]');
      const operatorKpiInput=row.querySelector('[data-manual-operator-kpi]');

        setManualMoneyInput(operatorKpiInput,Math.round(gmv*.001));

      syncKpis();

      gmvInput?.addEventListener('input',()=>{
        formatManualMoneyInput(gmvInput);
        syncKpis();
      });

    function collectManualKpiEntries(card,session){
      const rows=[...card.querySelectorAll('[data-manual-entry]')];
      const entries=[];
      for(const row of rows){
        const hostUid=row.querySelector('[data-manual-host-person]')?.value||'';
        const operatorUid=row.querySelector('[data-manual-operator-person]')?.value||'';
        const gmv=manualMoneyNumber(row.querySelector('[data-manual-host-gmv]')?.value);
        const hostKpi=Math.round(gmv*.003);
        const operatorKpi=Math.round(gmv*.001);

        if(!hostUid&&(gmv||hostKpi||operatorUid))throw new Error('Hãy chọn Host Livestream cho nhóm KPI đã nhập.');
        if(!hostUid&&!operatorUid)continue;

        const host=state.staff.find(u=>u.id===hostUid);
        if(!host)throw new Error('Không tìm thấy Host Livestream đã chọn.');
        entries.push({uid:hostUid,name:host.displayName||'',role:'host',gmv,kpi:hostKpi,currency:session.currency||'VND'});

        if(operatorUid){
          const operator=state.staff.find(u=>u.id===operatorUid);
          if(!operator)throw new Error('Không tìm thấy Nhân viên vận hành Livestream đã chọn.');
          entries.push({uid:operatorUid,name:operator.displayName||'',role:'operator',gmv,kpi:operatorKpi,currency:session.currency||'VND'});
        }
      }
      return entries;
    }

    async function saveManualKpiSession(sessionId,button){
      const session=state.sessions.find(s=>s.id===sessionId);
      const card=button?.closest('[data-manual-session]');
      if(!session||!card)return;
      let entries;
      try{entries=collectManualKpiEntries(card,session)}catch(error){showToast(error.message||'Dữ liệu KPI thủ công chưa hợp lệ');return;}
      const validation=manualKpiValidation(session,entries);
      if(validation.status==='excess'){
        updateManualKpiBalance(card,session);
        showToast('Không thể lưu: GMV các Host vượt GMV sau khi hoàn hủy '+fmtMoney(validation.excess,session.currency));
        return;
      }
      if(!canAssignLiveStaff()){showToast('Bạn không có quyền nhập KPI thủ công.');return;}
      const delegated=!isAdmin();
      const message=delegated?'Đã lưu nháp KPI · chờ Admin duyệt · chưa cộng KPI'
        :validation.status==='draft'||validation.status==='waiting'?'Đã lưu nháp KPI thủ công · chưa có GMV chốt'
        :validation.status==='under'?'Đã duyệt KPI thủ công · còn '+fmtMoney(validation.remaining,session.currency)+' GMV chưa phân bổ'
        :'Đã duyệt KPI thủ công · GMV đã khớp'; 
      if(delegated){
        session.kpiDraft={liveId:String(sessionId),entries,status:'pending',updatedBy:state.user.uid,updatedAt:new Date().toISOString()};
      }else{
        session.manualKpiEntries=entries;
        if(session.kpiDraft?.status==='pending')session.kpiDraft={...session.kpiDraft,entries,status:'approved',approvedBy:state.user.uid};
      }
      if(PREVIEW){
        persistPreviewState();
        showToast(message);
        renderManualKpi();
        renderKpi();
        return;
      }
      if(delegated){
        await setDoc(doc(state.db,'liveKpiDrafts',sessionId),{
          liveId:String(sessionId),entries,status:'pending',
          updatedBy:state.user.uid,updatedAt:serverTimestamp()
        });
      }else{
        const batch=writeBatch(state.db);
        batch.set(doc(state.db,'liveSessions',sessionId),{
          manualKpiEntries:entries,manualKpiUpdatedAt:serverTimestamp(),
          manualKpiApprovedAt:serverTimestamp(),manualKpiApprovedBy:state.user.uid,
          updatedAt:serverTimestamp()
        },{merge:true});
        if(session.kpiDraft){
          batch.set(doc(state.db,'liveKpiDrafts',sessionId),{
            liveId:String(sessionId),entries,status:'approved',
            approvedBy:state.user.uid,approvedAt:serverTimestamp(),
            updatedAt:serverTimestamp(),updatedBy:state.user.uid
          });
        }
        await batch.commit();
      }
      showToast(message);
      await loadData();
      renderAll();
    }

    async function approveManualKpiDraft(sessionId){
      if(!isAdmin()){showToast('Chỉ Admin được duyệt KPI thủ công.');return;}
      const session=state.sessions.find(s=>s.id===sessionId);
      if(!session||!isManualKpi(session)){showToast('Phiên chưa được gắn Campaign/Mega.');return;}
      if(PREVIEW){
        if(session.kpiDraft?.status!=='pending')return;
        const entries=manualKpiEditorEntries(session);
        const check=manualKpiValidation(session,entries);
        if(!check.countable){showToast('Chỉ được duyệt khi GMV đã chốt và phân bổ hợp lệ.');return;}
        session.manualKpiEntries=entries;
        session.kpiDraft={...session.kpiDraft,status:'approved',approvedBy:state.user.uid};
        persistPreviewState();renderAll();showToast('Đã duyệt KPI thủ công và cập nhật KPI nhân sự');return;
      }
      try{
        const draftRef=doc(state.db,'liveKpiDrafts',sessionId);
        const liveRef=doc(state.db,'liveSessions',sessionId);
        const assignmentRef=doc(state.db,'liveAssignments',sessionId);
        await runTransaction(state.db,async tx=>{
          const [draftSnap,liveSnap,assignmentSnap]=await Promise.all([
            tx.get(draftRef),tx.get(liveRef),tx.get(assignmentRef)
          ]);
          const draft=draftSnap.data();
          if(draft?.status!=='pending')throw new Error('Bản nháp này đã thay đổi. Hãy tải lại trước khi duyệt.');
          const live=liveSnap.data()||{};
          if(assignmentSnap.exists()&&assignmentSnap.data()?.kpiMode!=='manual')throw new Error('Phiên không còn là Campaign/Mega.');
          const entries=normalizedManualKpiEntries({manualKpiEntries:draft.entries,currency:session.currency});
          if(entries.length===0||entries.length>40||!entries.some(e=>e.role==='host'&&e.uid))
            throw new Error('Bản nháp chưa có Host hợp lệ.');
          if(entries.some(e=>!e.uid||!Number.isFinite(e.gmv)||e.gmv<0))
            throw new Error('Bản nháp có thông tin nhân sự hoặc tiền không hợp lệ.');
          const latest={...session,...live,manualKpiEntries:entries};
          const validation=manualKpiValidation(latest,entries);
          if(!validation.countable)throw new Error('GMV đã chốt không đủ hoặc vượt mức. Chưa thể duyệt.');
          tx.set(liveRef,{manualKpiEntries:entries,manualKpiUpdatedAt:serverTimestamp(),
            manualKpiApprovedAt:serverTimestamp(),manualKpiApprovedBy:state.user.uid,
            updatedAt:serverTimestamp()},{merge:true});
          tx.set(draftRef,{...draft,entries,status:'approved',
            approvedBy:state.user.uid,approvedAt:serverTimestamp(),updatedAt:serverTimestamp()});
        });
        showToast('Đã duyệt KPI thủ công và cộng vào KPI nhân sự');
        await loadData();renderAll();
      }catch(error){showToast(error?.message||'Không thể duyệt KPI thủ công');}
    }

    function bindManualKpiEditors(){
      if(!canAssignLiveStaff())return;
      document.querySelectorAll('[data-manual-session]').forEach(card=>{
        const sessionId=card.dataset.manualSession;
        card.querySelectorAll('[data-manual-entry]').forEach(bindManualKpiPair);
        card.querySelector('[data-manual-approve]')?.addEventListener('click',()=>approveManualKpiDraft(sessionId));

        card.querySelector('[data-manual-kpi-edit]')?.addEventListener('click',()=>{
          card.querySelector('[data-manual-kpi-session-summary]')?.classList.add('hidden');
          card.querySelector('[data-manual-kpi-session-editor]')?.classList.remove('hidden');
        });

        card.querySelector('[data-manual-add]')?.addEventListener('click',()=>{
          const list=card.querySelector('.manual-kpi-entries');
          const index=list.querySelectorAll('[data-manual-entry]').length;
          const session=state.sessions.find(s=>s.id===sessionId);
          list.insertAdjacentHTML('beforeend',manualKpiPairRow(session,{host:null,operator:null},index,true));
          bindManualKpiPair(list.lastElementChild);
          updateManualKpiBalance(card,session);
        });

        card.addEventListener('click',event=>{
          const toggle=event.target.closest('[data-manual-detail-toggle]');
          if(toggle){
            const row=toggle.closest('[data-manual-entry]');
            const details=row?.querySelector('[data-manual-entry-details]');
            if(details){
              const opening=details.classList.contains('hidden');
              details.classList.toggle('hidden',!opening);
              toggle.setAttribute('aria-expanded',String(opening));
              toggle.textContent=opening?'Ẩn chi tiết':'Chi tiết';
            }
            return;
          }
          const remove=event.target.closest('[data-manual-remove]');
          if(remove){
            const row=remove.closest('[data-manual-entry]');
            const rows=card.querySelectorAll('[data-manual-entry]');
            const session=state.sessions.find(s=>s.id===sessionId);
            if(rows.length===1){
              row.outerHTML=manualKpiPairRow(session,{host:null,operator:null},0,true);
              bindManualKpiPair(card.querySelector('[data-manual-entry]'));
            }else row.remove();
            updateManualKpiBalance(card,session);
          }
        });
        card.addEventListener('input',()=>{
          const session=state.sessions.find(s=>s.id===sessionId);
          updateManualKpiBalance(card,session);
        });
        card.addEventListener('change',()=>{
          const session=state.sessions.find(s=>s.id===sessionId);
          updateManualKpiBalance(card,session);
        });
        updateManualKpiBalance(card,state.sessions.find(s=>s.id===sessionId));

        card.querySelector('[data-manual-save]')?.addEventListener('click',event=>saveManualKpiSession(sessionId,event.currentTarget));
      });
    }

    function renderManualKpi(){
      if(!canAssignLiveStaff()){ $('#section-manual-kpi').innerHTML=''; return; }
      const manualSessions=sessionsForRange().filter(isManualKpi);
      const validations=manualSessions.map(session=>({session,entries:normalizedManualKpiEntries(session),validation:manualKpiValidation(session)}));
      const countable=validations.filter(x=>x.validation.countable);
      const drafts=validations.filter(x=>x.session.kpiDraft?.status==='pending'||(x.entries.length&&!x.validation.countable));
      const currency=manualSessions[0]?.currency||'VND';
      const totalManualKpi=countable.reduce((sum,x)=>sum+x.entries.reduce((s,e)=>s+Number(e.kpi||0),0),0);
      const totalManualGmv=countable.reduce((sum,x)=>sum+manualKpiHostTotal(x.entries),0);
      $('#section-manual-kpi').innerHTML=`
        ${timeFilterHtml('manual-kpi')}
        <div class="metrics-grid metrics-4">
          ${metricCard('settings','Phiên KPI thủ công',manualSessions.length)}

    function renderKpi(){
      if(!can('kpi.read')){ $('#section-kpi').innerHTML='<div class="notice bad">Bạn không có quyền xem KPI.</div>';return; }
      const monthRange=kpiMonthRange();
      const rangeSessions=kpiSessionsForMonth();
      const rows=buildKpiRows(rangeSessions);
      const manualSessions=rangeSessions.filter(isManualKpi);
      const autoSessions=rangeSessions.filter(s=>!isManualKpi(s));
      const currency=rows[0]?.currency||manualSessions[0]?.currency||autoSessions[0]?.currency||'VND';

      const totalFinalKpi=rows.reduce((a,r)=>a+r.finalKpi,0);
      const totalProvisionalKpi=rows.reduce((a,r)=>a+r.provisionalKpi,0);
      const totalProjectedKpi=totalFinalKpi+totalProvisionalKpi;
      const totalManualKpi=rows.reduce((a,r)=>a+r.manualKpi,0);
      const waitingSessions=autoSessions.filter(s=>!automaticKpiBasis(s).usable).length;
      const provisionalSessions=autoSessions.filter(s=>{const b=automaticKpiBasis(s);return b.usable&&b.status!=='final';}).length;
      const finalSessions=autoSessions.filter(s=>{const b=automaticKpiBasis(s);return b.usable&&b.status==='final';}).length;

      const pendingRows=rows
        .filter(r=>r.provisionalKpi>0||r.waitingSessions>0)
        .sort((a,b)=>(b.provisionalKpi-a.provisionalKpi)||(b.waitingSessions-a.waitingSessions));
      const finalRows=rows
        .filter(r=>r.finalKpi>0||r.finalAutoGmv>0||r.manualGmv>0)
        .sort((a,b)=>b.finalKpi-a.finalKpi);

      $('#section-kpi').innerHTML=`
        ${kpiMonthFilterHtml()}
        <div class="data-note">${icon('calendar',16)}<span><b>KPI nhân sự được tổng hợp theo tháng.</b> Đang xem ${monthRange.monthLabel}; hệ thống tự tính toàn bộ phiên trong tháng đã chọn. Chọn tháng khác ở phía trên để xem lại KPI.</span></div>
        <div class="kpi-rate-guide">
          <div class="kpi-rate-guide-icon">${icon('shield',16)}</div>
          <div class="kpi-rate-guide-copy">
            <b>Cách tính KPI mới</b>
            <span><strong>KPI tự động dùng đối soát theo từng phiên.</strong> Khi chỉ có 1 kênh nội bộ LIVE, đơn khớp thời gian được tính tạm tính; khi 2 kênh chồng giờ, SellerKBB dùng GMV TikTok riêng từng phiên và áp dụng tỷ lệ hủy/hoàn của đơn trong khung giờ để tránh cộng trùng. GMV sau khi hoàn hủy chỉ là số đã chốt. Host Livestream = <strong>0,3%</strong>; Nhân viên vận hành Livestream = <strong>0,1%</strong>.</span>
          </div>
        </div>
        <div class="notice ok"><b>KPI thủ công chỉ được coi là đã chốt khi đã kiểm tra được GMV sau khi hoàn hủy.</b> Nếu chưa có số chốt thì lưu nháp; nếu tổng GMV Host vượt số chốt thì không được cộng KPI. Phiên tự động thiếu dữ liệu đối soát cũng không lấy GMV đã ghi nhận để tính thay.</div>
        <div class="kpi-pair"><div class="pair-card"><b>Host Livestream</b><span class="tiny">${esc(staffForRole('host').map(x=>x.displayName).join(' · ')||'Chưa có nhân sự')}</span></div><div class="pair-card"><b>Nhân viên vận hành Livestream</b><span class="tiny">${esc(staffForRole('operator').map(x=>x.displayName).join(' · ')||'Chưa có nhân sự')}</span></div></div>
        <div class="metrics-grid metrics-4">
          ${metricCard('check','KPI đã chốt',fmtMoney(totalFinalKpi,currency),finalSessions+' phiên tự động đã chốt · gồm KPI thủ công')}
          ${metricCard('clock','KPI tạm tính',fmtMoney(totalProvisionalKpi,currency),provisionalSessions+' phiên còn theo dõi')}
          ${metricCard('money','KPI dự kiến',fmtMoney(totalProjectedKpi,currency),'Đã chốt + tạm tính')}
          ${metricCard('history','Chờ đối soát',waitingSessions+' phiên','Chưa đủ dữ liệu để tính')}
        </div>

        <div class="card kpi-split-card" data-kpi-table="pending">
          <div class="kpi-split-head">
            <div><h3>KPI chưa chốt</h3><div class="sub">Chỉ hiển thị phần còn thay đổi: GMV chờ đối soát, KPI tạm tính và số phiên chưa đủ dữ liệu. Không dùng bảng này để thanh toán KPI cuối cùng.</div></div>
            <div class="kpi-split-summary"><span class="pill warn">Tạm tính ${fmtMoney(totalProvisionalKpi,currency)}</span><span class="pill warn">${waitingSessions} phiên chờ đối soát</span></div>
          </div>
          ${pendingRows.length?`<div class="table-wrap kpi-pending-table"><table style="min-width:760px"><thead><tr><th>Nhân sự</th><th>Vai trò</th><th>GMV chờ đối soát</th><th>KPI tạm tính</th><th>Chờ đối soát</th></tr></thead><tbody>${pendingRows.map(r=>`<tr><td>${kpiStaffIdentityHtml(r.uid,r.name)}</td><td><span class="tag ${r.roles[0]||''}">${esc(kpiRoleSummary(r))}</span></td><td class="money">${fmtMoney(r.provisionalAutoGmv,r.currency)}</td><td class="money"><b>${fmtMoney(r.provisionalKpi,r.currency)}</b></td><td>${r.waitingSessions?'<span class="pill warn">'+r.waitingSessions+' phiên</span>':'<span class="pill ok">0</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không có KPI chưa chốt trong tháng này.</div>'}
        </div>

        <div class="card kpi-split-card" data-kpi-table="final">
          <div class="kpi-split-head">
            <div><h3>KPI đã chốt</h3><div class="sub">Chỉ hiển thị phần đã đủ điều kiện dùng để thanh toán: KPI tự động đã chốt và KPI thủ công hợp lệ.</div></div>
            <div class="kpi-split-summary"><span class="pill ok">Đã chốt ${fmtMoney(totalFinalKpi,currency)}</span></div>
          </div>
          ${finalRows.length?`<div class="table-wrap kpi-final-table"><table style="min-width:980px"><thead><tr><th>Nhân sự</th><th>Vai trò</th><th>GMV tự động đã chốt</th><th>GMV thủ công</th><th>KPI tự động đã chốt</th><th>KPI thủ công</th><th>Tổng KPI đã chốt</th></tr></thead><tbody>${finalRows.map(r=>`<tr><td>${kpiStaffIdentityHtml(r.uid,r.name)}</td><td><span class="tag ${r.roles[0]||''}">${esc(kpiRoleSummary(r))}</span></td><td class="money">${fmtMoney(r.finalAutoGmv,r.currency)}</td><td class="money manual-kpi-value">${fmtMoney(r.manualGmv,r.currency)}</td><td class="money">${fmtMoney(r.finalAutoKpi,r.currency)}</td><td class="money manual-kpi-value">${fmtMoney(r.manualKpi,r.currency)}</td><td class="money"><b>${fmtMoney(r.finalKpi,r.currency)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có KPI đã chốt trong tháng này.</div>'}
          ${totalManualKpi?'<div class="tiny" style="margin-top:2px">Trong tổng KPI đã chốt có KPI thủ công hợp lệ: <b>'+fmtMoney(totalManualKpi,currency)+'</b>.</div>':''}
        </div>

        <div class="data-note">${icon('history',16)}<span>Cùng một nhân sự có thể xuất hiện ở cả hai bảng nếu họ có phiên đã chốt và đồng thời còn phiên khác đang đối soát.</span></div>`;
      bindKpiMonthFilter();
    }

    function staffRoleLabel(role){ return role==='operator'?'Nhân viên vận hành Livestream':'Host Livestream'; }

    function renderStaff(){
      if(!isAdmin()){ $('#section-staff').innerHTML='';return; }
      const rows=[...state.staff].sort((a,b)=>(a.role===b.role?0:a.role==='host'?-1:1)||(a.sortOrder||0)-(b.sortOrder||0)||String(a.displayName).localeCompare(String(b.displayName),'vi'));
      $('#section-staff').innerHTML=`
        <div class="card">
          <div class="row space"><div><h3 class="heading-with-icon">${icon('users',18)} Quản lý nhân sự</h3><div class="sub">Nhân sự độc lập với tài khoản đăng nhập. Liên kết một Gmail đã duyệt để KPI hiển thị đúng ảnh đại diện; chỉ Admin chọn liên kết, không tự cấp thêm quyền truy cập.</div></div><span class="pill">${rows.length} nhân sự</span></div>
          <div class="staff-toolbar">
            <label><div class="tiny">Tên nhân sự</div><input id="newStaffName" class="input" placeholder="Nhập tên nhân sự"></label>
            <label><div class="tiny">Vai trò</div><select id="newStaffRole" class="input"><option value="host">Host Livestream</option><option value="operator">Nhân viên vận hành Livestream</option></select></label>
            <button id="addStaffBtn" class="btn primary" type="button">${icon('users',15)} Thêm nhân sự</button>
          </div>
          <div class="staff-list">${rows.length?rows.map(staffRowHtml).join(''):'<div class="empty">Chưa có nhân sự. Hãy thêm Host hoặc Vận hành.</div>'}</div>
        </div>`;
      $('#addStaffBtn')?.addEventListener('click',addStaffMember);
      document.querySelectorAll('[data-staff-edit]').forEach(b=>b.onclick=()=>toggleStaffEditor(b.dataset.staffEdit));
      document.querySelectorAll('[data-staff-save]').forEach(b=>b.onclick=()=>saveStaffMember(b.dataset.staffSave));
      document.querySelectorAll('[data-staff-delete]').forEach(b=>b.onclick=()=>deleteStaffMember(b.dataset.staffDelete));
    }

    function staffGoogleAccountOptions(member){
      const accounts=state.users.filter(u=>u.status==='approved'&&u.role===member.role)
        .sort((a,b)=>String(a.displayName||'').localeCompare(String(b.displayName||''),'vi'));
      return '<option value="">— Chưa liên kết Gmail —</option>'+accounts.map(u=>{
        const occupied=state.staff.some(x=>x.id!==member.id&&x.googleUid===u.id);
        return `<option value="${esc(u.id)}" ${member.googleUid===u.id?'selected':''} ${occupied?'disabled':''}>${esc(u.displayName||u.email||'Tài khoản')}${u.email?' · '+esc(u.email):''}</option>`;
      }).join('');
    }
    function staffRowHtml(member){
      return `<div class="staff-row" data-staff-row="${member.id}">
        <div class="staff-row-summary">
          <div class="staff-row-copy"><b>${esc(member.displayName)}</b><span class="tag ${member.role==='operator'?'staff-role-operator':'staff-role-host'}">${esc(staffRoleLabel(member.role))}</span>${member.googleUid?'<span class="tiny">Đã liên kết ảnh Gmail</span>':''}</div>
          <div class="staff-row-actions">
            <button class="user-icon-btn" type="button" data-staff-edit="${member.id}" aria-label="Sửa ${esc(member.displayName)}" title="Sửa nhân sự">${icon('edit',16)}</button>
            <button class="user-icon-btn danger" type="button" data-staff-delete="${member.id}" aria-label="Xóa ${esc(member.displayName)}" title="Xóa nhân sự">${icon('close',16)}</button>
          </div>
        </div>
        <div class="staff-edit-grid hidden" data-staff-editor="${member.id}">
          <label><div class="tiny">Tên nhân sự</div><input class="input" data-staff-name="${member.id}" value="${esc(member.displayName)}"></label>
          <label><div class="tiny">Vai trò</div><select class="input" data-staff-role="${member.id}"><option value="host" ${member.role==='host'?'selected':''}>Host Livestream</option><option value="operator" ${member.role==='operator'?'selected':''}>Nhân viên vận hành Livestream</option></select></label>
          <label><div class="tiny">Ảnh Gmail trên KPI</div><select class="input" data-staff-google="${member.id}" aria-label="Tài khoản Gmail của ${esc(member.displayName)}">${staffGoogleAccountOptions(member)}</select></label>
          <button class="btn primary small" type="button" data-staff-save="${member.id}">${icon('check',14)} Lưu</button>
        </div>
      </div>`;

    function toggleStaffEditor(id){
      const editor=document.querySelector(`[data-staff-editor="${CSS.escape(id)}"]`);
      if(!editor)return;
      const open=editor.classList.contains('hidden');
      document.querySelectorAll('[data-staff-editor]').forEach(x=>x.classList.add('hidden'));
      if(open)editor.classList.remove('hidden');
    }

    async function persistStaffDirectory(){
      state.staff=normalizeStaffMembers(state.staff);
      if(PREVIEW){persistPreviewState();renderAll();return;}
      await setDoc(doc(state.db,'settings','staffMembers'),{items:state.staff,updatedAt:serverTimestamp(),updatedBy:state.user?.uid||''},{merge:true});
      await loadStaffDirectory();
      renderAll();
    }

    async function addStaffMember(){
      const name=$('#newStaffName')?.value.trim()||'';
      const role=$('#newStaffRole')?.value==='operator'?'operator':'host';
      if(!name){showToast('Hãy nhập tên nhân sự');return;}
      if(state.staff.some(x=>x.role===role&&x.displayName.localeCompare(name,'vi',{sensitivity:'base'})===0)){showToast('Nhân sự này đã có trong danh sách');return;}
      state.staff.push({id:`staff-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,displayName:name,role,sortOrder:(state.staff.length+1)*10});
      await persistStaffDirectory();
      showToast('Đã thêm nhân sự');
    }

    async function saveStaffMember(id){
      const member=state.staff.find(x=>x.id===id);
      if(!member)return;
      const name=document.querySelector(`[data-staff-name="${CSS.escape(id)}"]`)?.value.trim()||'';
      const role=document.querySelector(`[data-staff-role="${CSS.escape(id)}"]`)?.value==='operator'?'operator':'host';
      if(!name){showToast('Tên nhân sự không được để trống');return;}
      if(state.staff.some(x=>x.id!==id&&x.role===role&&x.displayName.localeCompare(name,'vi',{sensitivity:'base'})===0)){showToast('Tên nhân sự này đã có trong cùng vai trò');return;}
      const googleUid=document.querySelector(`[data-staff-google="${CSS.escape(id)}"]`)?.value||'';
      const account=googleUid?state.users.find(u=>u.id===googleUid&&u.status==='approved'&&u.role===role):null;
      if(googleUid&&!account){showToast('Gmail đã chọn không thuộc đúng vai trò hoặc chưa được duyệt');return;}
      if(account&&state.staff.some(x=>x.id!==id&&x.googleUid===account.id)){showToast('Tài khoản Gmail đã liên kết với nhân sự khác');return;}
      member.displayName=name;member.role=role;
      member.googleUid=account?.id||'';
      member.googlePhotoURL=safePhotoURL(account?.photoURL);
      member.googleDisplayName=String(account?.displayName||'');
      await persistStaffDirectory();
      showToast('Đã cập nhật nhân sự');
    }

    async function deleteStaffMember(id){
      const member=state.staff.find(x=>x.id===id);
      if(!member)return;
      if(!confirm(`Bạn có chắc muốn xóa nhân sự "${member.displayName}" không?\n\nNhân sự này sẽ biến mất khỏi các ô lựa chọn mới. Dữ liệu phiên LIVE đã lưu trước đó vẫn giữ tên lịch sử.`))return;
      state.staff=state.staff.filter(x=>x.id!==id);
      await persistStaffDirectory();
      showToast('Đã xóa nhân sự');
    }

    function renderUsers(){
      if(!isAdmin()){ $('#section-users').innerHTML='';return; }
      const pending=state.users.filter(u=>u.status==='pending');
      const roleOrder={admin:0,operator:1,host:2};
      const approved=state.users.filter(u=>u.status==='approved').sort((a,b)=>(roleOrder[a.role]??9)-(roleOrder[b.role]??9)||String(a.displayName||a.email||'').localeCompare(String(b.displayName||b.email||''),'vi'));
      $('#section-users').innerHTML=`<div class="card users-pending-card ${pending.length?'':'is-empty'}"><h3 class="heading-with-icon">${icon('users',18)} Tài khoản chờ duyệt <span class="pill warn">${pending.length}</span></h3>${pending.length?pending.map(userApprovalCard).join(''):'<div class="empty">Không có tài khoản đang chờ.</div>'}</div><div class="card users-approved-card"><div class="row space"><div><h3 class="heading-with-icon">${icon('shield',18)} Tài khoản đã duyệt</h3><div class="sub">Có thể thay đổi vai trò, quyền truy cập hoặc xóa user khỏi SellerKBB.</div></div><span class="pill">${approved.length} user</span></div>${approved.length?approved.map(userApprovedRow).join(''):'<div class="empty">Chưa có tài khoản đã duyệt.</div>'}</div>`;
      document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveUser(b.dataset.approve));
      document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick=()=>toggleApprovedUserEditor(b.dataset.userEdit));
      document.querySelectorAll('[data-user-save]').forEach(b=>b.onclick=()=>saveUserAccess(b.dataset.userSave));
      document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick=()=>deleteUserAccount(b.dataset.userDelete));
      document.querySelectorAll('[data-approved-role]').forEach(s=>{
        s.onchange=()=>syncApprovedPermissionControls(s.dataset.approvedRole);
        syncApprovedPermissionControls(s.dataset.approvedRole);
      });
      document.querySelectorAll('[data-approved-perm="live.read"]').forEach(c=>c.onchange=()=>syncApprovedPermissionControls(c.dataset.approvedUid));
      document.querySelectorAll('[data-role]').forEach(c=>{
        c.onchange=()=>syncPendingPermissionControls(c.dataset.role);
        syncPendingPermissionControls(c.dataset.role);
      });
      document.querySelectorAll('[data-perm="live.read"]').forEach(c=>c.onchange=()=>syncPendingPermissionControls(c.dataset.uid));
    }

    function syncPendingPermissionControls(uid){
      const role=document.querySelector(`[data-role="${CSS.escape(uid)}"]`)?.value;
      const live=document.querySelector(`[data-uid="${CSS.escape(uid)}"][data-perm="live.read"]`);
      const assign=document.querySelector(`[data-uid="${CSS.escape(uid)}"][data-perm="live.assign"]`);
      if(!assign)return;
      const allowed=isDelegatedLiveRole(role)&&live?.checked===true;
      assign.disabled=!allowed;
      if(!allowed)assign.checked=false;
      assign.closest('[data-pending-assign-row]')?.classList.toggle('hidden',!isDelegatedLiveRole(role));
    }
    function userRoleOptions(role){
      return [['host','Host Livestream'],['operator','Nhân viên vận hành livestream'],['admin','Quản trị viên']].map(([value,label])=>`<option value="${value}" ${role===value?'selected':''}>${label}</option>`).join('');
    }

    function userApprovalCard(u){
      return `<div class="approval-item"><div class="row space">${userIdentityHtml(u,true)}<span class="pill warn">Chờ duyệt</span></div><div class="form-grid" style="margin-top:16px"><label><div class="tiny">Vai trò</div><select class="input" style="width:100%" data-role="${u.id}">${userRoleOptions('host')}</select></label><div><div class="tiny">Nội dung được phép xem</div><label class="checkline"><input type="checkbox" data-perm="live.read" data-uid="${u.id}" checked> Phiên LIVE</label><label class="checkline"><input type="checkbox" data-perm="kpi.read" data-uid="${u.id}" checked> KPI cá nhân / báo cáo</label><label class="checkline hidden" data-pending-assign-row="${u.id}"><input type="checkbox" data-uid="${u.id}" data-perm="live.assign"> Gắn Host/Vận hành, Campaign/Mega và nhập KPI nháp</label></div></div><div class="row space" style="margin-top:16px"><button class="btn danger small" data-user-delete="${u.id}">${icon('logout',14)} Xóa user</button><button class="btn primary" data-approve="${u.id}">${icon('check',15)} Duyệt tài khoản</button></div></div>`;
    }

    function userApprovedRow(u){
      const self=u.id===state.user?.uid;
      const permissions=Array.isArray(u.permissions)?u.permissions:[];
      const assignChecked=isDelegatedLiveRole(u.role)&&permissions.includes('live.read')&&permissions.includes('live.assign');
      const liveChecked=u.role==='admin'||permissions.includes('live.read');
      const kpiChecked=u.role==='admin'||permissions.includes('kpi.read');
      return `<div class="approved-user-card approved-user-row" data-approved-user="${u.id}">
        <div class="approved-user-summary">
          ${userIdentityHtml(u,true)}
          <div class="approved-user-side">

    function toggleApprovedUserEditor(uid){
      const editor=document.querySelector(`[data-user-editor="${CSS.escape(uid)}"]`);
      if(!editor)return;
      const willOpen=editor.classList.contains('hidden');
      document.querySelectorAll('[data-user-editor]').forEach(x=>x.classList.add('hidden'));
      if(willOpen){
        editor.classList.remove('hidden');
        syncApprovedPermissionControls(uid);
      }
    }

    function syncApprovedPermissionControls(uid){
      const role=document.querySelector(`[data-approved-role="${CSS.escape(uid)}"]`)?.value;
      const boxes=[...document.querySelectorAll(`[data-approved-uid="${CSS.escape(uid)}"][data-approved-perm]`)];
      if(uid===state.user?.uid)return;
      const full=role==='admin';
      boxes.forEach(x=>{x.disabled=full;if(full)x.checked=true;});
      const live=boxes.find(x=>x.dataset.approvedPerm==='live.read');
      const assign=boxes.find(x=>x.dataset.approvedPerm==='live.assign');
      if(assign){
        const allowed=isDelegatedLiveRole(role)&&live?.checked===true;
        assign.disabled=full||!allowed;
        if(!allowed)assign.checked=false;
        assign.closest('[data-approved-assign-row]')?.classList.toggle('hidden',!isDelegatedLiveRole(role));
      }
    }

    async function approveUser(uid){
      const role=document.querySelector(`[data-role="${CSS.escape(uid)}"]`).value;
      const permissions=[...document.querySelectorAll(`[data-uid="${CSS.escape(uid)}"][data-perm]:checked`)].map(x=>x.dataset.perm);
      if(role==='admin')permissions.splice(0,permissions.length,'live.read','kpi.read');
      else if(!isDelegatedLiveRole(role)||!permissions.includes('live.read')){
        const idx=permissions.indexOf('live.assign');if(idx>=0)permissions.splice(idx,1);
      }
      if(PREVIEW){
        const u=state.users.find(x=>x.id===uid);
        Object.assign(u,{role,status:'approved',permissions});
        persistPreviewState(); showToast('Đã duyệt tài khoản'); renderAll(); return;
      }
      await updateDoc(doc(state.db,'users',uid),{role,status:'approved',permissions,approvedAt:serverTimestamp(),approvedBy:state.user.uid,updatedAt:serverTimestamp()});
      showToast('Đã duyệt tài khoản'); await loadData(); renderAll();
    }

    async function saveUserAccess(uid){
      if(uid===state.user?.uid){ showToast('Không thể tự thay đổi quyền của tài khoản đang đăng nhập'); return; }
      const role=document.querySelector(`[data-approved-role="${CSS.escape(uid)}"]`)?.value||'host';
      const permissions=[...document.querySelectorAll(`[data-approved-uid="${CSS.escape(uid)}"][data-approved-perm]:checked`)].map(x=>x.dataset.approvedPerm);
      if(role==='admin')permissions.splice(0,permissions.length,'live.read','kpi.read');
      else if(!isDelegatedLiveRole(role)||!permissions.includes('live.read')){
        const idx=permissions.indexOf('live.assign');if(idx>=0)permissions.splice(idx,1);
      }
      if(PREVIEW){
        const u=state.users.find(x=>x.id===uid);
        if(u)Object.assign(u,{role,status:'approved',permissions});
        persistPreviewState(); showToast('Đã cập nhật quyền user'); renderAll(); return;
      }
      await updateDoc(doc(state.db,'users',uid),{role,status:'approved',permissions,updatedAt:serverTimestamp(),updatedBy:state.user.uid});
      showToast('Đã cập nhật quyền user'); await loadData(); renderAll();

    async function deleteUserAccount(uid){
      if(uid===state.user?.uid){ showToast('Không thể tự xóa tài khoản đang đăng nhập'); return; }
      const user=state.users.find(x=>x.id===uid);
      const name=user?.displayName||user?.email||uid;
      if(!confirm(`Bạn có chắc muốn xóa tài khoản "${name}" khỏi SellerKBB không?\n\nChọn Đồng ý để xóa. Chọn Hủy để giữ nguyên tài khoản.`))return;
      if(PREVIEW){
        state.users=state.users.filter(x=>x.id!==uid);
        persistPreviewState(); showToast('Đã xóa user'); renderAll(); return;
      }
      await deleteDoc(doc(state.db,'users',uid));
      showToast('Đã xóa user'); await loadData(); renderAll();
    }

    function estimateSessionBytes(session){
      try{
        const plain={...session};
        delete plain.rawSummary;
        return new TextEncoder().encode(JSON.stringify(plain)).length + 900;
      }catch{return 1800}
    }

    function formatStorageBytes(bytes){
      const n=Math.max(0,Number(bytes||0));
      if(n<1024)return new Intl.NumberFormat('vi-VN').format(n)+' B';
      if(n<1024*1024)return (n/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' KB';
      if(n<1024*1024*1024)return (n/1024/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' MB';
      return (n/1024/1024/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' GB';
    }

    function storagePercent(used,limit){
      if(!Number(limit))return 0;
      return Math.max(0,Math.min(100,Number(used||0)/Number(limit)*100));
    }

    function storageQuotaCard({provider,iconName,usedBytes,limitBytes,note,estimate=false,available=true}){
      const pct=storagePercent(usedBytes,limitBytes);
      const pctText=pct<0.01&&usedBytes>0?'0,01':pct.toLocaleString('vi-VN',{minimumFractionDigits:pct>=1?1:2,maximumFractionDigits:2});
      const width=usedBytes>0?Math.max(.7,pct):0;
      return `<div class="storage-quota-card">
        <div class="storage-quota-head">
          <div class="storage-provider-icon">${icon(iconName,20)}</div>
          <div class="storage-provider-copy"><b>${provider}</b><span>${estimate?'Ước tính':'Đang sử dụng'}</span></div>
          <strong>${available?pctText+'%':'—'}</strong>
        </div>
        <div class="storage-usage-line"><b>${available?formatStorageBytes(usedBytes):'Chưa lấy được'}</b><span>/ ${formatStorageBytes(limitBytes)}</span></div>
        <div class="storage-progress" role="progressbar" aria-label="Dung lượng ${esc(provider)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${available?pct.toFixed(2):'0'}"><i style="width:${available?width:0}%"></i></div>
        <div class="storage-quota-foot"><span>${available?pctText+'% / 100%':'Không có dữ liệu'}</span><small>${note}</small></div>
      </div>`;
    }

    function effectiveRetentionDays(){
      return Math.max(RECONCILIATION_PROTECTION_DAYS,Number(state.maintenance.settings.retentionDays||180));
    }
    function maintenanceStats(){
      const settings=state.maintenance.settings;
      const totalBytes=state.sessions.reduce((a,s)=>a+estimateSessionBytes(s),0)*3;
      const totalMb=totalBytes/1024/1024;
      const count=state.sessions.length;
      const retention=effectiveRetentionDays();
      const cutoff=Date.now()-retention*86400000;
      const protectCutoff=Date.now()-RECONCILIATION_PROTECTION_DAYS*86400000;
      const expired=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)<cutoff).length;
      const protectedCount=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=protectCutoff).length;
      const countPct=Math.min(999,Math.round(count/Math.max(1,Number(settings.firestoreMaxSessions||12000))*100));
      const mbPct=Math.min(999,Math.round(totalMb/Math.max(1,Number(settings.firestoreSoftLimitMb||600))*100));
      return {count,totalMb,expired,protectedCount,retention,countPct,mbPct,pressure:Math.max(countPct,mbPct)};
    }

    async function cleanupFirestoreData(emergency=false){
      const settings=state.maintenance.settings;
      const retention=effectiveRetentionDays();
      const cutoff=Date.now()-retention*86400000;
      const protectCutoff=Date.now()-RECONCILIATION_PROTECTION_DAYS*86400000;
      if(PREVIEW){
        const before=state.sessions.length;
        state.sessions=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=cutoff);
        return before-state.sessions.length;
      }
      if(!isAdmin()||!state.db)return 0;
      if(settings.autoCleanup===false && emergency)return 0;
      const sorted=[...state.sessions].sort((a,b)=>(a.startTime?.toDate?.()?.getTime?.()||0)-(b.startTime?.toDate?.()?.getTime?.()||0));
      const deleteIds=new Set();
      // Chỉ đọc/xóa tối đa 300 phiên thực sự quá hạn. Vùng 60 ngày gần nhất luôn được bảo vệ.
      const staleQuery=query(collection(state.db,'liveSessions'),where('startTime','<',Timestamp.fromMillis(cutoff)),orderBy('startTime','asc'),limit(300));
      const staleSnap=await getDocs(staleQuery);
      staleSnap.docs.forEach(d=>deleteIds.add(d.id));
      const stats=maintenanceStats();
      const threshold=Number(settings.emergencyPercent||85);
      if(settings.autoCleanup!==false && (stats.countPct>=threshold || stats.mbPct>=threshold)){
        let remainingCount=stats.count-deleteIds.size;
        let remainingBytes=stats.totalMb;
        const targetCount=Math.floor(Number(settings.firestoreMaxSessions||12000)*.70);
        const targetMb=Number(settings.firestoreSoftLimitMb||600)*.70;
        for(const item of sorted){
          if(deleteIds.has(item.id)) continue;
          const started=item.startTime?.toDate?.()?.getTime?.()||0;
          if(started>=protectCutoff) continue;
          if(remainingCount<=targetCount && remainingBytes<=targetMb) break;
          deleteIds.add(item.id);
          remainingCount--;
          remainingBytes-=estimateSessionBytes(item)*3/1024/1024;
        }
      }
      if(!deleteIds.size)return 0;
      const ids=[...deleteIds];
      for(let i=0;i<ids.length;i+=300){
        const batch=writeBatch(state.db);
        ids.slice(i,i+300).forEach(id=>batch.delete(doc(state.db,'liveSessions',id)));
        await batch.commit();
      }
      return ids.length;
    }

    function businessBackupValue(value){
      if(value===null||value===undefined)return value??null;
      if(typeof value?.toDate==='function'){
        const d=value.toDate();
        return d instanceof Date&&!Number.isNaN(d.getTime())?d.toISOString():null;
      }
      if(value instanceof Date)return value.toISOString();
      if(Array.isArray(value))return value.map(businessBackupValue);
      if(typeof value==='object'){
        const out={};
        for(const [key,item] of Object.entries(value)){
          if(typeof item==='function')continue;
          out[key]=businessBackupValue(item);
        }
        return out;
      }
      return value;
    }

    function downloadBusinessBackup(){
      if(!isAdmin()){showToast('Chỉ Admin mới được tải backup dữ liệu');return;}
      const payload={
        schema:'sellerkbb-business-backup-v1',
        appVersion:state.config?.version||'1.46.0',
        createdAt:new Date().toISOString(),
        note:'Backup nghiệp vụ không chứa TikTok access/refresh token, App Secret, Firebase service account, Cloudflare API token hoặc cookie đăng nhập.',
        liveSessions:businessBackupValue(state.sessions),
        staffMembers:businessBackupValue(state.staff),
        users:businessBackupValue(state.users.map(u=>({id:u.id,email:u.email||'',displayName:u.displayName||'',photoURL:u.photoURL||'',role:u.role||'',status:u.status||'',permissions:Array.isArray(u.permissions)?u.permissions:[]}))),
        maintenanceSettings:businessBackupValue(state.maintenance.settings)
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
      const a=document.createElement('a');
      const href=URL.createObjectURL(blob);
      a.href=href;
      a.download='sellerkbb-business-backup-'+localDateKey(new Date())+'.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(href),0);
      showToast('Đã tạo backup dữ liệu nghiệp vụ · hãy lưu file ở nơi an toàn');
    }

    async function request120DaySync(origin='tiktok',retryPending=false){
      if(!can('live.read')&&!can('kpi.read')){
        showToast('Tài khoản chưa có quyền xem dữ liệu LIVE/KPI để đồng bộ.');
        return;
      }
      if(['loading','syncing'].includes(state.dataRefresh.status)&&origin!=='dashboard'){
        showToast('Đang đồng bộ TikTok 120 ngày. Vui lòng theo dõi tiến trình.');
        return;
      }
      clearTimeout(refreshLatestData.resetTimer);
      state.manualSyncOrigin=origin;
      state.dataRefresh.status='syncing';
      state.dataRefresh.error='';
      renderDataRefreshControl();
      if(PREVIEW){
        state.autoSyncRefreshing=true;
        renderDashboard();
        await new Promise(resolve=>setTimeout(resolve,650));
        state.autoSyncStatus={ok:true,reason:'manual-preview',finishedAt:new Date().toISOString(),cached:state.sessions.length};
        state.autoSyncRefreshing=false;
        finishDataRefresh('success');
        renderAll();
        if(origin==='tiktok')showToast('Preview: đã mô phỏng đồng bộ 120 ngày thành công');
        state.manualSyncOrigin='';
        return;
      }
      try{
        const result=await api('/api/tiktok/autosync/run',{
          method:'POST',body:JSON.stringify({days:120,retryPending}),timeoutMs:15000
        });
        if(!result.accepted||!result.jobId)throw new Error('Máy chủ chưa xác nhận tác vụ đồng bộ.');
        if(origin==='tiktok')showToast(result.alreadyRunning?'Tác vụ đang chạy, tiếp tục theo dõi.':result.retryPending?'Đang kiểm tra lại đúng các phiên Affiliate còn thiếu.':'Đã bắt đầu đồng bộ 120 ngày và đối soát Affiliate theo từng chặng.');
        startManualSyncPolling(result.jobId);
        if(state.section==='tiktok')await renderTikTok();
      }catch(error){
        finishDataRefresh('error',error?.message||error);
        state.manualSyncOrigin='';
        if(origin==='tiktok')showToast('Không thể bắt đầu đồng bộ: '+(error?.message||error));
      }
    }

    async function loadVerifiedSyncSnapshot(job){
      const stamp=String(job?.snapshotAt||'');
      // Cloudflare KV reads can lag briefly between locations. Verify the
      // persisted snapshot actually includes the completed job, not just that
      // a job status was marked "success".
      for(let attempt=0;attempt<7;attempt++){
        await withTimeout(loadData(),STARTUP_TIMEOUT_MS,'Tải dữ liệu sau đồng bộ');
        if(!stamp||state.syncedSnapshotAt>=stamp)return true;
        if(attempt<6)await new Promise(resolve=>setTimeout(resolve,4500));
      }
      return false;
    }
    function startManualSyncPolling(jobId){
      if(!jobId||state.manualSyncPolling===jobId||PREVIEW)return;
      state.manualSyncPolling=jobId;
      // A sync launched in the TikTok tab or a previously opened tab has the
      // same running state as one launched from the Dashboard button.
      if(!['loading','syncing'].includes(state.dataRefresh.status)){
        state.dataRefresh.status='syncing';
        state.dataRefresh.error='';
        renderDataRefreshControl();
      }
      (async()=>{
        let missed=0;
        try{
          for(let count=0;count<240;count++){
            await new Promise(resolve=>setTimeout(resolve,3000));
            let status;
            try{
              status=await api('/api/tiktok/autosync/status',{cache:'no-store',timeoutMs:12000});
              missed=0;
            }catch(error){
              missed++;
              if(missed===3&&state.manualSyncOrigin!=='dashboard')showToast('Chưa đọc được tiến trình đồng bộ. Máy chủ vẫn có thể đang xử lý.');
              continue;
            }
            const job=status?.manualJob;
            if(!job||job.jobId!==jobId)continue;
            if(job.state==='running'){
              // Each request performs one safe backfill checkpoint. Cron resumes
              // automatically as fallback even when the user closes the page.
              api('/api/tiktok/autosync/continue',{method:'POST',body:'{}',timeoutMs:8000})
                .catch(()=>null);
              if(state.section==='tiktok'&&count%3===0)renderTikTok();
              continue;
            }
            state.manualSyncPolling='';
            const fromDashboard=state.manualSyncOrigin==='dashboard';
            state.manualSyncOrigin='';
            if(job.state==='success'||job.state==='partial'){
              state.autoSyncStatus=status.autoSync||state.autoSyncStatus;
              try{
                const fresh=await loadVerifiedSyncSnapshot(job);
                renderAll();
                bindShell();
                if(!fresh){
                  finishDataRefresh('error','Tác vụ đã xong nhưng dữ liệu tại vùng truy cập này còn cũ. Hãy cập nhật lại sau.');
                }else{
                  const missing=Number(job.affiliatePending||0);
                  state.dataRefresh.affiliatePending=missing;
                  finishDataRefresh(missing>0?'partial':'success');
                }
                if(!fromDashboard)showToast(!fresh?'Dữ liệu vừa đồng bộ chưa xuất hiện đầy đủ trên máy chủ.'
                  :Number(job.affiliatePending||0)>0
                    ?'Đã lưu '+Number(job.cached||0)+' phiên LIVE · còn '+Number(job.affiliatePending||0)+' phiên cần đối chiếu Affiliate tự động.'
                    :'Đã đồng bộ đầy đủ '+new Intl.NumberFormat('vi-VN').format(Number(job.cached||0))+' phiên LIVE');
              }catch(error){
                finishDataRefresh('error','Đồng bộ đã xong nhưng không tải được dữ liệu: '+(error?.message||error));
                if(!fromDashboard)showToast(state.dataRefresh.error);
              }
            }else{
              finishDataRefresh('error',job.error||'Đồng bộ TikTok thất bại');
              if(!fromDashboard)showToast('Đồng bộ TikTok thất bại: '+state.dataRefresh.error);
              if(state.section==='tiktok')await renderTikTok();
            }
            return;
          }
          state.manualSyncPolling='';
          const fromDashboard=state.manualSyncOrigin==='dashboard';
          state.manualSyncOrigin='';
          finishDataRefresh('error','Chưa xác nhận được kết quả đồng bộ. Kiểm tra TikTok / API.');
          if(!fromDashboard)showToast('Đồng bộ có thể còn chạy trên máy chủ. Mở lại TikTok / API để kiểm tra.');
        }catch(error){
          state.manualSyncPolling='';
          const fromDashboard=state.manualSyncOrigin==='dashboard';
          state.manualSyncOrigin='';
          finishDataRefresh('error','Không đọc được tiến trình: '+String(error?.message||error));
          if(!fromDashboard)showToast(state.dataRefresh.error);
        }
      })();
    }

        ${!status.configured?'<div class="notice">Chưa cấu hình đủ TikTok App Key / Secret / Service ID / Seller Authorization URL / KV binding.</div>':''}
        <details class="card api-disclosure" data-readiness-card data-tiktok-disclosure="readiness" ${tiktokDisclosureIsOpen('readiness',!readinessReady)?'open':''}>
          <summary class="row space auth-summary"><div><h3 class="heading-with-icon">${icon('shield',18)} Kiểm tra sẵn sàng chạy thật</h3><div class="sub">Chỉ bắt đầu dùng KPI tiền thật khi các mục chính đã đạt và scopes đã được kiểm tra.</div></div><span class="pill ${readinessReady?'ok':readinessWarn?'warn':'bad'}">${readinessLabel}</span><span class="auth-chevron" aria-hidden="true">⌄</span></summary>
          <div class="status-grid" data-readiness-grid>
            ${readinessItem(checks.firebaseConfig===true,'Firebase',checks.firebaseConfig?'Web Config đã đủ':'Chưa đủ Firebase Web Config')}
            ${readinessItem(checks.tiktokConfig===true,'TikTok App',checks.tiktokConfig?'App/Secret/Service ID/KV đã đủ':'Thiếu cấu hình TikTok hoặc KV')}
            ${readinessItem(checks.sellerToken===true&&checks.refreshToken===true,'Seller Token',checks.sellerToken&&checks.refreshToken?'Có Access Token + Refresh Token':'Chưa có đủ token')}
            ${readinessItem(readiness.scopesReported&&!(readiness.missingScopes||[]).length,'Scopes',scopeDetail,!readiness.scopesReported)}
            ${readinessItem(checks.autoSync===true,'Đồng bộ',checks.autoSync?'Lần đồng bộ gần nhất thành công':'Chưa có lần đồng bộ thành công')}
          </div>
        </details>
        <details class="card creator-auth-card api-disclosure" data-creator-auth-card data-tiktok-disclosure="creators" ${tiktokDisclosureIsOpen('creators',creatorConnectedCount!==2)?'open':''}>
          <summary class="creator-auth-head auth-summary">
            <div><h3 class="heading-with-icon">${icon('live',18)} Creator Authorization</h3><p>Kết nối riêng hai tài khoản LIVE · Xem chi tiết khi cần làm mới hoặc ủy quyền lại.</p></div>
            <span class="pill ${creatorConnectedCount===2?'ok':creatorConnectedCount?'warn':''}">${creatorConnectedCount}/2 đã kết nối</span><span class="auth-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="creator-channel-grid">${creatorChannels.map(creatorChannelCardHtml).join('')}</div>
          <div class="creator-safety-note">Mỗi Creator có <b>Access Token + Refresh Token riêng</b>. SellerKBB tự kiểm tra mỗi giờ và làm mới Access Token khi gần hết hạn; giá trị token bí mật không hiển thị. Callback vẫn kiểm tra <b>user_type = 1</b>, đủ scope và đúng username.</div>
        </details>
        <div class="status-grid">
          <div class="status-item">${icon('refresh')}<div><span>Refresh Token</span><b>${status.autoRefresh?'Tự gia hạn · Access Token hết hạn '+accessExpiry:'Chưa có refresh token'}</b><small>Refresh Token hết hạn: ${refreshExpiry}</small></div></div>
          <div class="status-item">${icon('sync')}<div><span>Đồng bộ tự động</span><b>Mỗi 1 giờ · chạy 24/24</b><small>Lần gần nhất: ${lastSync}</small></div></div>
          <div class="status-item">${icon('database')}<div><span>Dữ liệu cache</span><b>${new Intl.NumberFormat('vi-VN').format(Number(sync.cached||0))} phiên LIVE</b><small>Đối soát 30 ngày gần nhất mỗi ngày</small></div></div>
        </div>
        <div class="api-foot">
          <div><b>LIVE Performance API</b><span>/analytics/202509/shop_lives/performance</span></div>
          <div class="row">
            ${status.configured&&!status.connected?'<button id="connectTikTok" class="btn primary">'+icon('link')+' Kết nối TikTok Seller</button>':''}
            ${status.connected?'<button id="syncTikTokNow" class="btn primary" '+(manualRunning?'disabled aria-busy="true"':'')+'>'+icon(manualRunning?'refresh':'sync')+(manualRunning?' Đang đồng bộ trên máy chủ…':manualIncomplete?' Kiểm tra lại Affiliate còn thiếu':' Đồng bộ ngay 120 ngày')+'</button>':''}
            ${status.connected?'<button id="checkTikTok" class="btn">'+icon('check')+' Kiểm tra trạng thái</button>':''}
          </div>
        </div>
        ${manualJobNotice}
        ${sync.error?`<div class="notice bad">Đồng bộ gần nhất gặp lỗi: ${esc(sync.error)}</div>`:''}
        ${status.grantedScopes?.length?`<div class="scope-line tiny">Scopes: ${esc(status.grantedScopes.join(', '))}</div>`:''}`;

      bindTikTokDisclosures();
      $('#section-tiktok').querySelectorAll('[data-refresh-creator]').forEach(button=>button.onclick=async()=>{
        const channel=button.dataset.refreshCreator;
        const old=button.innerHTML;
        button.disabled=true; button.setAttribute('aria-busy','true'); button.innerHTML=icon('refresh',14)+' Đang làm mới...';
        try{
          await api('/api/tiktok/creator/refresh',{method:'POST',body:JSON.stringify({channel})});
          showToast('Đã làm mới token Creator @'+channel);
          await renderTikTok();
        }catch(e){
          showToast('Làm mới token thất bại: '+e.message);
          if(button?.isConnected){button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=old;}
        }
      });
      $('#section-tiktok').querySelectorAll('[data-connect-creator]').forEach(button=>button.onclick=async()=>{
        const channel=button.dataset.connectCreator;
        const old=button.innerHTML;
        button.disabled=true; button.setAttribute('aria-busy','true'); button.innerHTML=icon('refresh',14)+' Đang mở TikTok...';
        try{
          const result=await api('/api/tiktok/creator/oauth/start',{method:'POST',body:JSON.stringify({channel})});
          location.href=result.url;
        }catch(e){
          showToast('Không thể mở Creator Authorization: '+e.message);
          button.disabled=false; button.removeAttribute('aria-busy'); button.innerHTML=old;
        }
      });
      if($('#connectTikTok')) $('#connectTikTok').onclick=async()=>{try{const result=await api('/api/tiktok/oauth/start',{method:'POST'});location.href=result.url}catch(e){showToast(e.message)}};
      if($('#checkTikTok')) $('#checkTikTok').onclick=()=>showToast(status.connected?'Kết nối đang hoạt động · đồng bộ 24/24 đã bật':'TikTok chưa kết nối');
      const creatorCallbackParams=new URLSearchParams(location.search);
      if(creatorCallbackParams.get('tiktok_creator')==='connected'){
        const connectedChannel=creatorCallbackParams.get('channel')||'Creator';
        showToast('Đã kết nối Creator @'+connectedChannel);
        history.replaceState(null,'',location.pathname);
      }
      if(manualRunning){
        startManualSyncPolling(manualJob.jobId);
        if(!state.manualSyncKickoff||state.manualSyncKickoff!==manualJob.jobId){
          state.manualSyncKickoff=manualJob.jobId;
          api('/api/tiktok/autosync/continue',{method:'POST',body:'{}',timeoutMs:8000}).catch(()=>null);
        }
      }
      if($('#syncTikTokNow'))$('#syncTikTokNow').onclick=()=>request120DaySync('tiktok',manualIncomplete);
    }

    function renderAll(){ renderNav(); renderDashboard(); renderLive(); renderReconcile(); renderKpi(); renderManualKpi(); renderExport(); renderUsers(); renderStaff(); renderTikTok(); renderStorage(); switchSection(state.section); }

    init().catch(e=>{
      console.error('app init',e);
      showBoot(`<b>Không khởi động được ứng dụng.</b><br><br>${esc(e?.message||'Lỗi không xác định')}<br><br><span class="tiny">Hệ thống đã dừng an toàn thay vì hiển thị trang trắng.</span>`, '<button id="retryBoot" class="btn primary">Thử tải lại</button>');
      const retry=$('#retryBoot'); if(retry)retry.onclick=()=>location.reload();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SellerKBB · TikTok LIVE Report</title>
  <meta name="theme-color" content="#fff4f9" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#fff8fb;
  --bg-soft:#fff1f7;
  --surface:#ffffff;
  --surface-soft:#fff5fa;
  --surface-strong:#fde8f2;
  --line:#efd7e3;
  --line-strong:#e6b9cf;
  --text:#422d38;
  --muted:#856d79;
  --accent:#eb8db9;
  --accent-strong:#d96ca3;
  --accent-soft:#fde4f0;
  --danger:#cc5e79;
  --danger-soft:#fff0f3;
  --warn:#946b20;
  --warn-soft:#fff8e6;
  --ok:#3f8c72;
  --ok-soft:#eef9f5;
  --shadow-sm:0 2px 8px rgba(144,77,111,.045);
  --shadow-md:0 8px 24px rgba(144,77,111,.07);
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html{
  background:var(--bg);
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 0 -10%,rgba(248,196,220,.48) 0,transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(255,224,238,.62) 0,transparent 25%),
    var(--bg);
  font-size:clamp(13px,.22vw + 12.2px,15px);
  line-height:1.55;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.boot{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.boot-card{
  width:min(100%,680px);
  padding:30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(16px);
}
.brand{
  color:#58394a;
  font-size:28px;
  font-weight:900;
  letter-spacing:-.045em;
}
.brand b{color:var(--accent-strong)}
.sub{
  color:var(--muted);
  font-size:clamp(12px,.18vw + 11.5px,14px);
  line-height:1.65;
}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.grid{display:grid;gap:12px}
.tiny{
  color:var(--muted);
  font-size:clamp(11px,.14vw + 10.5px,12.5px);
  line-height:1.45;
}

.btn,.page-btn,.range-btn,.menu-toggle,.nav button{
  position:relative;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,opacity .18s ease,color .18s ease;
}
.btn{
  min-height:40px;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(144,77,111,.04);
}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.btn:active,.page-btn:active,.range-btn:active,.menu-toggle:active,.nav button:active{transform:scale(.965)}
.btn.fx-press,.page-btn.fx-press,.range-btn.fx-press,.menu-toggle.fx-press,.nav button.fx-press{transform:scale(.97)}
.btn.primary{
  border-color:#e79abd;
  background:linear-gradient(135deg,#f6b0d2,var(--accent));
  color:#522c40;
}
.btn.danger{
  border-color:#f0c9d3;
  background:var(--danger-soft);
  color:var(--danger);
}
.btn.ghost{background:rgba(255,255,255,.62)}
.btn.small{min-height:32px;padding:5px 9px;font-size:11.5px}
.btn:disabled,.page-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.btn::after,.nav button::after,.page-btn::after,.range-btn::after,.menu-toggle::after{
  content:'';
  position:absolute;
  left:var(--tap-x,50%);
  top:var(--tap-y,50%);
  width:12px;height:12px;
  border-radius:50%;
  background:rgba(217,109,164,.20);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
}
.btn.fx-ripple::after,.nav button.fx-ripple::after,.page-btn.fx-ripple::after,.range-btn.fx-ripple::after,.menu-toggle.fx-ripple::after{
  animation:fx-ripple .48s ease-out;
}
@keyframes fx-ripple{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.65}
  100%{transform:translate(-50%,-50%) scale(18);opacity:0}
}

.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #f2cade;
  border-radius:999px;
  background:var(--accent-soft);
  color:#8d4969;
  font-weight:700;
  white-space:nowrap;
}
.pill{padding:5px 9px;font-size:clamp(10.5px,.12vw + 10px,12px)}
.tag{padding:4px 7px;font-size:clamp(10px,.1vw + 9.8px,11.5px)}
.pill.ok{border-color:#cce7dd;background:var(--ok-soft);color:var(--ok)}
.pill.warn{border-color:#eadcaf;background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:#efc8d2;background:var(--danger-soft);color:var(--danger)}
.tag.host{border-color:#f0c3d9;background:#fff0f7;color:#a34773}
.tag.operator{border-color:#eadcaf;background:#fff9e9;color:#856527}
.tag.admin{border-color:#cce5db;background:#f0faf6;color:#477d6c}

#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  height:100vh;
  padding:20px;
  border-right:1px solid var(--line);
  background:rgba(255,247,251,.91);
  backdrop-filter:blur(18px);
}
.side-brand{padding:6px 10px 20px}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#806876;
  text-align:left;
  font-weight:700;
  cursor:pointer;
}
.nav button:hover{border-color:var(--line);background:#fff;color:#5d3e4d}
.nav button.active{
  border-color:#efc8da;
  background:linear-gradient(135deg,#fff,#fde8f2);
  color:#8e4268;
  box-shadow:0 6px 17px rgba(190,89,140,.09);
}
.nav-icon{width:23px;text-align:center;font-size:16px}
.side-bottom{position:absolute;left:20px;right:20px;bottom:20px}
.userbox{
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(255,255,255,.9);
  box-shadow:var(--shadow-sm);
}
.avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--accent-soft);
  object-fit:cover;
}

.main{min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px clamp(16px,2vw,28px);
  border-bottom:1px solid var(--line);
  background:rgba(255,251,253,.88);
  backdrop-filter:blur(16px);
}
.topbar-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.page-title{
  margin:0;
  color:#513544;
  font-size:clamp(20px,.75vw + 17px,26px);
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.03em;
}
.content{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:clamp(18px,2vw,28px) clamp(14px,2vw,28px) 64px;
}
.section{display:none}
.section.active{
  display:flex;
  flex-direction:column;
  gap:clamp(14px,1.4vw,20px);
  animation:section-enter .22s ease-out both;
}
@keyframes section-enter{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  padding:clamp(14px,1.3vw,18px);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:rgba(255,255,255,.92);
  box-shadow:none;
  transition:border-color .18s ease,background-color .18s ease;
}
.card h3{
  margin:0 0 9px;
  color:#583849;
  font-size:clamp(14px,.3vw + 13px,17px);
  line-height:1.4;
}
.card>.row.space:first-child{gap:10px;margin-bottom:10px}
.stats{
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:12px;
}
.stats .card{min-height:0;padding:clamp(13px,1.2vw,17px)}
.stat-label{
  color:var(--muted);
  font-size:clamp(11px,.18vw + 10.5px,13px);
  font-weight:600;
}
.stat-value{
  margin-top:5px;
  color:#673f54;
  font-size:clamp(18px,.75vw + 15px,25px);
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere;
}

.toolbar,.time-filter{
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:11px 13px;
}
.time-filter{padding:11px 12px}
.range-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.range-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.range-btn{
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#715665;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.range-btn:hover{border-color:var(--line-strong);background:#fff8fb}
.range-btn.active{
  border-color:#e7abc7;
  background:var(--accent-soft);
  color:#944c70;
}
.range-summary{
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.range-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
  align-items:center;
}
.custom-range{
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.range-field{
  display:grid;
  gap:4px;
  min-width:150px;
}
.range-field>span{
  color:var(--muted);
  font-size:10.5px;
  font-weight:700;
}
.range-separator{
  align-self:center;
  color:var(--muted);
  font-size:11px;
}
.date-text{width:150px}
.input{
  min-height:40px;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.input:focus{
  outline:0;
  border-color:var(--accent-strong);
  box-shadow:0 0 0 4px rgba(238,147,189,.12);
}
.input option{background:#fff;color:var(--text)}
.month-select{min-width:190px}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  scrollbar-color:#edb3ce transparent;
  scrollbar-width:thin;
}
table{
  width:100%;
  min-width:1050px;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #f4e5ec;
  text-align:left;
  vertical-align:middle;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:#fff4f9;
  color:#7c6070;
  font-size:clamp(10.5px,.16vw + 10px,12px);
  line-height:1.35;
  font-weight:800;
}
td{
  color:#543c49;
  font-size:clamp(11.5px,.16vw + 11px,13px);
  line-height:1.45;
}
td b{font-size:clamp(12px,.18vw + 11.5px,13.5px)}
tbody tr:hover td{background:#fffafd}
.money{color:#73485d;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:12px}

.notice{
  padding:11px 13px;
  border:1px solid #eadcaf;
  border-radius:8px;
  background:var(--warn-soft);
  color:#74551c;
  font-size:clamp(12px,.16vw + 11.5px,13.5px);
  line-height:1.55;
}
.notice.bad{border-color:#efc8d2;background:var(--danger-soft);color:#a84d63}
.notice.ok{border-color:#cce6dc;background:var(--ok-soft);color:#397761}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkline{
  min-height:25px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#664c59;
  font-size:clamp(11.5px,.15vw + 11px,13px);
}
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair-card{
  padding:clamp(12px,1vw,16px);
  border:1px solid var(--line);
  border-radius:9px;
  background:linear-gradient(135deg,#fff,#fff4f9);
}
.pair-card b{
  display:block;
  margin-bottom:3px;
  color:#704259;
  font-size:clamp(12.5px,.2vw + 12px,14px);
}
.approval-item{
  margin-top:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-soft);
}
.approved-user-row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.approved-user-row:last-child{border-bottom:0;padding-bottom:0}

.mobile-live-list{display:none}
.mobile-live-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  box-shadow:none;
}
.mobile-live-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.mobile-live-title{
  color:#553848;
  font-size:clamp(12.5px,.55vw + 10.5px,14px);
  line-height:1.4;
  font-weight:800;
}
.mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-field{
  min-width:0;
  padding:9px 10px;
  border:1px solid #f5dce8;
  border-radius:10px;
  background:var(--surface-soft);
}
.mobile-field .tiny{display:block;margin-bottom:2px}
.mobile-field strong{
  display:block;
  color:#614052;
  font-size:clamp(12px,.45vw + 10.5px,13.5px);
  line-height:1.35;
  overflow-wrap:anywhere;
}
.mobile-assign{
  display:grid;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line-strong);
}
.mobile-assign .input{width:100%;min-width:0!important}
.mobile-live-list .btn{width:100%}

.pagination-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.82);
  box-shadow:none;
}
.pagination-info{
  color:var(--muted);
  font-size:clamp(10.5px,.14vw + 10px,12px);
}
.pagination{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:wrap;
}
.page-btn{
  min-width:32px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:#744a5f;
  font-size:clamp(11px,.12vw + 10.5px,12px);
  font-weight:700;
  cursor:pointer;
}
.page-btn:hover:not(:disabled){border-color:var(--line-strong);background:#fff7fb}
.page-btn.active{border-color:#e5a9c6;background:var(--accent-soft);color:#954c70}
.page-ellipsis{min-width:22px;text-align:center;color:var(--muted)}

.menu-toggle{display:none}
.mobile-menu-overlay{display:none}
.action-toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:120;
  max-width:min(88vw,420px);
  padding:10px 14px;
  border:1px solid #cbe5dc;
  border-radius:8px;
  background:rgba(246,253,250,.98);
  color:#397964;
  box-shadow:0 12px 34px rgba(106,62,84,.18);
  font-weight:700;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,14px);
  transition:opacity .2s ease,transform .2s ease;
}
.action-toast.show{opacity:1;transform:translate(-50%,0)}

@media(hover:hover){
  .card:hover{box-shadow:0 11px 28px rgba(144,77,111,.09)}
  .nav button:hover{transform:translateX(2px)}
  .mobile-live-card:hover{transform:translateY(-1px)}
}

@media(max-width:1050px) and (min-width:701px){
  #app{grid-template-columns:86px minmax(0,1fr)}
  .sidebar{padding:16px 10px}
  .side-brand .brand span,.nav button span:not(.nav-icon),.side-bottom .usertext{display:none}
  .nav button{justify-content:center;padding:11px 7px}
  .nav-icon{font-size:18px}
  .side-bottom{left:10px;right:10px}
  .userbox{justify-content:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
  body{font-size:14px;background:linear-gradient(180deg,#fff4f9 0,#fffafd 38%,#fff8fb 100%)}
  #app{display:block}
  .topbar{min-height:62px;padding:8px 11px}
  .topbar-title-wrap{gap:9px}
  .page-title{font-size:clamp(19px,5.2vw,22px)}
  .topbar .pill{display:none}
  .topbar .btn{min-height:34px;padding:6px 9px;font-size:10.5px}
  .content{padding:12px 10px 28px}
  .section.active{gap:12px}
  .tiny{font-size:11.5px}
  .card{padding:12px;border-radius:13px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats .card{padding:11px 12px}
  .stat-label{font-size:11.5px}
  .stat-value{font-size:clamp(18px,4.9vw,21px)}
  .card h3{font-size:14px}
  .btn,.input{min-height:40px;font-size:13px}
  .pill{font-size:11px}
  .form-grid,.kpi-pair{grid-template-columns:1fr}
  .desktop-live-table{display:none}
  .mobile-live-list{display:grid;gap:10px}
  .mobile-live-card{padding:12px}
  .mobile-live-title{font-size:13.5px}
  .mobile-field strong{font-size:13px}
  #section-live>.live-list-card{
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
  }
  .pagination-wrap{flex-direction:column;align-items:stretch;gap:8px;padding:9px}
  .pagination-info{text-align:center;font-size:11px;line-height:1.45}
  .pagination{justify-content:center}
  .page-btn{min-width:32px;height:32px;font-size:11.5px}
  .range-row{align-items:stretch}
  .range-tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .range-btn{min-width:0;padding:7px 5px;font-size:11px}
  .range-summary{width:100%;text-align:center}
  .range-actions{width:100%;margin-left:0}
  .range-actions .btn{flex:1}
  .custom-range{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:end;
    gap:8px;
  }
  .range-field{min-width:0}
  .date-text{width:100%}
  .range-separator{display:none}
  .custom-range>.btn{grid-column:1/-1;width:100%}

  .menu-toggle{
    display:grid;
    place-items:center;
    width:40px;height:40px;min-width:40px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:#70465a;
    font-size:21px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .mobile-menu-overlay{
    display:block;
    position:fixed;
    inset:0;
    z-index:39;
    background:rgba(69,42,56,.26);
    backdrop-filter:blur(2px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease,visibility .22s ease;
  }
  .mobile-menu-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
  .sidebar{
    position:fixed!important;
    z-index:40!important;
    top:0!important;
    bottom:0!important;
    left:0!important;

  <script type="module">
    const FIREBASE_VERSION = "12.19.0";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
    const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`);
    const { getFirestore, doc, getDoc, setDoc, updateDoc, getDocs, collection, query, orderBy, where, limit, writeBatch, serverTimestamp, Timestamp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);

    const $ = (s) => document.querySelector(s);
    const esc = (v="") => String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const fmtMoney = (v,currency="VND") => {
      const n=Number(v||0), code=currency||'VND';
      if(code==='VND') return `${new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)} đ`;
      try{return new Intl.NumberFormat('vi-VN',{style:'currency',currency:code,currencyDisplay:'name',maximumFractionDigits:2}).format(n)}
      catch{return `${new Intl.NumberFormat('vi-VN').format(n)} ${code}`}
    };
    const fmtDate = (ts) => {
      if(!ts)return '—';
      const d=ts?.toDate?ts.toDate():new Date(Number(ts)*1000);
      const day=String(d.getDate()).padStart(2,'0'), month=String(d.getMonth()+1).padStart(2,'0'), year=d.getFullYear();
      const hour=String(d.getHours()).padStart(2,'0'), minute=String(d.getMinutes()).padStart(2,'0');
      return `${day}/${month}/${year} lúc ${hour} giờ ${minute} phút`;
    };
    const fmtDuration = seconds => {
      const total=Math.max(0,Number(seconds||0));
      const hours=Math.floor(total/3600), minutes=Math.floor(total%3600/60);
      if(hours<=0) return `${minutes} phút`;
      return `${hours} giờ ${String(minutes).padStart(2,'0')} phút`;
    };
    const roleLabel = r => ({admin:'Quản trị viên',host:'Host Livestream',operator:'Nhân viên vận hành livestream',pending:'Chờ duyệt'}[r]||r||'Chưa gán');
    const pad2 = n => String(n).padStart(2,'0');
    const localDateKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const displayDateKey = key => {
      const m=String(key||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m?`${m[3]}/${m[2]}/${m[1]}`:'';
    };
    const parseDisplayDate = value => {
      const m=String(value||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!m)return null;
      const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
      const d=new Date(year,month-1,day);
      if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)return null;
      d.setHours(0,0,0,0);
      return d;
    };
    function selectedRange(){
      const today=new Date(); today.setHours(0,0,0,0);
      let start=new Date(today), endInclusive=new Date(today);
      if(state.rangeMode==='7d') start.setDate(start.getDate()-6);
      else if(state.rangeMode==='30d') start.setDate(start.getDate()-29);
      else if(state.rangeMode==='custom'){
        const a=state.customStart?new Date(state.customStart+'T00:00:00'):null;
        const b=state.customEnd?new Date(state.customEnd+'T00:00:00'):null;
        if(a&&!Number.isNaN(a.getTime())) start=a;
        if(b&&!Number.isNaN(b.getTime())) endInclusive=b;
        if(start>endInclusive){ const t=start; start=endInclusive; endInclusive=t; }
      }
      const endExclusive=new Date(endInclusive); endExclusive.setDate(endExclusive.getDate()+1);
      const startKey=localDateKey(start), endKey=localDateKey(endInclusive);
      const label=startKey===endKey?displayDateKey(startKey):`${displayDateKey(startKey)} – ${displayDateKey(endKey)}`;
      return {start,endInclusive,endExclusive,startKey,endKey,label};
    }
    function sessionsForRange(){
      const {start,endExclusive}=selectedRange();
      return state.sessions.filter(s=>{
        const d=s.startTime?.toDate?.()||new Date(0);
        return d>=start&&d<endExclusive;
      });
    }
    function timeFilterHtml(scope,actions=''){
      const selected=selectedRange();
      const opts=[['today','Hôm nay'],['7d','7 ngày'],['30d','30 ngày'],['custom','Chọn ngày']];
      const custom=state.rangeMode==='custom'?`
        <div class="custom-range">
          <label class="range-field"><span>Từ ngày</span><input id="${scope}RangeStart" class="input date-text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${displayDateKey(state.customStart)}"></label>
          <span class="range-separator">đến</span>
          <label class="range-field"><span>Đến ngày</span><input id="${scope}RangeEnd" class="input date-text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${displayDateKey(state.customEnd)}"></label>
          <button class="btn primary" data-apply-range="${scope}">Áp dụng</button>
        </div>`:''; 
      return `<div class="time-filter">
        <div class="range-row">
          <div class="range-tabs">${opts.map(([key,label])=>`<button class="range-btn ${state.rangeMode===key?'active':''}" data-range-mode="${key}">${label}</button>`).join('')}</div>
          <div class="range-summary">${selected.label}</div>
          ${actions?`<div class="range-actions">${actions}</div>`:''}
        </div>
        ${custom}
      </div>`;
    }
    function bindTimeFilter(scope){
      const section=$(`#section-${scope}`);
      if(!section)return;
      section.querySelectorAll('[data-range-mode]').forEach(btn=>btn.onclick=()=>{
        const mode=btn.dataset.rangeMode;
        state.rangeMode=mode;
        if(mode==='custom'&&(!state.customStart||!state.customEnd)){
          const today=new Date(); today.setHours(0,0,0,0);
          const from=new Date(today); from.setDate(from.getDate()-6);
          state.customStart=localDateKey(from); state.customEnd=localDateKey(today);
        }
        state.livePage=1; renderAll();
      });
      const apply=section.querySelector(`[data-apply-range="${scope}"]`);
      if(apply) apply.onclick=()=>{
        const a=parseDisplayDate(section.querySelector(`#${scope}RangeStart`)?.value);
        const b=parseDisplayDate(section.querySelector(`#${scope}RangeEnd`)?.value);
        if(!a||!b){ showToast('Ngày không hợp lệ. Hãy nhập theo dạng DD/MM/YYYY'); return; }
        state.customStart=localDateKey(a); state.customEnd=localDateKey(b);
        state.livePage=1; renderAll();
      };
    }
    const PREVIEW = location.pathname === '/preview' || new URLSearchParams(location.search).get('preview') === '1';

    const LIVE_PAGE_SIZE = 20;
    const state = { config:null, auth:null, db:null, user:null, profile:null, sessions:[], users:[], section:'dashboard', livePage:1, rangeMode:'30d', customStart:'', customEnd:'', maintenance:{settings:{retentionDays:180,autoCleanup:true,emergencyPercent:85,firestoreSoftLimitMb:600,firestoreMaxSessions:12000,kvSoftKeyLimit:5000},cloudflare:{keyCount:0,lastRun:null},firebase:{freePlanMode:true,ttlEnabled:false,ttlRecommended:false}} };

    function previewTs(iso){ return {toDate:()=>new Date(iso)}; }
    function enterPreview(){
      state.config={version:'1.5.5-preview',tiktokConfigured:true};
      state.user={uid:'preview-admin',email:'admin@sellerkbb.demo',displayName:'Quản trị viên Demo',photoURL:''};
      state.profile={role:'admin',status:'approved',displayName:'Quản trị viên Demo',permissions:['live.read','kpi.read']};
      state.maintenance={settings:{retentionDays:180,autoCleanup:true,emergencyPercent:85,firestoreSoftLimitMb:600,firestoreMaxSessions:12000,kvSoftKeyLimit:5000},cloudflare:{keyCount:4,lastRun:{ranAt:new Date().toISOString(),deleted:0}},firebase:{freePlanMode:true,ttlEnabled:false,ttlRecommended:false}};
      state.users=[
        {id:'thao-my',displayName:'Thảo My',email:'thaomy@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'hung-bg',displayName:'Hùng Bắc Giang',email:'hungbg@sellerkbb.demo',role:'operator',status:'approved',permissions:['live.read','kpi.read']},
        {id:'dung',displayName:'Dung',email:'dung@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'tam',displayName:'Tâm',email:'tam@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'hung-hh',displayName:'Hùng Hiền Hòa',email:'hunghh@sellerkbb.demo',role:'operator',status:'approved',permissions:['live.read','kpi.read']},
        {id:'pending-01',displayName:'Nguyễn Minh Anh',email:'minhanh@example.com',role:'pending',status:'pending',permissions:[]},
        {id:'preview-admin',displayName:'Quản trị viên Demo',email:'admin@sellerkbb.demo',role:'admin',status:'approved',permissions:['live.read','kpi.read']}
      ];
      const base=[
        ['LIVE-202610-001','Mega Live 10.10 - Ca sáng','sellerkbb_official','743820194','2026-10-10T02:00:00+07:00',10800,186500000,1240,174320000,'thao-my','Thảo My','hung-bg','Hùng Bắc Giang'],
        ['LIVE-202610-002','Flash Sale buổi trưa','sellerkbb_official','743820194','2026-10-10T06:30:00+07:00',7200,93200000,611,88750000,'dung','Dung','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-003','Deal tối độc quyền','sellerkbb_official','743820194','2026-10-10T12:00:00+07:00',14400,241800000,1604,226910000,'tam','Tâm','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-004','Live săn voucher cuối tuần','sellerkbb_beauty','881003522','2026-10-12T13:15:00+07:00',12600,154900000,983,148210000,'thao-my','Thảo My','hung-bg','Hùng Bắc Giang'],
        ['LIVE-202610-005','Brand Day - Prime Time','sellerkbb_official','743820194','2026-10-15T12:30:00+07:00',16200,312400000,2018,294860000,'dung','Dung','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-006','Live chốt đơn cuối ngày','sellerkbb_beauty','881003522','2026-10-18T13:00:00+07:00',9000,128600000,802,121970000,'tam','Tâm','hung-bg','Hùng Bắc Giang']
      ];
      state.sessions=base.map(x=>({id:x[0],liveId:x[0],title:x[1],channelUsername:x[2],channelId:x[3],startTime:previewTs(x[4]),durationSeconds:x[5],recordedGmvAmount:x[6],recordedItemsSold:x[7],currentItemsSold:x[7],currentGmvAmount:x[8],finalGmvAmount:x[8],currency:'VND',hostUid:x[9],hostName:x[10],operatorUid:x[11],operatorName:x[12]}));

        const gmv=72000000+i*4200000, final=Math.round(gmv*(.91+(i%5)*.01)), items=420+i*37;
        state.sessions.push({id:`LIVE-202610-${String(i).padStart(3,'0')}`,liveId:`LIVE-202610-${String(i).padStart(3,'0')}`,title:`Phiên LIVE mẫu #${i}`,channelUsername:i%2?'sellerkbb_official':'sellerkbb_beauty',channelId:i%2?'743820194':'881003522',startTime:previewTs(`2026-10-${d}T12:30:00+07:00`),durationSeconds:7200+(i%4)*1800,recordedGmvAmount:gmv,recordedItemsSold:items,currentItemsSold:items,currentGmvAmount:final,finalGmvAmount:final,currency:'VND',hostUid:host[0],hostName:host[1],operatorUid:op[0],operatorName:op[1]});
      }
      showApp(); bindShell(); renderAll();
      const bar=document.createElement('div');
      bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:15;background:#f7c5dc;color:#653a50;padding:8px 12px;border:1px solid #edb4cf;border-radius:999px;font-weight:800;font-size:10px;box-shadow:0 8px 24px rgba(156,91,124,.16);white-space:nowrap';
      bar.textContent='PREVIEW MODE · Dữ liệu mẫu · Không ảnh hưởng hệ thống thật';
      document.body.appendChild(bar);
    }

    function showBoot(message, actions='') { $('#boot').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#bootText').innerHTML=message; $('#bootActions').innerHTML=actions; }
    function showApp(){ $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); }
    function can(p){ return state.profile?.role==='admin' || (state.profile?.status==='approved' && (state.profile?.permissions||[]).includes(p)); }
    function isAdmin(){ return state.profile?.role==='admin' && state.profile?.status==='approved'; }

    async function api(path, options={}){
      const token = state.user ? await state.user.getIdToken() : null;
      const headers = { ...(options.headers||{}) };
      if(token) headers.authorization=`Bearer ${token}`;
      if(options.body && !headers['content-type']) headers['content-type']='application/json';
      const res=await fetch(path,{...options,headers});
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.message||data.error||`HTTP ${res.status}`);
      return data;
    }

    async function init(){
      if(PREVIEW){ enterPreview(); return; }
      const config=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
      state.config=config;
      if(!config?.firebase?.apiKey || !config.firebase.projectId){
        showBoot(`<b>Website đã chạy trên Cloudflare nhưng Firebase chưa được cấu hình.</b><br><br>Không có dữ liệu mẫu. Hãy thêm Firebase Web Config vào Worker để bật đăng nhập Google và Firestore.`, `<span class="pill warn">Production setup pending</span>`);
        return;
      }
      const app=initializeApp(config.firebase);
      state.auth=getAuth(app); state.db=getFirestore(app);
      onAuthStateChanged(state.auth, handleAuth);
    }

    async function handleAuth(user){
      state.user=user;
      if(!user){
        showBoot(`<b>Đăng nhập bằng Gmail để vào hệ thống.</b><br><br>Tài khoản đầu tiên sẽ bootstrap thành quản trị viên; các tài khoản tiếp theo sẽ chờ quản trị viên duyệt.`, `<button id="loginBtn" class="btn primary">Đăng nhập Google</button>`);
        $('#loginBtn').onclick=async()=>{ try{ await signInWithPopup(state.auth,new GoogleAuthProvider()); }catch(e){ alert(e.message); } };
        return;
      }
      await ensureProfile(user);
      state.profile=(await getDoc(doc(state.db,'users',user.uid))).data();
      if(state.profile?.status==='pending'){
        showBoot(`<b>Tài khoản đang chờ duyệt.</b><br><br>${esc(user.email||'')} đã đăng ký thành công. Quản trị viên cần chọn vai trò và quyền truy cập trước khi bạn dùng dashboard.`, `<button id="logoutPending" class="btn ghost">Đăng xuất</button>`);
        $('#logoutPending').onclick=()=>signOut(state.auth);
        return;
      }
      if(state.profile?.status!=='approved'){
        showBoot(`<b>Tài khoản chưa được phép truy cập.</b>`, `<button id="logoutBlocked" class="btn ghost">Đăng xuất</button>`); $('#logoutBlocked').onclick=()=>signOut(state.auth); return;
      }
      showApp(); bindShell(); await loadData();
      if(isAdmin()){
        const key='sellerkbb:last-free-cleanup';
        const last=Number(localStorage.getItem(key)||0);
        if(Date.now()-last>86400000){
          const cleaned=await cleanupFirestoreData(true);
          localStorage.setItem(key,String(Date.now()));
          if(cleaned>0) await loadData();
        }
      }
      renderAll();
    }

    async function ensureProfile(user){
      const uref=doc(state.db,'users',user.uid); const snap=await getDoc(uref);

        await updateDoc(uref,{displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(()=>{}); return;
      }
      const bootstrapRef=doc(state.db,'system','bootstrap'); const bs=await getDoc(bootstrapRef);

    function bindInteractionEffects(){

        target.style.setProperty('--tap-x',(e.clientX-rect.left)+'px');
        target.style.setProperty('--tap-y',(e.clientY-rect.top)+'px');
        target.classList.add('fx-press');

        void target.offsetWidth;
        target.classList.add('fx-ripple');

    async function syncMonth(){
      if(PREVIEW){ showToast('Preview: thao tác đồng bộ TikTok đã được mô phỏng'); return; }
      const btn=$('#syncMonthBtn'); btn.disabled=true; btn.textContent='Đang đồng bộ…';
      try{
        const range=selectedRange(); const start=range.startKey, end=localDateKey(range.endExclusive); const result=await api('/api/tiktok/sync',{method:'POST',body:JSON.stringify({startDate:start,endDate:end})});
        const batchSize=300; let count=0;
        for(let i=0;i<result.sessions.length;i+=batchSize){
          const batch=writeBatch(state.db);
          for(const s of result.sessions.slice(i,i+batchSize)){
            const ref=doc(state.db,'liveSessions',s.liveId); const old=await getDoc(ref); const oldData=old.exists()?old.data():null;
            const amount=Number(s.gmvAmount||0);
            batch.set(ref,{
              liveId:s.liveId,title:s.title,channelUsername:s.channelUsername,channelId:s.channelId||'',accountType:s.accountType||'',shopId:s.shopId||'',shopName:s.shopName||'',
              startTime:Timestamp.fromMillis(s.startTimeSeconds*1000),endTime:Timestamp.fromMillis(s.endTimeSeconds*1000),durationSeconds:s.durationSeconds,currency:s.currency||'VND',
              recordedGmvAmount:oldData?.recordedGmvAmount ?? amount,recordedItemsSold:oldData?.recordedItemsSold ?? Number(s.itemsSold||0),
              currentGmvAmount:amount,finalGmvAmount:amount,currentItemsSold:Number(s.itemsSold||0),
              hostUid:oldData?.hostUid||'',hostName:oldData?.hostName||'',operatorUid:oldData?.operatorUid||'',operatorName:oldData?.operatorName||'',
              source:'tiktok',firstSyncedAt:oldData?.firstSyncedAt||serverTimestamp(),lastSyncedAt:serverTimestamp(),updatedAt:serverTimestamp()
            },{merge:true}); count++;
          }
          await batch.commit();
        }
        showToast(`Đã đồng bộ ${count} phiên LIVE`); await loadData(); const cleaned=await cleanupFirestoreData(true); if(cleaned>0) await loadData(); renderAll();
      }catch(e){ showToast('Đồng bộ thất bại: '+e.message); }
      finally{ if(btn){btn.disabled=false;btn.textContent='Đồng bộ khoảng thời gian từ TikTok';} }
    }

    function userApprovalCard(u){return `<div class="approval-item"><div class="row space"><div><b>${esc(u.displayName||u.email)}</b><div class="tiny">${esc(u.email||'')}</div></div><span class="pill warn">Chờ duyệt</span></div><div class="form-grid" style="margin-top:16px"><label><div class="tiny">Vai trò</div><select class="input" style="width:100%" data-role="${u.id}"><option value="host">Host Livestream</option><option value="operator">Nhân viên vận hành livestream</option><option value="admin">Quản trị viên</option></select></label><div><div class="tiny">Nội dung được phép xem</div><label class="checkline"><input type="checkbox" data-perm="live.read" data-uid="${u.id}" checked> Phiên LIVE</label><label class="checkline"><input type="checkbox" data-perm="kpi.read" data-uid="${u.id}" checked> KPI cá nhân / báo cáo</label></div></div><div class="row" style="margin-top:16px"><button class="btn primary" data-approve="${u.id}">Duyệt tài khoản</button></div></div>`;}
    function userApprovedRow(u){return `<div class="row space approved-user-row"><div><b>${esc(u.displayName||u.email)}</b><div class="tiny">${esc(u.email||'')} · ${(u.permissions||[]).join(', ')||'full/admin'}</div></div><span class="tag ${u.role}">${roleLabel(u.role)}</span></div>`;}
    async function approveUser(uid){ const role=document.querySelector(`[data-role="${CSS.escape(uid)}"]`).value; const permissions=[...document.querySelectorAll(`[data-uid="${CSS.escape(uid)}"][data-perm]:checked`)].map(x=>x.dataset.perm); if(role==='admin'){permissions.splice(0,permissions.length,'live.read','kpi.read')} if(PREVIEW){ const u=state.users.find(x=>x.id===uid); Object.assign(u,{role,status:'approved',permissions}); showToast('Đã duyệt tài khoản'); renderAll(); return; } await updateDoc(doc(state.db,'users',uid),{role,status:'approved',permissions,approvedAt:serverTimestamp(),approvedBy:state.user.uid,updatedAt:serverTimestamp()}); showToast('Đã duyệt tài khoản'); await loadData(); renderAll(); }


    function estimateSessionBytes(session){
      try{
        const plain={...session};
        delete plain.rawSummary;
        return new TextEncoder().encode(JSON.stringify(plain)).length + 900;
      }catch{return 1800}
    }

    function maintenanceStats(){
      const settings=state.maintenance.settings;
      const totalBytes=state.sessions.reduce((a,s)=>a+estimateSessionBytes(s),0)*3;
      const totalMb=totalBytes/1024/1024;
      const count=state.sessions.length;
      const cutoff=Date.now()-Number(settings.retentionDays||180)*86400000;
      const expired=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)<cutoff).length;
      const countPct=Math.min(999,Math.round(count/Math.max(1,Number(settings.firestoreMaxSessions||20000))*100));
      const mbPct=Math.min(999,Math.round(totalMb/Math.max(1,Number(settings.firestoreSoftLimitMb||512))*100));
      return {count,totalMb,expired,countPct,mbPct,pressure:Math.max(countPct,mbPct)};
    }

    async function cleanupFirestoreData(emergency=false){
      if(PREVIEW){
        const retention=Number(state.maintenance.settings.retentionDays||180);
        const cutoff=Date.now()-retention*86400000;
        const before=state.sessions.length;
        state.sessions=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=cutoff);
        return before-state.sessions.length;
      }
      if(!isAdmin()||!state.db)return 0;
      const settings=state.maintenance.settings;
      if(settings.autoCleanup===false && emergency)return 0;
      const retention=Number(settings.retentionDays||180);
      const cutoff=Date.now()-retention*86400000;
      const sorted=[...state.sessions].sort((a,b)=>(a.startTime?.toDate?.()?.getTime?.()||0)-(b.startTime?.toDate?.()?.getTime?.()||0));
      const deleteIds=new Set();
      // Free-plan cleanup: read at most 300 expired docs per run, then delete them in one batch.
      const staleQuery=query(collection(state.db,'liveSessions'),where('startTime','<',Timestamp.fromMillis(cutoff)),orderBy('startTime','asc'),limit(300));
      const staleSnap=await getDocs(staleQuery);
      staleSnap.docs.forEach(d=>deleteIds.add(d.id));
      const stats=maintenanceStats();
      const threshold=Number(settings.emergencyPercent||85);
      if(settings.autoCleanup!==false && (stats.countPct>=threshold || stats.mbPct>=threshold)){
        let remainingCount=stats.count-deleteIds.size;
        let remainingBytes=stats.totalMb;
        const targetCount=Math.floor(Number(settings.firestoreMaxSessions||12000)*.70);
        const targetMb=Number(settings.firestoreSoftLimitMb||600)*.70;
        for(const item of sorted){
          if(deleteIds.has(item.id)) continue;
          if(remainingCount<=targetCount && remainingBytes<=targetMb) break;
          deleteIds.add(item.id);
          remainingCount--;
          remainingBytes-=estimateSessionBytes(item)*3/1024/1024;
        }
      }
      if(!deleteIds.size)return 0;
      const ids=[...deleteIds];
      for(let i=0;i<ids.length;i+=300){
        const batch=writeBatch(state.db);
        ids.slice(i,i+300).forEach(id=>batch.delete(doc(state.db,'liveSessions',id)));
        await batch.commit();
      }
      return ids.length;
    }

    function renderStorage(){
      if(!isAdmin()){ $('#section-storage').innerHTML=''; return; }
      const m=state.maintenance.settings, st=maintenanceStats();
      const cf=state.maintenance.cloudflare||{};
      const last=cf.lastRun?.ranAt?fmtDate({toDate:()=>new Date(cf.lastRun.ranAt)}):'Chưa chạy';
      const pressureClass=st.pressure>=Number(m.emergencyPercent||85)?'bad':st.pressure>=70?'warn':'ok';
      $('#section-storage').innerHTML=`
        <div class="grid storage-stats">
          <div class="card"><div class="stat-label">Dữ liệu LIVE đang lưu</div><div class="stat-value">${new Intl.NumberFormat('vi-VN').format(st.count)} phiên</div><div class="tiny">Ước lượng ứng dụng: ${st.totalMb.toFixed(2).replace('.',',')} MB</div></div>
          <div class="card"><div class="stat-label">Mức sử dụng so với ngưỡng ứng dụng</div><div class="stat-value">${st.pressure}%</div><div class="pill ${pressureClass}">${st.pressure>=Number(m.emergencyPercent||85)?'Cần dọn':'Trong vùng an toàn'}</div></div>
          <div class="card"><div class="stat-label">Cloudflare KV</div><div class="stat-value">${new Intl.NumberFormat('vi-VN').format(cf.keyCount||0)} khóa</div><div class="tiny">Lần dọn gần nhất: ${last}</div></div>
        </div>

        <div class="card">
          <div class="row space"><div><h3>Cài đặt tự động dọn dữ liệu</h3><div class="sub">Chỉ áp dụng cho dữ liệu báo cáo và cache. Source website, GitHub, tài khoản người dùng và token TikTok được bảo vệ.</div></div><span class="pill ok">Tối đa 6 tháng</span></div>
          <div class="settings-grid">
            <label><span class="tiny">Thời gian lưu dữ liệu LIVE</span><select id="retentionDays" class="input"><option value="30">30 ngày</option><option value="60">60 ngày</option><option value="90">90 ngày</option><option value="120">120 ngày</option><option value="150">150 ngày</option><option value="180">180 ngày (6 tháng)</option></select></label>
            <label><span class="tiny">Ngưỡng bắt đầu dọn khẩn cấp</span><select id="emergencyPercent" class="input"><option value="75">75%</option><option value="80">80%</option><option value="85">85% (khuyến nghị)</option><option value="90">90%</option></select></label>
            <label><span class="tiny">Ngưỡng Firestore của ứng dụng</span><div class="input-unit"><input id="firestoreSoftLimitMb" class="input" type="number" min="100" max="900" value="${m.firestoreSoftLimitMb}"><span>MB</span></div></label>
            <label><span class="tiny">Số phiên LIVE tối đa trước khi dọn</span><input id="firestoreMaxSessions" class="input" type="number" min="500" max="50000" value="${m.firestoreMaxSessions}"></label>
            <label><span class="tiny">Ngưỡng số khóa Cloudflare KV</span><input id="kvSoftKeyLimit" class="input" type="number" min="100" max="50000" value="${m.kvSoftKeyLimit}"></label>
            <label class="toggle-row"><input id="autoCleanup" type="checkbox" ${m.autoCleanup!==false?'checked':''}><span><b>Tự động dọn khi chạm ngưỡng</b><small>Ưu tiên xóa dữ liệu cũ nhất; không xóa source hoặc khóa được bảo vệ.</small></span></label>
          </div>
          <div class="row storage-actions"><button id="saveMaintenance" class="btn primary">Lưu và áp dụng</button><button id="cleanupNow" class="btn">Dọn dữ liệu ngay</button><button id="runKvCleanup" class="btn">Kiểm tra Cloudflare ngay</button></div>
        </div>

        <div class="card free-plan-note">
          <h3>Chế độ Firebase Free</h3>
          <div class="notice ok"><b>Không dùng Firestore TTL trả phí.</b> SellerKBB chỉ đọc tối đa dữ liệu trong thời gian lưu và tự dọn tối đa 300 phiên quá hạn mỗi lượt khi Admin đăng nhập, đồng bộ hoặc bấm dọn thủ công.</div>
          <div class="sub" style="margin-top:10px">Cách này ưu tiên giữ trong quota Free và tránh tạo lượng đọc/ghi/xóa lớn bất ngờ.</div>
        </div>

        <div class="card">
          <h3>Gợi ý cài đặt</h3>
          <div class="recommend-list">
            <div><b>Khuyến nghị hiện tại</b><span>180 ngày · dọn ở 85% · kiểm tra TikTok mỗi 1 giờ · dọn KV 1 lần/ngày</span></div>
            <div><b>Nếu dữ liệu tăng rất nhanh</b><span>Giữ 120–150 ngày hoặc hạ ngưỡng khẩn cấp xuống 80%.</span></div>
            <div><b>Nếu muốn ưu tiên lịch sử</b><span>Giữ 180 ngày và nâng ngưỡng ứng dụng; không được vượt quá 180 ngày.</span></div>
          </div>
        </div>`;
      $('#retentionDays').value=String(m.retentionDays);
      $('#emergencyPercent').value=String(m.emergencyPercent);
      $('#saveMaintenance').onclick=saveMaintenanceSettings;
      $('#cleanupNow').onclick=async()=>{ const n=await cleanupFirestoreData(false); if(!PREVIEW&&n) await loadData(); showToast(n?`Đã xóa ${n} phiên cũ`:'Không có dữ liệu cần xóa'); renderAll(); };
      $('#runKvCleanup').onclick=async()=>{ if(PREVIEW){ showToast('Preview: Cloudflare KV đang trong vùng an toàn'); return; } const result=await api('/api/maintenance/run',{method:'POST'}); showToast(`Cloudflare: đã kiểm tra ${result.keyCount||0} khóa, xóa ${result.deleted||0}`); await loadData(); renderAll(); };
    }

    async function saveMaintenanceSettings(){
      const next={
        retentionDays:Number($('#retentionDays').value),
        emergencyPercent:Number($('#emergencyPercent').value),
        firestoreSoftLimitMb:Number($('#firestoreSoftLimitMb').value),
        firestoreMaxSessions:Number($('#firestoreMaxSessions').value),
        kvSoftKeyLimit:Number($('#kvSoftKeyLimit').value),
        autoCleanup:$('#autoCleanup').checked
      };
      if(next.retentionDays>180)next.retentionDays=180;
      if(PREVIEW){
        state.maintenance.settings={...state.maintenance.settings,...next};
        showToast('Đã lưu cài đặt Preview');
        renderAll(); return;
      }
      const saved=await api('/api/maintenance/settings',{method:'POST',body:JSON.stringify(next)});
      state.maintenance.settings={...state.maintenance.settings,...saved.settings};
      const deleted=await cleanupFirestoreData(false);
      await loadData();
      showToast(deleted?`Đã lưu cài đặt và dọn ${deleted} phiên cũ`:'Đã lưu cài đặt');
      renderAll();
    }

    async function renderTikTok(){
      if(!isAdmin()){ $('#section-tiktok').innerHTML='';return; }
      if(PREVIEW){
        $('#section-tiktok').innerHTML=`
          <div class="card simple-panel">
            <div class="row space">
              <div><h3>Kết nối TikTok Shop Seller</h3><div class="sub">Chỉ Quản trị viên thấy mục này. Kết nối được duy trì bằng refresh token ở backend Cloudflare.</div></div>
              <span class="pill ok">Đã kết nối</span>
            </div>
            <div class="status-lines">
              <div><span>Tự động gia hạn token</span><b>Bật · kiểm tra mỗi 1 giờ</b></div>
              <div><span>Cách hoạt động</span><b>Dùng Refresh Token khi Access Token còn không quá 60 phút</b></div>
              <div><span>Khi nào cần cấp quyền lại?</span><b>Chỉ khi TikTok thu hồi quyền hoặc refresh token hết hạn</b></div>
            </div>
            <div class="row section-actions"><button class="btn" id="previewSync">Kiểm tra kết nối</button></div>
          </div>
          <div class="simple-panel api-summary">
            <h3>API báo cáo đang dùng</h3>
            <div class="sub"><b>LIVE Performance:</b> /analytics/202509/shop_lives/performance<br><b>Authorized Shops:</b> /authorization/202309/shops</div>
          </div>`;
        $('#previewSync').onclick=()=>showToast('Kết nối TikTok mẫu hoạt động bình thường');
        return;
      }

      let status={configured:state.config.tiktokConfigured,connected:false,autoRefresh:false,grantedScopes:[]};
      try{status=await api('/api/tiktok/status')}catch(e){status.error=e.message}
      const accessExpiry=status.accessTokenExpiresAt?fmtDate({toDate:()=>new Date(status.accessTokenExpiresAt*1000)}):'Chưa có';
      const refreshExpiry=status.refreshTokenExpiresAt?fmtDate({toDate:()=>new Date(status.refreshTokenExpiresAt*1000)}):'Chưa có';

      $('#section-tiktok').innerHTML=`
        <div class="card simple-panel">
          <div class="row space">
            <div><h3>Kết nối TikTok Shop Seller</h3><div class="sub">Token nằm ở backend Cloudflare. Host và Vận hành không nhìn thấy khu vực này.</div></div>
            <span class="pill ${status.connected?'ok':'warn'}">${status.connected?'Đã kết nối':'Chưa kết nối'}</span>
          </div>
          ${!status.configured?'<div class="notice">Chưa cấu hình đủ TikTok App Key / Secret / Service ID / Seller Authorization URL / KV binding.</div>':''}
          ${status.connected?`
            <div class="status-lines">
              <div><span>Tự động gia hạn token</span><b>${status.autoRefresh?'Đang bật · kiểm tra mỗi 1 giờ':'Chưa có refresh token'}</b></div>
              <div><span>Access token hết hạn</span><b>${accessExpiry}</b></div>
              <div><span>Refresh token hết hạn</span><b>${refreshExpiry}</b></div>
            </div>
          `:''}
          <div class="row section-actions">
            ${status.configured&&!status.connected?'<button id="connectTikTok" class="btn primary">Kết nối TikTok Seller</button>':''}
            ${status.connected?'<button id="checkTikTok" class="btn">Kiểm tra kết nối</button>':''}
          </div>
          ${status.grantedScopes?.length?`<div class="tiny scope-line">Scopes: ${esc(status.grantedScopes.join(', '))}</div>`:''}
        </div>
        <div class="simple-panel api-summary">
          <h3>API báo cáo đang dùng</h3>
          <div class="sub"><b>LIVE Performance:</b> /analytics/202509/shop_lives/performance<br><b>Authorized Shops:</b> /authorization/202309/shops</div>
        </div>`;

      if($('#connectTikTok')) $('#connectTikTok').onclick=async()=>{try{const result=await api('/api/tiktok/oauth/start',{method:'POST'});location.href=result.url}catch(e){showToast(e.message)}};
      if($('#checkTikTok')) $('#checkTikTok').onclick=()=>showToast(status.autoRefresh?'Kết nối ổn định · tự gia hạn đang bật':'Kết nối hiện tại hoạt động nhưng chưa có refresh token');
    }

    function renderAll(){ renderNav(); renderDashboard(); renderLive(); renderKpi(); renderUsers(); renderTikTok(); renderStorage(); switchSection(state.section); }

    init().catch(e=>showBoot(`<b>Không khởi động được ứng dụng.</b><br><br>${esc(e.message)}`));
  </script>

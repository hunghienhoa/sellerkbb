<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SellerKBB · Doanh Số KPIs</title>
  <meta name="theme-color" content="#fff4f9" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="180x180" href="/khangbaby-mascot.png?v=1.49.27" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.49.27" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SellerKBB" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#fff8fb;
  --bg-soft:#fff1f7;
  --surface:#ffffff;
  --surface-soft:#fff5fa;
  --surface-strong:#fde8f2;
  --line:#efd7e3;
  --line-strong:#e6b9cf;
  --text:#422d38;
  --muted:#856d79;
  --accent:#eb8db9;
  --accent-strong:#d96ca3;
  --accent-soft:#fde4f0;
  --danger:#cc5e79;
  --danger-soft:#fff0f3;
  --warn:#946b20;
  --warn-soft:#fff8e6;
  --ok:#3f8c72;
  --ok-soft:#eef9f5;
  --shadow-sm:0 2px 8px rgba(144,77,111,.045);
  --shadow-md:0 8px 24px rgba(144,77,111,.07);
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html{
  background:var(--bg);
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 0 -10%,rgba(248,196,220,.48) 0,transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(255,224,238,.62) 0,transparent 25%),
    var(--bg);
  font-size:clamp(13px,.22vw + 12.2px,15px);
  line-height:1.55;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.boot{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.boot-card{
  width:min(100%,680px);
  padding:30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(16px);
}
.brand{
  color:#58394a;
  font-size:28px;
  font-weight:900;
  letter-spacing:-.045em;
}
.brand b{color:var(--accent-strong)}
.sub{
  color:var(--muted);
  font-size:clamp(12px,.18vw + 11.5px,14px);
  line-height:1.65;
}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.grid{display:grid;gap:12px}
.tiny{
  color:var(--muted);
  font-size:clamp(11px,.14vw + 10.5px,12.5px);
  line-height:1.45;
}

.btn,.page-btn,.range-btn,.menu-toggle,.nav button{
  position:relative;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,opacity .18s ease,color .18s ease;
}
.btn{
  min-height:40px;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(144,77,111,.04);
}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.btn:active,.page-btn:active,.range-btn:active,.menu-toggle:active,.nav button:active{transform:scale(.965)}
.btn.primary{
  border-color:#e79abd;
  background:linear-gradient(135deg,#f6b0d2,var(--accent));
  color:#522c40;
}
.btn.danger{
  border-color:#f0c9d3;
  background:var(--danger-soft);
  color:var(--danger);
}
.btn.ghost{background:rgba(255,255,255,.62)}
.btn.small{min-height:32px;padding:5px 9px;font-size:11.5px}
.btn:disabled,.page-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}


.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #f2cade;
  border-radius:999px;
  background:var(--accent-soft);
  color:#8d4969;
  font-weight:700;
  white-space:nowrap;
}
.pill{padding:5px 9px;font-size:clamp(10.5px,.12vw + 10px,12px)}
.tag{padding:4px 7px;font-size:clamp(10px,.1vw + 9.8px,11.5px)}
.pill.ok{border-color:#cce7dd;background:var(--ok-soft);color:var(--ok)}
.pill.warn{border-color:#eadcaf;background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:#efc8d2;background:var(--danger-soft);color:var(--danger)}
.tag.host{border-color:#f0c3d9;background:#fff0f7;color:#a34773}
.tag.operator{border-color:#eadcaf;background:#fff9e9;color:#856527}
.tag.admin{border-color:#cce5db;background:#f0faf6;color:#477d6c}

#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  height:100vh;
  padding:20px;
  border-right:1px solid var(--line);
  background:rgba(255,247,251,.91);
  backdrop-filter:blur(18px);
}
.side-brand{padding:6px 10px 20px}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#806876;
  text-align:left;
  font-weight:700;
  cursor:pointer;
}
.nav button:hover{border-color:var(--line);background:#fff;color:#5d3e4d}
.nav button.active{
  border-color:#efc8da;
  background:linear-gradient(135deg,#fff,#fde8f2);
  color:#8e4268;
  box-shadow:0 6px 17px rgba(190,89,140,.09);
}
.nav-icon{width:23px;text-align:center;font-size:16px}
.side-bottom{position:absolute;left:20px;right:20px;bottom:20px}
.userbox{
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(255,255,255,.9);
  box-shadow:var(--shadow-sm);
}
.avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--accent-soft);
  object-fit:cover;
}

.main{min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px clamp(16px,2vw,28px);
  border-bottom:1px solid var(--line);
  background:rgba(255,251,253,.88);
  backdrop-filter:blur(16px);
}
.topbar-title-wrap{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.topbar-title-wrap>div{min-width:0}
.topbar-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 0 auto;min-width:0}
.data-refresh-wrap{position:relative;display:flex;align-items:center}
.data-refresh-btn{
  min-width:136px;
  height:42px;
  display:grid;
  grid-template-columns:22px minmax(0,1fr);
  align-items:center;
  gap:8px;
  padding:6px 11px;
  border:1px solid #e89dbc;
  border-radius:11px;
  background:linear-gradient(135deg,#f7bad5,#e76ea8);
  color:#532d40;
  box-shadow:0 7px 18px rgba(189,78,132,.15);
  cursor:pointer;
  text-align:left;
  transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease;
}
.data-refresh-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(189,78,132,.2)}
.data-refresh-btn:active{transform:scale(.975)}
.data-refresh-btn:focus-visible{outline:3px solid rgba(216,112,161,.22);outline-offset:2px}
.data-refresh-btn[disabled]{cursor:wait;opacity:.86;transform:none}
.data-refresh-icon{width:22px;height:22px;display:grid;place-items:center}
.data-refresh-copy{display:grid;gap:1px;min-width:0;line-height:1.15}
.data-refresh-copy b{font-size:11.5px;font-weight:850;white-space:nowrap}
.data-refresh-copy small{font-size:9.5px;font-weight:700;opacity:.76;white-space:nowrap}
.data-refresh-btn.is-loading .data-refresh-icon{animation:data-refresh-spin .8s linear infinite}
.data-refresh-btn.is-success{
  border-color:#a9d9c0;
  background:linear-gradient(135deg,#dff6e9,#bfe8d1);
  color:#2f6d50;
  box-shadow:0 7px 18px rgba(72,143,106,.12);
}
.data-refresh-btn.is-error{
  border-color:#efb8c4;
  background:linear-gradient(135deg,#fff0f3,#f8d6de);
  color:#8d4356;
}
@keyframes data-refresh-spin{to{transform:rotate(360deg)}}

.account-menu-wrap{position:relative;display:flex;align-items:center}
.topbar-account-btn{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:0 0 40px;
  padding:2px;
  border:1px solid #efd6e2;
  border-radius:50%;
  background:#fffafd;
  box-shadow:0 2px 10px rgba(151,88,117,.08);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.topbar-account-btn:hover{border-color:#e5b8cc;background:#fff4f9}
.topbar-account-btn:focus-visible{outline:3px solid rgba(215,124,165,.2);outline-offset:2px}
.topbar-account-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover}
.account-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:90;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(78,49,63,.28);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.account-modal-backdrop.hidden{display:none}
.topbar-account-popover{
  position:relative;
  width:min(360px,100%);
  padding:18px;
  border:1px solid #efd0df;
  border-radius:18px;
  background:linear-gradient(145deg,#fffefd,#fff4f8);
  box-shadow:0 24px 70px rgba(100,61,80,.22);
  animation:account-modal-in .18s ease-out both;
}
@keyframes account-modal-in{
  from{opacity:0;transform:scale(.985)}
  to{opacity:1;transform:scale(1)}
}
.account-modal-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:#fff0f6;
  color:#a65a7b;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.account-modal-close:hover{background:#fde4ef}
.topbar-account-popover-head{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar-account-popover-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid #efd6e2;background:var(--accent-soft)}
.topbar-account-popover-copy{display:grid;gap:3px;min-width:0}
.topbar-account-popover-copy b{font-size:13px;color:#543b48;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-account-popover-copy span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-account-details{display:grid;padding:8px 0 10px}
.topbar-account-details>div{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0}
.topbar-account-details span{font-size:10px;color:var(--muted);font-weight:650}
.topbar-account-details b{font-size:10.5px;color:#604654;text-align:right}
.topbar-account-logout{width:100%;justify-content:center}
.account-profile-actions{display:flex;gap:8px;margin:2px 0 12px}
.account-profile-actions .btn{flex:1;justify-content:center;min-height:38px;font-size:12px}
.account-profile-editor{display:grid;gap:12px;padding:12px 0 14px;border-bottom:1px solid var(--line)}
.account-profile-editor.hidden{display:none!important}
.account-profile-photo-row{display:flex;align-items:center;gap:12px}
.account-profile-photo-preview{width:60px;height:60px;border:1px solid #ecd4df;border-radius:50%;object-fit:cover;background:var(--accent-soft);flex:0 0 60px}
.account-profile-photo-help{display:grid;gap:6px;min-width:0}
.account-profile-photo-help small{font-size:11px;line-height:1.45;color:var(--muted)}
.account-profile-photo-help .btn{width:max-content;min-height:36px}
.account-profile-field{display:grid;gap:5px;color:#654653;font-size:12px;font-weight:650}
.account-profile-field .input{width:100%;min-width:0;font-size:16px;min-height:44px}
.account-profile-editor-footer{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.account-profile-editor-footer .btn{min-height:40px}
.account-profile-feedback{font-size:11.5px;line-height:1.45;color:#9c3d62}
.account-profile-feedback:empty{display:none}
@media(max-width:700px){.topbar-account-popover{padding:16px}.account-profile-editor-footer .btn{flex:1}.account-profile-editor-footer{justify-content:stretch}}
.page-title{
  margin:0;
  color:#513544;
  font-size:clamp(20px,.75vw + 17px,26px);
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.03em;
}
.content{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:clamp(18px,2vw,28px) clamp(14px,2vw,28px) 64px;
}
.section{display:none}
.section.active{
  display:flex;
  flex-direction:column;
  gap:clamp(14px,1.4vw,20px);
  animation:section-enter .22s ease-out both;
}
@keyframes section-enter{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  padding:clamp(14px,1.3vw,18px);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:rgba(255,255,255,.92);
  box-shadow:none;
  transition:border-color .18s ease,background-color .18s ease;
}
.card h3{
  margin:0 0 9px;
  color:#583849;
  font-size:clamp(14px,.3vw + 13px,17px);
  line-height:1.4;
}
.card>.row.space:first-child{gap:10px;margin-bottom:10px}
.stats{
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:12px;
}
.stats .card{min-height:0;padding:clamp(13px,1.2vw,17px)}
.stat-label{
  color:var(--muted);
  font-size:clamp(11px,.18vw + 10.5px,13px);
  font-weight:600;
}
.stat-value{
  margin-top:5px;
  color:#673f54;
  font-size:clamp(18px,.75vw + 15px,25px);
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere;
}

.toolbar,.time-filter{
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:11px 13px;
}
.time-filter{padding:11px 12px}
.range-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.range-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.range-btn{
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#715665;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.range-btn:hover{border-color:var(--line-strong);background:#fff8fb}
.range-btn.active{
  border-color:#e7abc7;
  background:var(--accent-soft);
  color:#944c70;
}
.range-summary{
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.range-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
  align-items:center;
}
.custom-range{
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.range-field{
  display:grid;
  gap:4px;
  min-width:150px;
}
.range-field>span{
  color:var(--muted);
  font-size:10.5px;
  font-weight:700;
}
.range-separator{
  align-self:center;
  color:var(--muted);
  font-size:11px;
}
.date-text{width:150px}
.input{
  min-height:40px;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.input:focus{
  outline:0;
  border-color:var(--accent-strong);
  box-shadow:0 0 0 4px rgba(238,147,189,.12);
}
.input option{background:#fff;color:var(--text)}
.month-select{min-width:190px}

/* KPI nhân sự: month-only selector, visually aligned with SellerKBB pastel controls. */
.kpi-month-filter{padding-block:10px}
.kpi-month-filter .range-row{gap:8px}
.kpi-month-filter .kpi-month-controls{align-items:center;gap:8px}
.kpi-month-filter .kpi-month-mode{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  padding:8px 13px;
  border-color:#e8b4cb;
  background:linear-gradient(135deg,#fff,#fdeaf3);
  color:#8d4869;
  box-shadow:0 4px 12px rgba(164,75,117,.06);
  cursor:default;
}
.kpi-month-select-shell{
  position:relative;
  min-width:190px;
  height:40px;
  display:grid;
  grid-template-columns:20px minmax(0,1fr) 14px;
  align-items:center;
  gap:7px;
  padding:0 10px;
  border:1px solid #e7c0d2;
  border-radius:11px;
  background:linear-gradient(135deg,#fffafd,#fff3f8);
  box-shadow:0 4px 14px rgba(158,80,118,.06);
  color:#6d475a;
  transition:transform .16s ease,border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.kpi-month-select-shell:hover{
  transform:translateY(-1px);
  border-color:#dda5bf;
  box-shadow:0 8px 18px rgba(158,80,118,.1);
}
.kpi-month-select-shell:focus-within{
  border-color:#d97aa6;
  box-shadow:0 0 0 4px rgba(224,123,169,.12),0 8px 18px rgba(158,80,118,.08);
}
.kpi-month-select-icon{width:20px;height:20px;display:grid;place-items:center;color:#a85c7e;pointer-events:none}
.kpi-month-select{
  width:100%;
  min-width:0;
  height:38px;
  padding:0;
  border:0;
  outline:0;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  color:#684557;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
.kpi-month-select:focus,.kpi-month-select:focus-visible{outline:0!important;box-shadow:none!important;border:0!important}
.kpi-month-select-shell .kpi-month-select{appearance:none!important;-webkit-appearance:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;background:transparent!important}
.kpi-month-select option{background:#fff;color:#5c3e4d}
.kpi-month-chevron{
  width:8px;
  height:8px;
  justify-self:center;
  border-right:1.7px solid #a75f80;
  border-bottom:1.7px solid #a75f80;
  transform:rotate(45deg) translateY(-2px);
  pointer-events:none;
  transition:transform .18s ease;
}
.kpi-month-select-shell:focus-within .kpi-month-chevron{transform:rotate(225deg) translate(-1px,-1px)}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  scrollbar-color:#edb3ce transparent;
  scrollbar-width:thin;
}
.table-wrap:focus-visible{
  outline:3px solid rgba(216,112,161,.2);
  outline-offset:2px;
}
table{
  width:100%;
  min-width:1050px;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #f4e5ec;
  text-align:left;
  vertical-align:middle;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:#fff4f9;
  color:#7c6070;
  font-size:clamp(10.5px,.16vw + 10px,12px);
  line-height:1.35;
  font-weight:800;
}
td{
  color:#543c49;
  font-size:clamp(11.5px,.16vw + 11px,13px);
  line-height:1.45;
}

  font-weight:800;

.status-dot::before{
  content:'';
  width:7px;height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 0 rgba(63,132,109,0);
  opacity:.92;

  animation:statusDotPulse 1.45s cubic-bezier(.22,.61,.36,1) infinite;

.topbar{
  border-bottom-color:rgba(238,214,225,.9);
  background:rgba(255,250,252,.93);
}
.page-title{color:#533944}
.section.active{
  border-color:var(--line);
  background:rgba(255,255,255,.92);
  box-shadow:0 1px 3px rgba(111,64,85,.025);
}
.card h3,.export-row b,.api-hero-copy h3{color:#583d4a}
.metric-card{
  border-color:#f2e0e8;
  background:linear-gradient(145deg,#fff 0,#fff8fb 100%);
}
.metric-icon,.export-icon,.api-hero-icon,.storage-provider-icon{
  background:var(--accent-soft);
  color:#b45e85;
}
.metric-copy>strong,.stat-value,.money{color:#70495b}
.range-tabs{border-color:var(--line);background:#fff0f5}
.range-btn{color:#806c76}
.range-btn:hover{background:#fff;color:#684b58}
.range-btn.active{background:#fff;color:#ad5a80;box-shadow:0 1px 4px rgba(151,88,117,.09)}
.custom-range{background:#fff6f9}
.date-pick.active{border-color:#e2a9c1;box-shadow:0 0 0 3px rgba(215,124,165,.11)}
.calendar-nav{background:#fff2f7;color:#94627a}
.calendar-nav:hover{background:#fde8f1}
.calendar-day:hover,.calendar-day.in-range{background:#fdebf3}
.pill,.tag{border-color:#efcede;background:var(--accent-soft);color:#985b77}
.tag.admin{border-color:#ecc6d8;background:#fff0f6;color:#9d5375}
.tag.operator{border-color:#efd2df;background:#fff5f8;color:#9b637b}
.tag.host{border-color:#f0cbdc;background:#fff1f7;color:#a6567c}
.btn{color:#59434e}
.btn:hover{border-color:#e4bfd0;background:#fffafb}
.btn.primary{border-color:var(--accent-strong);background:var(--accent-strong);color:#fff}
.btn.primary:hover{border-color:#c96e98;background:#c96e98}
th{background:#fff4f8;color:#7b6670}
tbody tr:hover td{background:#fffafb}
.pair-card b,.status-item b,.api-foot b,.live-time-cell b,.mobile-live-time b{color:#654854}
.status-item{color:#a15d7c}
.eyebrow,.heading-with-icon .ui-icon,.data-note .ui-icon,.mobile-live-time .ui-icon{color:#b45e85}
.toggle-row{border-left-color:#e5b8cc;background:#fff6f9}
.storage-quota-card{background:linear-gradient(145deg,#fff 0,#fff8fb 100%)}
.storage-quota-head>strong,.storage-usage-line b{color:#694958}
.storage-quota-foot>span{color:#a7557a}
.storage-progress{background:#f8e7ef}
.storage-progress i{background:linear-gradient(90deg,#efb8cf,#da82a8)}
.user-list-avatar{border-color:#efd5e0}
.kpi-person-avatar{width:36px;height:36px}
.kpi-person-identity{max-width:250px;min-width:0}
.kpi-person-identity .user-identity-copy{min-width:0}
.kpi-person-identity .user-identity-copy b{max-width:196px}
@media(max-width:700px){.kpi-person-avatar{width:34px;height:34px}.kpi-person-identity .user-identity-copy b{max-width:128px}}
.mobile-menu-overlay{background:rgba(78,49,63,.25)}
.approved-user-card{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.approved-user-card:last-child{border-bottom:0;padding-bottom:0}
.user-access-grid{
  display:grid;
  grid-template-columns:minmax(180px,.7fr) minmax(260px,1.3fr);
  gap:14px;
  align-items:start;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface-soft);
}
.approved-user-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.approved-user-side{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  min-width:0;
}
.approved-user-actions{display:flex;align-items:center;gap:6px}
.user-icon-btn{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:#a7557a;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,transform .15s ease,color .18s ease;
}
.user-icon-btn:hover{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent-strong)}
.user-icon-btn:active{transform:scale(.95)}
.user-icon-btn.danger{color:var(--danger);background:#fffafb}
.user-icon-btn.danger:hover{background:var(--danger-soft);border-color:#efc8d2}
.user-icon-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.user-access-grid.hidden{display:none!important}
.user-access-grid{margin-top:12px}
.user-access-actions{margin-top:10px;justify-content:flex-end}
.user-self-note{color:var(--muted);font-size:10.5px}
@media(max-width:1100px) and (min-width:701px){
  .nav{gap:12px}
  .nav-group{gap:0}
  .nav-group-title{display:none}
  .side-brand{text-align:center;padding-left:0;padding-right:0}
  .side-brand .brand-lockup{justify-content:center}
  .side-brand .brand-seller,.side-brand .brand-live{display:none!important}
  .side-brand .brand-lockup b{font-size:18px}
}
@media(max-width:700px){
  body{background:#fff7fa}
  .topbar{background:rgba(255,250,252,.96)}
  .sidebar{
    background:rgba(255,249,252,.995)!important;
    box-shadow:18px 0 42px rgba(117,68,91,.16)!important;
  }
  .side-brand .brand-seller,.side-brand .brand-live{display:inline-flex!important}
  .nav{gap:17px!important}
  .nav-group{gap:6px}
  .nav-group-title{display:block!important;padding:0 12px}
  .nav-group-items{display:grid!important;gap:4px!important}
  .section.active{background:#fff;border-color:var(--line)}
  .approved-user-summary{align-items:flex-start}
  .approved-user-side{align-items:flex-end;flex-direction:column;gap:7px}
  .approved-user-meta{padding-left:0}
  .user-access-grid{grid-template-columns:1fr}
  .user-access-actions{justify-content:stretch}
  .user-access-actions .btn{flex:1}
}


.export-coming-soon .export-copy{display:grid;gap:3px}
.export-coming-soon .export-copy .pill{width:max-content;margin-top:4px}


/* v1.13 manual KPI allocations */
.metrics-grid.metrics-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.manual-kpi-section-head{align-items:flex-start}
.manual-kpi-session-list{display:grid;gap:12px;margin-top:12px}
.manual-kpi-session{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:linear-gradient(145deg,#fff 0,#faf8fe 100%);
}
.manual-kpi-session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.manual-kpi-title-row{gap:8px;flex-wrap:wrap}
.manual-kpi-session-head>div:first-child{min-width:0}
.manual-kpi-total{display:grid;gap:2px;text-align:right;white-space:nowrap}
.manual-kpi-total span{font-size:9.5px;color:var(--muted)}
.manual-kpi-total b{color:#6f50a1;font-size:14px}
.manual-kpi-rule{display:flex;align-items:flex-start;gap:7px;margin:10px 0;padding:9px 10px;border-left:3px solid #b69add;border-radius:4px;background:#f5f1fb;color:#6f6379;font-size:10.5px;line-height:1.45}
.manual-kpi-rule .ui-icon{flex:0 0 auto;color:#8061b1;margin-top:1px}
.manual-kpi-entries{display:grid;gap:7px}
.manual-kpi-entry{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:end;
  gap:9px 10px;
  padding:10px;
  border:1px solid #e8e1f1;
  border-radius:8px;
  background:#fff;
}
.manual-kpi-entry label{display:grid;gap:4px;min-width:0}
.manual-kpi-entry label>span,.manual-kpi-entry.readonly>div>span{font-size:9.5px;color:var(--muted);font-weight:650}
.manual-kpi-entry .input{width:100%;min-width:0}
.manual-host-gmv-field{grid-column:1}
.manual-host-kpi-field{grid-column:1}
.manual-operator-kpi-field{grid-column:2}
.manual-entry-remove{width:34px;height:36px;padding:0;font-size:18px;grid-column:2;justify-self:end}
.manual-kpi-entry.readonly{grid-template-columns:repeat(2,minmax(0,1fr));align-items:center}
.manual-kpi-entry.readonly>div{display:grid;gap:3px}
.manual-kpi-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.manual-kpi-session-editor.hidden{display:none!important}
.manual-kpi-saved-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:10px;
  padding:10px 11px;
  border:1px solid #cfe5dc;
  border-radius:9px;
  background:#f8fcfa;
}
.manual-kpi-saved-summary.hidden{display:none!important}
.manual-kpi-saved-summary-copy{display:grid;gap:3px;min-width:0}
.manual-kpi-saved-summary-copy b{color:#356f59;font-size:11.5px}
.manual-kpi-saved-summary-copy span{color:#6e7e77;font-size:10px;line-height:1.4}
.manual-kpi-session-edit{flex:0 0 auto;white-space:nowrap}
.manual-kpi-static-field{display:grid;gap:4px;min-width:0}
.manual-kpi-static-field>span{font-size:9.5px;color:var(--muted);font-weight:650}
.manual-kpi-output{
  width:100%;
  min-height:40px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:#fff5f8;
  color:#a45579;
  font-size:13px;
  font-weight:750;
  line-height:1.2;
  user-select:none;
  -webkit-user-select:none;
  pointer-events:none;
  cursor:default;
  touch-action:manipulation;
}
.manual-kpi-value{color:#7654a6!important;font-weight:750}
.manual-kpi-balance{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin:10px 0;
}
.manual-kpi-balance-item{
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-soft);
}
.manual-kpi-balance-item span{display:block;color:var(--muted);font-size:9.5px;margin-bottom:3px}
.manual-kpi-balance-item b{display:block;color:#5f4050;font-size:12px;line-height:1.35}
.manual-kpi-validation{
  margin:8px 0 10px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:10.5px;
  line-height:1.45;
}
.manual-kpi-validation.ok{background:var(--ok-soft);border-color:#bee1ce;color:#347257}
.manual-kpi-validation.warn{background:#fff8e6;border-color:#eedb9e;color:#745b16}
.manual-kpi-validation.bad{background:#fff0f3;border-color:#efc7d0;color:#99485e}
.manual-kpi-validation.draft{background:#f7f1fb;border-color:#dfd0ee;color:#6f50a1}
.manual-kpi-entry.input-error{border-color:#e49ab0;background:#fff8fa}
.manual-kpi-session.reconciled{
  border-color:#c8e4d8;
  background:#fff;
  box-shadow:0 6px 18px rgba(63,132,109,.06);
}
.manual-kpi-session.reconciled .manual-kpi-balance-item{
  border-color:#d8ebe3;
  background:#fbfffd;
}
.manual-reconciled-badge{
  background:#e9f7ef!important;
  border-color:#bee1ce!important;
  color:#347257!important;
  font-weight:850;
}
.manual-kpi-entry.saved{
  display:block;
  padding:0;
  overflow:hidden;
  border-color:#e2e8e5;
  background:#fff;
}
.manual-kpi-entry-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 11px;
  background:#fbfdfc;
}
.manual-kpi-entry-summary-copy{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:5px 14px;
  min-width:0;
  flex:1;
}
.manual-kpi-entry-person{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  color:#604652;
  font-size:11px;
}
.manual-kpi-entry-person span{color:var(--muted);font-size:9.5px;white-space:nowrap}
.manual-kpi-entry-person b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manual-entry-detail-toggle{flex:0 0 auto;white-space:nowrap}
.manual-kpi-entry-details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:end;
  gap:9px 10px;
  padding:10px;
  border-top:1px solid #edf1ef;
}
.manual-kpi-entry-details.hidden{display:none!important}
.manual-kpi-entry:not(.saved){
  display:block;
  padding:0;
}
.manual-kpi-entry:not(.saved) .manual-kpi-entry-details{
  border-top:0;
}
.manual-entry-footer{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  padding-top:2px;
}
.manual-entry-remove{
  width:auto;
  height:auto;
  min-height:34px;
  padding:6px 9px;
  font-size:10.5px;
  grid-column:auto;
  justify-self:auto;
}
.manual-money-input{
  display:flex;
  align-items:center;
  width:100%;
  min-width:0;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:#fff;
  overflow:hidden;
}
.manual-money-input:focus-within{
  border-color:#dc8fb3;
  box-shadow:0 0 0 2px rgba(216,111,159,.08);
}
.manual-money-input .input{
  flex:1;
  min-width:0;
  border:0;
  border-radius:0;
  box-shadow:none!important;
  background:transparent;
}
.manual-money-input-suffix{
  flex:0 0 auto;
  padding:0 10px 0 4px;
  color:#765365;
  font-size:13px;
  font-weight:750;
  user-select:none;
  pointer-events:none;
}
.reconcile-session.reconciled{
  border-color:#c8e4d8;
  background:#fbfffd;
}
.reconcile-success-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  width:max-content;
  margin-top:5px;
  padding:4px 7px;
  border:1px solid #bee1ce;
  border-radius:999px;
  background:#e9f7ef;
  color:#347257;
  font-size:10px;
  font-weight:850;
}
.live-reconciled-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  width:max-content;
  padding:4px 7px;
  border:1px solid #b8decf!important;
  border-radius:999px;
  background:#e8f7ef!important;
  color:#2f775a!important;
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
}
.live-row-reconciled td{
  background:#fbfffd;
  border-bottom-color:#dbece5;
}
.live-row-reconciled:hover td{background:#f6fcf9!important}
.live-row-reconciled .kpi-status-final{
  background:#e8f7ef!important;
  border-color:#b8decf!important;
  color:#2f775a!important;
}
.mobile-live-card.reconciled{
  border-color:#c6e5d8!important;
  background:#fbfffd!important;
  box-shadow:inset 3px 0 0 #79b99e;
}
.mobile-live-card.reconciled .mobile-live-title{color:#345f4f}
.mobile-live-card.reconciled .mobile-field{
  border-color:#d9ebe4!important;
  background:#f5fbf8!important;
}
.mobile-live-card.reconciled .mobile-field strong{color:#386552}
.mobile-live-card.reconciled .mobile-live-head>.pill{
  border-color:#c9e5da!important;
  background:#eff9f5!important;
  color:#3c755f!important;
}
.mobile-live-card.reconciled .kpi-status-final{
  background:#e8f7ef!important;
  border-color:#b8decf!important;
  color:#2f775a!important;
}
@media(max-width:700px){
  .mobile-live-card.reconciled{
    border-top:1px solid #c6e5d8!important;
    border-bottom:1px solid #c6e5d8!important;
    padding-left:10px!important;
    padding-right:10px!important;
    border-radius:9px!important;
    margin:5px 0;
  }
}
@media(max-width:700px){
  .manual-kpi-entry-summary{align-items:flex-start}
  .manual-kpi-entry-summary-copy{grid-template-columns:1fr;gap:4px}
  .manual-kpi-entry-details{grid-template-columns:1fr}
  .manual-host-gmv-field,.manual-host-kpi-field,.manual-operator-kpi-field,.manual-entry-footer{grid-column:1}
  .manual-entry-footer .btn{width:auto}
}
@media(max-width:700px){
  .manual-kpi-balance{grid-template-columns:1fr}
}
@media(max-width:1050px){
  .metrics-grid.metrics-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .metrics-grid.metrics-4{grid-template-columns:1fr 1fr}
  .manual-kpi-section-head,.manual-kpi-session-head{display:grid;gap:9px}
  .manual-kpi-total{text-align:left}
  .manual-kpi-entry,.manual-kpi-entry.readonly{grid-template-columns:1fr}
  .manual-host-gmv-field,.manual-host-kpi-field,.manual-operator-kpi-field,.manual-entry-remove{grid-column:1}
  .manual-entry-remove{justify-self:end}
  .manual-kpi-actions{display:grid;grid-template-columns:1fr}
  .manual-kpi-actions .btn{width:100%}
  .manual-kpi-saved-summary{align-items:flex-start}
  .manual-kpi-session-edit{width:auto!important}
}






/* v1.21 independent personnel directory */
.staff-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,.8fr) auto;gap:10px;align-items:end;margin-top:14px}
.staff-list{display:grid;gap:8px;margin-top:14px}
.staff-row{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.staff-row-summary{display:flex;align-items:center;justify-content:space-between;gap:12px}
.staff-row-copy{display:grid;gap:3px;min-width:0}
.staff-row-copy b{color:#583d4a;font-size:13px}
.staff-row-actions{display:flex;gap:6px;align-items:center}
.staff-edit-grid{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,.8fr) auto;gap:10px;align-items:end;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.staff-edit-grid.hidden{display:none}
.staff-role-host{background:#fff0f6;color:#a6567c;border-color:#f0cbdc}
.staff-role-operator{background:#fff5f8;color:#9b637b;border-color:#efd2df}
@media(max-width:700px){
  .staff-toolbar,.staff-edit-grid{grid-template-columns:1fr}
  .staff-row-summary{align-items:flex-start}
  .staff-row-actions{flex:0 0 auto}
}

/* Mobile form controls: keep text >=16px to prevent iOS Safari focus zoom.
   Keep this rule at the end of the stylesheet so future feature styles cannot override it. */
@media(max-width:700px){
  input,
  select,
  textarea{
    font-size:16px!important;
  }
}

/* v1.47: preserve the pastel identity while making daily reporting calmer. */
:root{
  --muted:#75616b;
  --action:#a44872;
  --danger:#a43c57;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
body{background:#fff8fb}
.section.active{animation:none;gap:24px;border-color:#eee3e8}
.card h3{font-size:16px;line-height:1.4;font-weight:700}
.nav button{font-weight:600}
.nav button.active{color:#873c5e;font-weight:700}
.nav-group-title{color:#81616f;font-size:10px;letter-spacing:.07em}
.metric-card{background:#fff;border-color:#eee5e9;padding:16px;gap:10px}
.metric-copy>span,.dashboard-final-gmv-copy>span{font-size:12px;font-weight:600;line-height:1.5}
.metric-copy>small,.dashboard-final-gmv-copy>small{font-size:12px;line-height:1.5;color:var(--muted)}
.metric-copy>strong{font-size:clamp(18px,1.6vw,23px);font-weight:700;line-height:1.3;letter-spacing:-.02em}
.metric-copy>strong,.dashboard-final-gmv-copy>strong,.reconcile-overview-card b,.stat-value,.money{font-variant-numeric:tabular-nums}
.metric-icon{width:32px;height:32px;background:#fff0f6;color:#9b496e}
.dashboard-final-gmv{background:#f4faf7}
.dashboard-final-gmv-copy>strong{font-weight:750}
.tiny,.sub{line-height:1.55}
.btn.small{font-size:12px;min-height:36px;padding:7px 10px}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{background:#8b385e;border-color:#8b385e}
.range-btn.active{color:#873c5e}
.range-btn,.range-summary{color:#75616b}
.brand-lockup b{color:#c66c95}
.pill,.tag,.tag.operator,.tag.host{color:#8c4b69}
.pill.ok,.status-dot.ok,.storage-health-row b.ok{color:#326e58}
.eyebrow,.status-item{color:#98496d}
.calendar-day.start,.calendar-day.end{background:var(--action);color:#fff}
.btn:disabled,.page-btn:disabled{opacity:.6}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid #98416a;outline-offset:3px}
.topbar-account-btn:focus-visible{outline:2px solid #98416a;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:2px}
.btn,.page-btn,.range-btn,.menu-toggle,.nav button{transition:background-color 140ms ease,border-color 140ms ease,color 140ms ease,transform 120ms var(--ease-out)}
.btn:active,.page-btn:active,.range-btn:active,.menu-toggle:active,.nav button:active{transform:scale(.985)}
th{background:#faf6f8;font-size:12px;line-height:1.5;font-weight:600}
th,td{padding:12px;border-bottom-color:#eee7eb}
td{line-height:1.55}

  <script type="module">
    const FIREBASE_VERSION = "12.19.0";
    const STARTUP_TIMEOUT_MS = 18000;
    const API_TIMEOUT_MS = 12000;
    let initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged;
    let getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs, collection, query, orderBy, where, limit, startAfter, writeBatch, runTransaction, serverTimestamp, Timestamp;

    async function withTimeout(promise,ms,label='Tác vụ'){
      let timer;
      try{
        return await Promise.race([
          promise,
          new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(`${label} quá thời gian chờ ${Math.ceil(ms/1000)} giây.`)),ms);})
        ]);
      }finally{clearTimeout(timer)}
    }

    async function loadFirebaseSdk(){
      const [appModule,authModule,firestoreModule]=await withTimeout(Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`)
      ]),12000,'Tải Firebase');
      ({initializeApp}=appModule);
      ({getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=authModule);
      ({getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,getDocs,collection,query,orderBy,where,limit,startAfter,writeBatch,runTransaction,serverTimestamp,Timestamp}=firestoreModule);
    }

    const $ = (s) => document.querySelector(s);
    const esc = (v="") => String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const fmtMoney = (v,currency="VND") => {
      const n=Number(v||0), code=currency||'VND';
      if(code==='VND') return `${new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)} đ`;
      try{return new Intl.NumberFormat('vi-VN',{style:'currency',currency:code,currencyDisplay:'name',maximumFractionDigits:2}).format(n)}
      catch{return `${new Intl.NumberFormat('vi-VN').format(n)} ${code}`}
    };
    const fmtDate = (ts) => {
      if(!ts)return '—';
      const d=ts?.toDate?ts.toDate():new Date(Number(ts)*1000);
      const day=String(d.getDate()).padStart(2,'0'), month=String(d.getMonth()+1).padStart(2,'0'), year=d.getFullYear();
      const hour=String(d.getHours()).padStart(2,'0'), minute=String(d.getMinutes()).padStart(2,'0');
      return `${day}/${month}/${year} lúc ${hour} giờ ${minute} phút`;
    };
    const fmtDuration = seconds => {
      const total=Math.max(0,Number(seconds||0));
      const hours=Math.floor(total/3600), minutes=Math.floor(total%3600/60);
      if(hours<=0) return `${minutes} phút`;
      return `${hours} giờ ${String(minutes).padStart(2,'0')} phút`;
    };
    const roleLabel = r => ({admin:'Quản trị viên',host:'Host Livestream',operator:'Nhân viên vận hành livestream',pending:'Chờ duyệt'}[r]||r||'Chưa gán');
    function safePhotoURL(value){
      const raw=String(value||'').trim();
      if(/^https:\/\//i.test(raw)||/^data:image\//i.test(raw))return raw;
      return '';
    }
    function avatarFallbackData(name='?'){
      const initial=String(name||'?').trim().charAt(0).toUpperCase()||'?';
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="#f5dce8"/><text x="48" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#8f4c6d">${initial}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }
    function avatarSrc(user={}){
      return safePhotoURL(user.photoURL)||avatarFallbackData(user.displayName||user.email||'?');
    }
    function avatarHtml(user={},className='user-list-avatar'){
      const name=user.displayName||user.email||'Tài khoản';
      const fallback=avatarFallbackData(name);
      return `<img class="${className}" src="${esc(avatarSrc(user))}" data-user-avatar alt="Ảnh đại diện của ${esc(name)}" onerror="this.onerror=null;this.src='${esc(fallback)}'">`;
    }
    function userIdentityHtml(user={},showEmail=true){
      const name=user.displayName||user.email||'Chưa đặt tên';
      return `<div class="user-identity">${avatarHtml(user)}<div class="user-identity-copy"><b>${esc(name)}</b>${showEmail&&user.email?`<span>${esc(user.email)}</span>`:''}</div></div>`;
    }
    function permissionSummary(profile={}){
      if(profile.role==='admin')return 'Toàn quyền quản trị';
      const permissions=Array.isArray(profile.permissions)?profile.permissions:[];
      const labels=[];
      if(permissions.includes('live.read'))labels.push('Phiên LIVE');
      if(permissions.includes('kpi.read'))labels.push('KPI nhân sự');
      if(isDelegatedLiveRole(profile.role)&&permissions.includes('live.read')&&permissions.includes('live.assign'))labels.push('Gắn Host/Vận hành · Campaign/Mega · KPI nháp');
      return labels.join(' · ')||'Chưa được cấp nội dung';
    }
    function accountStatusLabel(status){
      return status==='approved'?'Đã duyệt':status==='pending'?'Chờ duyệt':'Chưa được cấp quyền';
    }
    function userDisplayRecord(uid,name=''){
      const found=state.users.find(u=>u.id===uid);
      if(found)return found;
      if(state.user?.uid===uid)return {id:uid,email:state.user.email||'',displayName:state.profile?.displayName||state.user.displayName||name,photoURL:state.user.photoURL||state.profile?.photoURL||'',role:state.profile?.role,status:state.profile?.status,permissions:state.profile?.permissions||[]};
      return {id:uid||'',displayName:name||'Chưa đặt tên',photoURL:''};
    }
    const pad2 = n => String(n).padStart(2,'0');
    const localDateKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const displayDateKey = key => {
      const m=String(key||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m?`${m[3]}/${m[2]}/${m[1]}`:'';
    };
    const parseDisplayDate = value => {
      const m=String(value||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!m)return null;
      const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
      const d=new Date(year,month-1,day);
      if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)return null;
      d.setHours(0,0,0,0);
      return d;
    };
    function selectedRange(){
      const today=new Date(); today.setHours(0,0,0,0);
      let start=new Date(today), endInclusive=new Date(today);
      if(state.rangeMode==='7d') start.setDate(start.getDate()-6);
      else if(state.rangeMode==='30d') start.setDate(start.getDate()-29);
      else if(state.rangeMode==='custom'){
        const a=state.customStart?new Date(state.customStart+'T00:00:00'):null;
        const b=state.customEnd?new Date(state.customEnd+'T00:00:00'):null;
        if(a&&!Number.isNaN(a.getTime())) start=a;
        if(b&&!Number.isNaN(b.getTime())) endInclusive=b;
        if(start>endInclusive){ const t=start; start=endInclusive; endInclusive=t; }
      }
      const endExclusive=new Date(endInclusive); endExclusive.setDate(endExclusive.getDate()+1);
      const startKey=localDateKey(start), endKey=localDateKey(endInclusive);
      const label=startKey===endKey?displayDateKey(startKey):`${displayDateKey(startKey)} – ${displayDateKey(endKey)}`;
      return {start,endInclusive,endExclusive,startKey,endKey,label};
    }
    function sessionsForRange(){
      const {start,endExclusive}=selectedRange();
      return state.sessions.filter(s=>{
        const d=s.startTime?.toDate?.()||new Date(0);
        return d>=start&&d<endExclusive;
      });
    }

    function localMonthKey(date=new Date()){
      const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0');
      return `${y}-${m}`;
    }
    function displayMonthKey(key){
      const match=String(key||'').match(/^(\d{4})-(\d{2})$/);
      if(!match)return 'Tháng hiện tại';
      return `Tháng ${Number(match[2])}/${match[1]}`;
    }
    function shiftMonthKey(key,delta){
      const match=String(key||'').match(/^(\d{4})-(\d{2})$/);
      const base=match?new Date(Number(match[1]),Number(match[2])-1,1):new Date();
      base.setDate(1); base.setMonth(base.getMonth()+Number(delta||0));
      return localMonthKey(base);
    }
    function selectedKpiMonthKey(){
      return /^\d{4}-\d{2}$/.test(String(state.kpiMonthKey||''))?state.kpiMonthKey:localMonthKey(new Date());
    }
    function kpiMonthRange(key=selectedKpiMonthKey()){
      const [year,month]=key.split('-').map(Number);
      const start=new Date(year,month-1,1);
      const endExclusive=new Date(year,month,1);
      const endInclusive=new Date(year,month,0);
      return {
        key,
        start,
        endInclusive,
        endExclusive,
        startKey:localDateKey(start),
        endKey:localDateKey(endInclusive),
        label:`${displayDateKey(localDateKey(start))} – ${displayDateKey(localDateKey(endInclusive))}`,
        monthLabel:displayMonthKey(key)
      };
    }
    function kpiSessionsForMonth(){
      const {start,endExclusive}=kpiMonthRange();
      return state.sessions.filter(s=>{
        const d=s.startTime?.toDate?.()||new Date(0);
        return d>=start&&d<endExclusive;
      });
    }
    function kpiMonthOptionKeys(){
      const keys=new Set();
      const current=localMonthKey(new Date());
      for(let i=0;i<12;i++)keys.add(shiftMonthKey(current,-i));
      for(const session of state.sessions){
        const d=session.startTime?.toDate?.();
        if(d instanceof Date&&!Number.isNaN(d.getTime())&&d.getFullYear()>=2020)keys.add(localMonthKey(d));
      }
      keys.add(selectedKpiMonthKey());
      return [...keys].sort((a,b)=>b.localeCompare(a));
    }
    function kpiMonthFilterHtml(){
      const selected=selectedKpiMonthKey();
      const options=kpiMonthOptionKeys().map(key=>`<option value="${key}" ${key===selected?'selected':''}>${displayMonthKey(key)}</option>`).join('');
      return `<div class="time-filter kpi-month-filter">
        <div class="range-row">
          <div class="range-tabs kpi-month-controls">
            <span class="range-btn active kpi-month-mode">Theo tháng</span>

    function bindCalendarPicker(scope,section){
      const calendar=section.querySelector(`[data-date-calendar="${scope}"]`);
      if(!calendar)return;
      const startBtn=section.querySelector('[data-date-target="start"]');
      const endBtn=section.querySelector('[data-date-target="end"]');
      if(!startBtn||!endBtn)return;

      let target='start';
      let view=new Date((startBtn.dataset.value||localDateKey(new Date()))+'T00:00:00');
      const todayKey=localDateKey(new Date());

      const setTarget=next=>{
        target=next;
        startBtn.classList.toggle('active',target==='start');
        endBtn.classList.toggle('active',target==='end');
        const value=(target==='start'?startBtn:endBtn).dataset.value;
        if(value)view=new Date(value+'T00:00:00');
        draw();
      };

      const draw=()=>{
        const y=view.getFullYear(), m=view.getMonth();
        const first=new Date(y,m,1);
        const offset=(first.getDay()+6)%7;
        const days=new Date(y,m+1,0).getDate();
        const startKey=startBtn.dataset.value||'';
        const endKey=endBtn.dataset.value||'';
        let cells='';
        for(let i=0;i<offset;i++)cells+='<span class="calendar-day empty" aria-hidden="true"></span>';
        for(let day=1;day<=days;day++){
          const d=new Date(y,m,day);
          const key=localDateKey(d);
          const inRange=startKey&&endKey&&key>=startKey&&key<=endKey;
          const cls=['calendar-day',key===todayKey?'today':'',key===startKey?'start':'',key===endKey?'end':'',inRange?'in-range':''].filter(Boolean).join(' ');
          cells+=`<button type="button" class="${cls}" data-calendar-day="${key}">${day}</button>`;
        }
        calendar.innerHTML=`
          <div class="calendar-head">
            <button type="button" class="calendar-nav" data-calendar-nav="-1" aria-label="Tháng trước">‹</button>
            <b>Tháng ${m+1}/${y}</b>
            <button type="button" class="calendar-nav" data-calendar-nav="1" aria-label="Tháng sau">›</button>
          </div>
          <div class="calendar-week"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
          <div class="calendar-grid">${cells}</div>`;

        calendar.querySelectorAll('[data-calendar-nav]').forEach(btn=>btn.onclick=()=>{
          view=new Date(view.getFullYear(),view.getMonth()+Number(btn.dataset.calendarNav),1);
          draw();
        });
        calendar.querySelectorAll('[data-calendar-day]').forEach(btn=>btn.onclick=()=>{
          const value=btn.dataset.calendarDay;
          const pick=target==='start'?startBtn:endBtn;
          pick.dataset.value=value;
          pick.querySelector('b').textContent=displayDateKey(value);
          if(target==='start') setTarget('end');
          else draw();
        });
      };

      startBtn.onclick=()=>setTarget('start');
      endBtn.onclick=()=>setTarget('end');
      draw();
    }

        if(!res.ok) throw new Error(data.message||data.error||`HTTP ${res.status}`);
        return data;
      }catch(error){
        if(error?.name==='AbortError')throw new Error(`Máy chủ phản hồi quá ${Math.ceil(timeoutMs/1000)} giây. Hãy thử lại.`);
        throw error;
      }finally{clearTimeout(timer)}
    }

    async function handleAuth(user){
      if(!user){
        dismissAccountOnSignOut();
        if(state.autoSyncWatcher){clearInterval(state.autoSyncWatcher);state.autoSyncWatcher=null;}
        state.user=null;state.profile=null;
        state.users=[];state.staff=[];state.sessions=[];

        $('#loginBtn').onclick=async()=>{ try{ await signInWithPopup(state.auth,new GoogleAuthProvider()); }catch(e){ alert(e.message); } };
        return;
      }
      dismissAccountOnSignOut();
      state.user=user;
      await withTimeout(ensureProfile(user),10000,'Kiểm tra tài khoản');
      state.profile=(await withTimeout(getDoc(doc(state.db,'users',user.uid)),10000,'Đọc hồ sơ tài khoản')).data();
      if(state.profile?.status==='pending'){
        showBoot(`<b>Tài khoản đang chờ duyệt.</b><br><br>${esc(user.email||'')} đã đăng ký thành công. Quản trị viên cần chọn vai trò và quyền truy cập trước khi bạn dùng dashboard.`, `<button id="logoutPending" class="btn ghost">Đăng xuất</button>`);

        return;
      }
      if(state.profile?.status!=='approved'){
        showBoot(`<b>Tài khoản chưa được phép truy cập.</b>`, `<button id="logoutBlocked" class="btn ghost">Đăng xuất</button>`); $('#logoutBlocked').onclick=()=>signOut(state.auth); return;
      }
      showBoot('<b>Đang tải dữ liệu SellerKBB…</b><br><br><span class="tiny">Đang lấy phiên LIVE và thông tin cần thiết. Giao diện chỉ mở khi dữ liệu đã sẵn sàng.</span>');
      await withTimeout(loadData(),STARTUP_TIMEOUT_MS,'Tải dữ liệu ban đầu');
      state.dataRefresh.lastAt=new Date().toISOString();
      renderAll();

    async function ensureProfile(user){
      const uref=doc(state.db,'users',user.uid); const snap=await getDoc(uref);
      if(snap.exists()){
        const old=snap.data()||{};
        const customDisplayName=String(old.customDisplayName||'').trim();
        const customPhotoURL=String(old.customPhotoURL||'');
        const displayName=customDisplayName||String(old.displayName||user.displayName||user.email||'');
        const photoURL=customPhotoURL||String(old.photoURL||user.photoURL||'');
        await updateDoc(uref,{
          displayName,photoURL,
          lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()
        }).catch(()=>{});
        return;
      }
      const bootstrapRef=doc(state.db,'system','bootstrap'); const bs=await getDoc(bootstrapRef);
      if(!bs.exists()){
        const batch=writeBatch(state.db);
        batch.set(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'admin',status:'approved',permissions:['live.read','kpi.read'],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
        batch.set(bootstrapRef,{adminUid:user.uid,createdAt:serverTimestamp()});
        try{await batch.commit();return;}catch(e){console.warn('bootstrap race',e)}
      }
      await setDoc(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'pending',status:'pending',permissions:[],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
    }

    async function refreshAllFromAutoSync(nextStatus){
      state.autoSyncRefreshing=true;
      state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      renderAll();
      try{
        await loadData();
        state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      }finally{
        state.autoSyncRefreshing=false;
        renderAll();
      }
      showToast('Dữ liệu Tiktok vừa được cập nhật tự động');
    }

    async function checkAutoSyncUpdate(){
      if(document.hidden)return;
      if(PREVIEW){
        const next={...(state.autoSyncStatus||{}),ok:true,reason:'preview',finishedAt:new Date().toISOString(),cached:state.sessions.length};
        state.autoSyncRefreshing=true;
        state.autoSyncStatus=next;
        renderAll();
        setTimeout(()=>{ state.autoSyncRefreshing=false; renderAll(); },650);
        return;
      }
      const previous=state.autoSyncStatus?.finishedAt||'';
      const next=await fetchAutoSyncStatus();
      const stamp=next?.finishedAt||'';
      if(stamp && stamp!==previous){
        await refreshAllFromAutoSync(next);
      }else if(next){
        state.autoSyncStatus=next;
        renderDashboard();
      }
    }

    function startAutoSyncWatcher(){
      if(state.autoSyncWatcher)clearInterval(state.autoSyncWatcher);
      state.autoSyncWatcher=setInterval(checkAutoSyncUpdate,60000);
      if(!state.autoSyncVisibilityBound){
        state.autoSyncVisibilityBound=true;
        document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkAutoSyncUpdate(); });
      }
    }

    async function prepareAccountAvatar(file){
      if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WebP.');
      if(file.size>5*1024*1024)throw new Error('Ảnh vượt 5 MB. Vui lòng chọn ảnh nhỏ hơn.');
      const url=URL.createObjectURL(file),image=new Image();
      try{
        await new Promise((resolve,reject)=>{
          image.onload=resolve;image.onerror=()=>reject(new Error('Không đọc được ảnh đã chọn.'));
          image.src=url;
        });
        if(!image.naturalWidth||!image.naturalHeight||image.naturalWidth>8000||image.naturalHeight>8000)throw new Error('Kích thước ảnh không hợp lệ hoặc quá lớn.');
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        if(!ctx)throw new Error('Trình duyệt không thể xử lý ảnh.');
        canvas.width=256;canvas.height=256;
        const size=Math.min(image.naturalWidth,image.naturalHeight);
        ctx.fillStyle='#fff';ctx.fillRect(0,0,256,256);
        ctx.drawImage(image,(image.naturalWidth-size)/2,(image.naturalHeight-size)/2,size,size,0,0,256,256);
        const data=canvas.toDataURL('image/jpeg',0.78);
        if(!data.startsWith('data:image/jpeg;base64,')||data.length>160000)throw new Error('Không thể nén ảnh đủ nhỏ. Vui lòng thử ảnh khác.');
        return data;
      }finally{URL.revokeObjectURL(url);}
    }

    function refreshMoment(iso,withSeconds=false){
      if(!iso)return '';
      const d=new Date(iso);
      if(Number.isNaN(d.getTime()))return '';
      const options={timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',hourCycle:'h23'};
      if(withSeconds){options.second='2-digit';options.day='2-digit';options.month='2-digit';options.year='numeric';}
      return new Intl.DateTimeFormat('vi-VN',options).format(d);
    }

    function renderDataRefreshControl(){
      const wrap=$('#dataRefreshWrap'),button=$('#dataRefreshBtn'),label=$('#dataRefreshLabel'),meta=$('#dataRefreshMeta');
      if(!wrap||!button||!label||!meta)return;
      const visible=state.section==='dashboard';
      wrap.classList.toggle('hidden',!visible);
      if(!visible)return;
      const status=state.dataRefresh?.status||'idle';
      const active=status==='loading'||status==='syncing';
      const last=refreshMoment(state.dataRefresh?.lastAt);
      button.classList.toggle('is-loading',active);
      button.classList.toggle('is-success',status==='success');
      button.classList.toggle('is-partial',status==='partial');
      button.classList.toggle('is-error',status==='error');
      button.disabled=active;
      button.setAttribute('aria-busy',String(active));
      label.textContent=status==='syncing'?'Đang đồng bộ…':status==='loading'?'Đang cập nhật…'
        :status==='success'?'Đã cập nhật':status==='partial'?'Đã đồng bộ LIVE':status==='error'?'Thử lại':'Cập nhật dữ liệu';
      meta.textContent=status==='syncing'?'TikTok LIVE + Affiliate · 120 ngày'
        :status==='loading'?'Đang tải dữ liệu mới nhất'
        :status==='error'?(state.dataRefresh.error?'Đồng bộ chưa hoàn tất':'Cập nhật thất bại')
        :status==='partial'?('Affiliate: '+new Intl.NumberFormat('vi-VN').format(Number(state.dataRefresh.affiliatePending||0))+' phiên đang đối soát')
        :last?('Lúc '+last):(can('live.read')||can('kpi.read'))?'Bao gồm đồng bộ TikTok':'Dữ liệu mới nhất';
      const iconName=status==='success'?'check':status==='error'?'history':'refresh';
      $('#dataRefreshIcon').innerHTML=icon(iconName,16);
      button.title=(status==='partial'?'Đã đồng bộ LIVE; '+Number(state.dataRefresh.affiliatePending||0)+' phiên Affiliate chưa xác minh do khác biệt ghi nhận TikTok Seller/Creator. Giá trị tham khảo không được tính là GMV Affiliate chính xác.':state.dataRefresh.error) || (isAdmin()
        ? 'Đồng bộ TikTok LIVE 120 ngày, bao gồm kiểm tra Affiliate từng phiên'
        : 'Cập nhật dữ liệu LIVE/KPI theo quyền được cấp (120 ngày)');
    }

    function finishDataRefresh(status,error=''){
      clearTimeout(refreshLatestData.resetTimer);
      state.dataRefresh.status=status;
      state.dataRefresh.error=String(error||'');
      if(status==='success'||status==='partial')state.dataRefresh.lastAt=new Date().toISOString();
      renderDataRefreshControl();
      if(status==='success'){
        refreshLatestData.resetTimer=setTimeout(()=>{
          if(state.dataRefresh.status==='success')state.dataRefresh.status='idle';
          renderDataRefreshControl();
        },2500);
      }
    }

    async function refreshLatestData(){
      if(['loading','syncing'].includes(state.dataRefresh?.status))return;
      state.dataRefresh.status='loading';
      state.dataRefresh.error='';
      renderDataRefreshControl();
      if(can('live.read')||can('kpi.read')){
        await request120DaySync('dashboard');
        return;
      }
      try{
        if(PREVIEW)await new Promise(resolve=>setTimeout(resolve,450));
        else await withTimeout(loadData(),STARTUP_TIMEOUT_MS,'Cập nhật dữ liệu');
        renderAll();
        bindShell();
        finishDataRefresh('success');
      }catch(error){
        console.error('refresh latest data',error);
        finishDataRefresh('error',error?.message||error);
      }
    }

      reconcileRefresh.onclick=()=>{ const session=activeReconcileSession(); if(session)loadReconciliation(session.id,true); };
      if(document.documentElement.dataset.shellAccountBound!=='1'){
        document.documentElement.dataset.shellAccountBound='1';
        document.addEventListener('keydown',e=>{
          if(e.key==='Escape'){
            if(state.reconcileModalSessionId)closeReconciliationModal();
            else { setAccountMenu(false); setMobileMenu(false); }
          }
          if(e.key!=='Tab')return;
          const dialog=state.reconcileModalSessionId?$('#reconcileModal'):!$('#accountModalBackdrop').classList.contains('hidden')?$('#accountPopover'):null;
          if(!dialog)return;
          const controls=[...dialog.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,[tabindex="0"]')].filter(el=>el.checkVisibility());
          const first=controls[0],last=controls.at(-1);
          if(!first)return;
          if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){e.preventDefault();last.focus();}
          else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus();}
        });
      }
      const currentRecord=accountDisplayRecord();
      $('#userAvatar').src=avatarSrc(currentRecord);
      $('#topbarAccountBtn').setAttribute('aria-label',`Mở thông tin tài khoản ${currentRecord.displayName}`);
      renderAccountPopover();

    function validAutoSyncStartSeconds(value){
      const n=Number(value||0),now=Math.floor(Date.now()/1000);
      return Number.isFinite(n)&&n>=1577836800&&n<=now+6*3600;
    }
    function validAutoSyncEndSeconds(value,startSeconds){
      const end=Number(value||0),start=Number(startSeconds||0),now=Math.floor(Date.now()/1000);
      return validAutoSyncStartSeconds(start)&&Number.isFinite(end)&&end>=start&&end<=now+6*3600;
    }

    async function mergeAutoSyncedSessions(){
      state.syncedSnapshotAt='';
      if(PREVIEW || !(can('live.read')||can('kpi.read'))) return;
      try{
        const auto=await api('/api/tiktok/autosync/sessions',{timeoutMs:8000});
        const byId=new Map(state.sessions.map(x=>[String(x.liveId||x.id),x]));
        for(const src of auto.sessions||[]){
          const id=String(src.liveId||'');
          if(!id)continue;
          const old=byId.get(id)||{};
          if(src.cacheUpdatedAt && src.cacheUpdatedAt>state.syncedSnapshotAt)state.syncedSnapshotAt=String(src.cacheUpdatedAt);
          const srcStartSeconds=Number(src.startTimeSeconds||0);
          const srcEndSeconds=Number(src.endTimeSeconds||0);
          const startValid=validAutoSyncStartSeconds(srcStartSeconds);
          const endValid=startValid&&validAutoSyncEndSeconds(srcEndSeconds,srcStartSeconds);
          const startMs=startValid?srcStartSeconds*1000:(old.startTime?.toDate?.()?.getTime?.()||0);
          const oldEnd=old.endTime?.toDate?.();
          const oldEndValid=oldEnd instanceof Date&&!Number.isNaN(oldEnd.getTime())&&oldEnd.getTime()>startMs;
          const endMs=endValid?srcEndSeconds*1000:(oldEndValid?oldEnd.getTime():0);
          const amount=Number(src.gmvAmount||0);
          const pending=!endValid&&!oldEndValid;
          const confirmedAffiliate=src.affiliateDataAvailable===true&&src.creatorGmvAvailable===true;
          const keepPreviousAffiliate=!confirmedAffiliate && old.affiliateDataAvailable===true &&
            old.creatorGmvAvailable===true && (src.creatorGmvAvailable!==true ||
            Number(old.currentGmvAmount??old.creatorGmvAmount)===amount);
          const next={
            ...old,
            id,
            liveId:id,
            title:src.title||old.title||'Phiên LIVE',
            channelUsername:src.channelUsername||old.channelUsername||'',
            channelId:src.channelId||old.channelId||'',
            accountType:src.accountType||old.accountType||'',
            shopId:src.shopId||old.shopId||'',
            shopName:src.shopName||old.shopName||'',
            durationSeconds:endMs&&startMs?Math.max(0,Math.round((endMs-startMs)/1000)):0,
            currency:src.currency||old.currency||'VND',
            recordedGmvAmount:old.recordedGmvAmount??amount,
            recordedItemsSold:old.recordedItemsSold??Number(src.itemsSold||0),
            currentGmvAmount:amount,
            finalGmvAmount:amount,
            currentItemsSold:Number(src.itemsSold||0),
            // Preserve last valid Affiliate snapshot when a newer retry is incomplete.
            // Never replace verified values with 0 just because a secondary API failed.
            affiliateDataAvailable:confirmedAffiliate || keepPreviousAffiliate,
            creatorGmvAvailable:src.creatorGmvAvailable===true || (keepPreviousAffiliate&&old.creatorGmvAvailable===true),
            creatorGmvAmount:src.creatorGmvAvailable===true?Number(src.creatorGmvAmount??amount):Number(old.creatorGmvAmount??0),
            sellerGmvAmount:Number(src.sellerGmvAmount??src.gmvAmount??0),
            gmvSource:src.gmvSource||'seller_shop_lives_202509',
            affiliateDataConsistent:(confirmedAffiliate?src.affiliateDataConsistent:old.affiliateDataConsistent)!==false,
            shopProductGmvAmount:confirmedAffiliate?Number(src.shopProductGmvAmount||0):keepPreviousAffiliate?Number(old.shopProductGmvAmount||0):0,
            affiliateGmvAmount:confirmedAffiliate?Number(src.affiliateGmvAmount||0):keepPreviousAffiliate?Number(old.affiliateGmvAmount||0):0,
            affiliateItemsSold:confirmedAffiliate?Number(src.affiliateItemsSold||0):keepPreviousAffiliate?Number(old.affiliateItemsSold||0):0,
            affiliateSkuOrders:confirmedAffiliate?Number(src.affiliateSkuOrders||0):keepPreviousAffiliate?Number(old.affiliateSkuOrders||0):0,
            affiliateCommissionAvailable:src.affiliateCommissionAvailable===true||old.affiliateCommissionAvailable===true,
            affiliateCommissionAmount:src.affiliateCommissionAvailable===true?Number(src.affiliateCommissionAmount||0):Number(old.affiliateCommissionAmount||0),
            affiliateSource:confirmedAffiliate?(src.affiliateSource||''):keepPreviousAffiliate?(old.affiliateSource||''):'',
            affiliateEstimateAvailable:src.affiliateEstimateAvailable===true,
            affiliateEstimateAmount:src.affiliateEstimateAvailable===true?Number(src.affiliateEstimateAmount||0):null,
            affiliateError:src.affiliateError||'',
            reconciliation:pending?null:(src.reconciliation||old.reconciliation||null),
            syncPending:pending,
            syncState:pending?'pending_end_time':'complete',
            hostUid:old.kpiMode==='manual'?'':(old.hostUid||''),
            hostName:old.kpiMode==='manual'?'':(old.hostName||''),
            operatorUid:old.kpiMode==='manual'?'':(old.operatorUid||''),
            operatorName:old.kpiMode==='manual'?'':(old.operatorName||''),
            kpiMode:old.kpiMode||'auto',
            source:'tiktok-auto'
          };
          if(startMs)next.startTime={toDate:()=>new Date(startMs)};
          if(endMs)next.endTime={toDate:()=>new Date(endMs)};
          else delete next.endTime;
          byId.set(id,next);
        }
        state.sessions=[...byId.values()].sort((a,b)=>(b.startTime?.toDate?.()?.getTime?.()||0)-(a.startTime?.toDate?.()?.getTime?.()||0));
      }catch(e){
        console.warn('auto sync cache',e);
      }
    }

    async function loadRecentLiveSessions(cutoff,maxDocs){
      const target=Math.max(1,Math.min(FIRESTORE_TOTAL_SESSION_CAP,Number(maxDocs||FIRESTORE_TOTAL_SESSION_CAP)));
      const pageSize=safeFirestoreQueryLimit(FIRESTORE_SESSION_QUERY_PAGE_SIZE);
      if(pageSize>FIRESTORE_STRUCTURED_QUERY_HARD_LIMIT){
        throw new Error('Firestore page size vượt giới hạn nền tảng');
      }
      const docs=[];
      let cursor=null;
      while(docs.length<target){
        const take=Math.min(pageSize,target-docs.length);
        const constraints=[where('startTime','>=',cutoff),orderBy('startTime','desc')];
        if(cursor)constraints.push(startAfter(cursor));
        constraints.push(limit(take));
        const snap=await getDocs(query(collection(state.db,'liveSessions'),...constraints));
        docs.push(...snap.docs);
        if(snap.docs.length<take)break;
        cursor=snap.docs[snap.docs.length-1];
        if(!cursor)break;
      }
      return docs;
    }

        }
      })();

    function finalGmv(s){ return Number(s.finalGmvAmount ?? s.currentGmvAmount ?? s.recordedGmvAmount ?? 0); }

    function automaticKpiBasis(session){
      if(session?.syncPending===true){
        return {status:'waiting',usable:false,gmv:0,gross:finalGmv(session),reason:'TikTok chưa trả giờ kết thúc hợp lệ. GMV hiện tại chỉ là số tạm tính và chưa dùng chốt KPI.'};
      }
      const summary=session?.reconciliation||null;
      if(!summary||summary.usableForKpi!==true){
        return {
          status:summary?.status||'waiting',
          usable:false,
          gmv:0,
          gross:finalGmv(session),
          reason:summary?.reason||'Chưa có dữ liệu đối soát đơn để tính KPI.'
        };
      }
      return {
        status:summary.status==='final'?'final':'provisional',
        usable:true,
        gmv:Math.max(0,Number(summary.gmvAmount||0)),
        gross:finalGmv(session),
        reason:summary.reason||'',
        generatedAt:summary.generatedAt||''
      };
    }

    function sessionGmvFigures(session){
      const summary=session?.syncPending===true?null:(session?.reconciliation||null);
      const recorded=Math.max(0,Number(finalGmv(session)||0));
      const usable=summary?.usableForKpi===true;
      const status=session?.syncPending===true?'waiting':(summary?.status||'waiting');
      return {
        recorded,
        pending:usable&&status!=='final'?Math.max(0,Number(summary.gmvAmount||0)):null,
        final:usable&&status==='final'?Math.max(0,Number(summary.gmvAmount||0)):null,
        status,
        excludedTimeWindow:Math.max(0,Number(summary?.excludedTimeWindowAmount||0)),
        liveSignalOrders:Number(summary?.liveSignalOrders||0),
        timeWindowOrders:Number(summary?.timeWindowOrders||0)
      };
    }

    function deriveKpiSummaryFromReconciliation(result){
      if(result?.kpiSummary)return result.kpiSummary;
      const orders=Array.isArray(result?.orders)?result.orders:[];
      const analytics=Number(result?.live?.analyticsGmvAmount||0);
      const orderWindow=Number(result?.totals?.orderWindowAmount||0);
      const confirmedLiveSignalAmount=Number(result?.totals?.confirmedLiveSignalAmount||0);
      const affiliateDataAvailable=result?.live?.affiliateDataAvailable===true;
      const shopProductGmvAmount=affiliateDataAvailable?Number(result?.live?.shopProductGmvAmount||0):0;
      const affiliateGmvAmount=affiliateDataAvailable?Number(result?.live?.affiliateGmvAmount||0):0;
      const affiliateItemsSold=affiliateDataAvailable?Number(result?.live?.affiliateItemsSold||0):0;
      const affiliateCommissionAvailable=result?.live?.affiliateCommissionAvailable===true;
      const affiliateCommissionAmount=affiliateCommissionAvailable?Number(result?.live?.affiliateCommissionAmount||0):0;
      const aftersalesAvailable=result?.scope?.aftersalesAvailable!==false;
      const aftersalesError=String(result?.scope?.aftersalesError||'');
      const overlapAmbiguous=result?.scope?.overlapAmbiguous===true;
      const overlapCount=Number(result?.scope?.overlapCount||0);

      const liveSignalRows=orders.filter(order=>order?.attribution==='live_signal');
      const provisionalTimeRows=orders.filter(order=>order?.attribution==='time_window_single_live');
      const excludedTimeRows=orders.filter(order=>order?.attribution==='time_window');
      const singleLiveRows=[...liveSignalRows,...provisionalTimeRows];

      const liveSignalOrders=liveSignalRows.length;
      const provisionalTimeWindowOrders=provisionalTimeRows.length;
      const timeWindowOrders=provisionalTimeRows.length+excludedTimeRows.length;
      const provisionalTimeWindowAmount=provisionalTimeRows.reduce((sum,order)=>sum+Number(order?.netAmount||0),0);
      const excludedTimeWindowAmount=excludedTimeRows.reduce((sum,order)=>sum+Number(order?.netAmount||0),0);
      const timeWindowNetAmount=provisionalTimeWindowAmount+excludedTimeWindowAmount;
      const singleLiveGmv=singleLiveRows.reduce((sum,order)=>sum+Number(order?.netAmount||0),0);
      const singleLiveOrderGross=singleLiveRows.reduce((sum,order)=>sum+Number(order?.amount||0),0);
      const singleLiveAdjustmentRatio=singleLiveOrderGross>0?Math.max(0,Math.min(1,singleLiveGmv/singleLiveOrderGross)):1;
      const affiliateAdjustedGmvAmount=affiliateDataAvailable?Math.round(affiliateGmvAmount*singleLiveAdjustmentRatio):0;
      const singleLiveTotalKpiGmvAmount=Math.round(analytics*singleLiveAdjustmentRatio);

      const overlapOrderGross=orders.reduce((sum,order)=>sum+Number(order?.amount||0),0);
      const overlapOrderNet=orders.reduce((sum,order)=>sum+Number(order?.netAmount||0),0);
      const overlapAdjustmentRatio=overlapOrderGross>0?Math.max(0,Math.min(1,overlapOrderNet/overlapOrderGross)):1;
      const overlapAdjustedGmvAmount=Math.round(analytics*overlapAdjustmentRatio);
      const overlapProrated=overlapAmbiguous&&analytics>0;

      const usable=aftersalesAvailable&&(overlapAmbiguous?(overlapProrated&&orders.length>0):(singleLiveRows.length>0||analytics===0));
      const finalRows=overlapAmbiguous?orders:singleLiveRows;
      const allFinal=usable&&finalRows.every(order=>order?.finalized===true||order?.status==='CANCELLED'||order?.status==='COMPLETED');

      let status='provisional',reason='',gmvAmount=0;
      if(!aftersalesAvailable){
        status='blocked';
        reason='TikTok Return/Refund chưa đọc được'+(aftersalesError?': '+aftersalesError:'.')+' SellerKBB chưa dùng số này để tính KPI.';
      }else if(overlapAmbiguous){
        if(!(overlapProrated&&orders.length>0)){
          status='waiting';
          reason='Hai kênh nội bộ có LIVE chồng giờ nhưng chưa có đủ đơn trong khung thời gian để tính tỷ lệ hủy/hoàn.';
        }else{
          gmvAmount=overlapAdjustedGmvAmount;
          status=allFinal?'final':'provisional';
          reason=allFinal
            ?'LIVE nội bộ chồng giờ đã được xử lý: dùng GMV TikTok Analytics riêng của phiên và áp dụng tỷ lệ hủy/hoàn từ các đơn trong đúng khung giờ. Số này đã chốt.'
            :'LIVE nội bộ chồng giờ đã được xử lý: dùng GMV TikTok Analytics riêng của phiên và áp dụng tỷ lệ hủy/hoàn từ các đơn trong đúng khung giờ. Không cộng trùng đơn giữa hai phiên.';
        }
      }else if(!usable){
        status='waiting';
        reason='Chưa tìm thấy đơn trong khung thời gian phiên LIVE để tính KPI.';
      }else{
        gmvAmount=singleLiveTotalKpiGmvAmount;
        if(allFinal){
          status='final';
          reason=(provisionalTimeWindowOrders>0?'Đã chốt theo quy tắc một kênh nội bộ LIVE trong khung giờ.':'Toàn bộ đơn có tín hiệu LIVE dùng cho KPI đã kết thúc hậu mãi.')+' GMV Affiliate vẫn nằm trong cơ sở KPI.';
        }else if(provisionalTimeWindowOrders>0){
          reason='Chỉ có một kênh nội bộ LIVE trong khung giờ, nên '+provisionalTimeWindowOrders+' đơn khớp thời gian được dùng làm tỷ lệ hủy/hoàn cho toàn GMV LIVE (đã gồm Affiliate).';
        }else{
          reason='GMV chờ đối soát dùng toàn GMV LIVE của phiên (đã gồm Affiliate) và điều chỉnh theo trạng thái đơn hàng nhà.';
        }
      }

      return {
        status,
        usableForKpi:usable,
        gmvAmount:usable?gmvAmount:0,
        analyticsGmvAmount:analytics,
        orderWindowAmount:orderWindow,
        confirmedLiveSignalAmount,
        provisionalTimeWindowAmount,
        excludedTimeWindowAmount,
        timeWindowNetAmount,
        orderCount:orders.length,
        kpiOrderCount:overlapAmbiguous?orders.length:singleLiveRows.length,
        pendingOrderCount:finalRows.filter(order=>order?.finalized!==true&&order?.status!=='CANCELLED'&&order?.status!=='COMPLETED').length,
        cancelledCount:Number(result?.counts?.cancelled||0),
        cancelledAmount:Number(result?.totals?.cancelledAmount ?? orders.filter(order=>String(order?.status||'')==='CANCELLED').reduce((sum,order)=>sum+Number(order?.amount||0),0)),
        returningCount:Number(result?.counts?.returning||0),
        refundedCount:Number(result?.counts?.refunded||0),
        aftersalesAvailable,
        aftersalesError,
        overlapAmbiguous,
        overlapCount,
        overlapProrated,
        overlapOrderGross,
        overlapOrderNet,
        overlapAdjustmentRatio,
        overlapAdjustedGmvAmount,
        affiliateDataAvailable,
        shopProductGmvAmount,
        affiliateGmvAmount,
        affiliateItemsSold,
        affiliateCommissionAvailable,
        affiliateCommissionAmount,
        singleLiveAdjustmentRatio,
        affiliateAdjustedGmvAmount,
        singleLiveTotalKpiGmvAmount,
        liveSignalOrders,
        provisionalTimeWindowOrders,
        timeWindowOrders,
        attribution:overlapProrated?'overlap_prorated':(provisionalTimeWindowOrders>0?(liveSignalOrders>0?'mixed_single_live':'time_window_single_live'):(liveSignalOrders>0?'live_signal':'time_window')),
        generatedAt:new Date().toISOString(),
        finalizedAt:allFinal?new Date().toISOString():'',
        reason
      };
    }

    function reconcileAfterSaleState(order){
      const rows=Array.isArray(order?.aftersales)?order.aftersales:[];
      if(rows.some(x=>['RETURN_OR_REFUND_REQUEST_PENDING','AWAITING_BUYER_SHIP','BUYER_SHIPPED_ITEM','REPLACEMENT_REQUEST_PENDING'].includes(x.status)))return 'returning';
      if(rows.some(x=>['RETURN_OR_REFUND_REQUEST_SUCCESS','RETURN_OR_REFUND_REQUEST_COMPLETE','REPLACEMENT_REQUEST_REFUND_SUCCESS','REPLACEMENT_REQUEST_COMPLETE'].includes(x.status)))return 'refunded';
      if(rows.length)return 'closed';
      return 'none';
    }
    function reconcileOrderState(order){
      const after=reconcileAfterSaleState(order);
      if(after==='returning'||after==='refunded')return after;
      const map={
        AWAITING_SHIPMENT:'packing',
        AWAITING_COLLECTION:'carrier',
        PARTIALLY_SHIPPING:'transport',
        IN_TRANSIT:'delivery',
        DELIVERED:'delivered',
        COMPLETED:'completed',
        CANCELLED:'cancelled'
      };
      return map[order?.status]||'processing';
    }
    function reconcileStatusMeta(order){
      const key=reconcileOrderState(order);

        delivery:{label:'Đang giao',tone:'delivery'},

        returning:{label:'Đang hoàn / trả',tone:'returning'},
        refunded:{label:'Đã hoàn tiền',tone:'refunded'},
        cancelled:{label:'Đã hủy',tone:'cancelled'},
        completed:{label:'Hoàn tất',tone:'completed'},
        processing:{label:'Đang xử lý',tone:'processing'}

      return {key,...map[key]};

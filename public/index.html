<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SellerKBB · TikTok LIVE Report</title>
  <meta name="theme-color" content="#fff4f9" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#fff8fb;
  --bg-soft:#fff1f7;
  --surface:#ffffff;
  --surface-soft:#fff5fa;
  --surface-strong:#fde8f2;
  --line:#efd7e3;
  --line-strong:#e6b9cf;
  --text:#422d38;
  --muted:#856d79;
  --accent:#eb8db9;
  --accent-strong:#d96ca3;
  --accent-soft:#fde4f0;
  --danger:#cc5e79;
  --danger-soft:#fff0f3;
  --warn:#946b20;
  --warn-soft:#fff8e6;
  --ok:#3f8c72;
  --ok-soft:#eef9f5;
  --shadow-sm:0 2px 8px rgba(144,77,111,.045);
  --shadow-md:0 8px 24px rgba(144,77,111,.07);
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html{
  background:var(--bg);
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 0 -10%,rgba(248,196,220,.48) 0,transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(255,224,238,.62) 0,transparent 25%),
    var(--bg);
  font-size:clamp(13px,.22vw + 12.2px,15px);
  line-height:1.55;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.boot{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.boot-card{
  width:min(100%,680px);
  padding:30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(16px);
}
.brand{
  color:#58394a;
  font-size:28px;
  font-weight:900;
  letter-spacing:-.045em;
}
.brand b{color:var(--accent-strong)}
.sub{
  color:var(--muted);
  font-size:clamp(12px,.18vw + 11.5px,14px);
  line-height:1.65;
}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.grid{display:grid;gap:12px}
.tiny{
  color:var(--muted);
  font-size:clamp(11px,.14vw + 10.5px,12.5px);
  line-height:1.45;
}

.btn,.page-btn,.range-btn,.menu-toggle,.nav button{
  position:relative;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,opacity .18s ease,color .18s ease;
}
.btn{
  min-height:40px;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(144,77,111,.04);
}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.btn:active,.page-btn:active,.range-btn:active,.menu-toggle:active,.nav button:active{transform:scale(.965)}
.btn.fx-press,.page-btn.fx-press,.range-btn.fx-press,.menu-toggle.fx-press,.nav button.fx-press{transform:scale(.97)}
.btn.primary{
  border-color:#e79abd;
  background:linear-gradient(135deg,#f6b0d2,var(--accent));
  color:#522c40;
}
.btn.danger{
  border-color:#f0c9d3;
  background:var(--danger-soft);
  color:var(--danger);
}
.btn.ghost{background:rgba(255,255,255,.62)}
.btn.small{min-height:32px;padding:5px 9px;font-size:11.5px}
.btn:disabled,.page-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.btn::after,.nav button::after,.page-btn::after,.range-btn::after,.menu-toggle::after{
  content:'';
  position:absolute;
  left:var(--tap-x,50%);
  top:var(--tap-y,50%);
  width:12px;height:12px;
  border-radius:50%;
  background:rgba(217,109,164,.20);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
}
.btn.fx-ripple::after,.nav button.fx-ripple::after,.page-btn.fx-ripple::after,.range-btn.fx-ripple::after,.menu-toggle.fx-ripple::after{
  animation:fx-ripple .48s ease-out;
}
@keyframes fx-ripple{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.65}
  100%{transform:translate(-50%,-50%) scale(18);opacity:0}
}

.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #f2cade;
  border-radius:999px;
  background:var(--accent-soft);
  color:#8d4969;
  font-weight:700;
  white-space:nowrap;
}
.pill{padding:5px 9px;font-size:clamp(10.5px,.12vw + 10px,12px)}
.tag{padding:4px 7px;font-size:clamp(10px,.1vw + 9.8px,11.5px)}
.pill.ok{border-color:#cce7dd;background:var(--ok-soft);color:var(--ok)}
.pill.warn{border-color:#eadcaf;background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:#efc8d2;background:var(--danger-soft);color:var(--danger)}
.tag.host{border-color:#f0c3d9;background:#fff0f7;color:#a34773}
.tag.operator{border-color:#eadcaf;background:#fff9e9;color:#856527}
.tag.admin{border-color:#cce5db;background:#f0faf6;color:#477d6c}

#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  height:100vh;
  padding:20px;
  border-right:1px solid var(--line);
  background:rgba(255,247,251,.91);
  backdrop-filter:blur(18px);
}
.side-brand{padding:6px 10px 20px}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#806876;
  text-align:left;
  font-weight:700;
  cursor:pointer;
}
.nav button:hover{border-color:var(--line);background:#fff;color:#5d3e4d}
.nav button.active{
  border-color:#efc8da;
  background:linear-gradient(135deg,#fff,#fde8f2);
  color:#8e4268;
  box-shadow:0 6px 17px rgba(190,89,140,.09);
}
.nav-icon{width:23px;text-align:center;font-size:16px}
.side-bottom{position:absolute;left:20px;right:20px;bottom:20px}
.userbox{
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(255,255,255,.9);
  box-shadow:var(--shadow-sm);
}
.avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--accent-soft);
  object-fit:cover;
}

.main{min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px clamp(16px,2vw,28px);
  border-bottom:1px solid var(--line);
  background:rgba(255,251,253,.88);
  backdrop-filter:blur(16px);
}
.topbar-title-wrap{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.topbar-title-wrap>div{min-width:0}
.topbar-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 0 auto;min-width:0}
.account-menu-wrap{position:relative;display:flex;align-items:center}
.topbar-account-btn{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:0 0 40px;
  padding:2px;
  border:1px solid #efd6e2;
  border-radius:50%;
  background:#fffafd;
  box-shadow:0 2px 10px rgba(151,88,117,.08);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.topbar-account-btn:hover{border-color:#e5b8cc;background:#fff4f9}
.topbar-account-btn:focus-visible{outline:3px solid rgba(215,124,165,.2);outline-offset:2px}
.topbar-account-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover}
.account-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:90;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(78,49,63,.28);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.account-modal-backdrop.hidden{display:none}
.topbar-account-popover{
  position:relative;
  width:min(360px,100%);
  padding:18px;
  border:1px solid #efd0df;
  border-radius:18px;
  background:linear-gradient(145deg,#fffefd,#fff4f8);
  box-shadow:0 24px 70px rgba(100,61,80,.22);
  animation:account-modal-in .18s ease-out both;
}
@keyframes account-modal-in{
  from{opacity:0;transform:scale(.985)}
  to{opacity:1;transform:scale(1)}
}
.account-modal-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:#fff0f6;
  color:#a65a7b;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.account-modal-close:hover{background:#fde4ef}
.topbar-account-popover-head{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar-account-popover-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid #efd6e2;background:var(--accent-soft)}
.topbar-account-popover-copy{display:grid;gap:3px;min-width:0}
.topbar-account-popover-copy b{font-size:13px;color:#543b48;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-account-popover-copy span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-account-details{display:grid;padding:8px 0 10px}
.topbar-account-details>div{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0}
.topbar-account-details span{font-size:10px;color:var(--muted);font-weight:650}
.topbar-account-details b{font-size:10.5px;color:#604654;text-align:right}
.topbar-account-logout{width:100%;justify-content:center}
.page-title{
  margin:0;
  color:#513544;
  font-size:clamp(20px,.75vw + 17px,26px);
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.03em;
}
.content{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:clamp(18px,2vw,28px) clamp(14px,2vw,28px) 64px;
}
.section{display:none}
.section.active{
  display:flex;
  flex-direction:column;
  gap:clamp(14px,1.4vw,20px);
  animation:section-enter .22s ease-out both;
}
@keyframes section-enter{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  padding:clamp(14px,1.3vw,18px);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:rgba(255,255,255,.92);
  box-shadow:none;
  transition:border-color .18s ease,background-color .18s ease;
}
.card h3{
  margin:0 0 9px;
  color:#583849;
  font-size:clamp(14px,.3vw + 13px,17px);
  line-height:1.4;
}
.card>.row.space:first-child{gap:10px;margin-bottom:10px}
.stats{
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:12px;
}
.stats .card{min-height:0;padding:clamp(13px,1.2vw,17px)}
.stat-label{
  color:var(--muted);
  font-size:clamp(11px,.18vw + 10.5px,13px);
  font-weight:600;
}
.stat-value{
  margin-top:5px;
  color:#673f54;
  font-size:clamp(18px,.75vw + 15px,25px);
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere;
}

.toolbar,.time-filter{
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:11px 13px;
}
.time-filter{padding:11px 12px}
.range-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.range-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.range-btn{
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#715665;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.range-btn:hover{border-color:var(--line-strong);background:#fff8fb}
.range-btn.active{
  border-color:#e7abc7;
  background:var(--accent-soft);
  color:#944c70;
}
.range-summary{
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.range-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
  align-items:center;
}
.custom-range{
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.range-field{
  display:grid;
  gap:4px;
  min-width:150px;
}
.range-field>span{
  color:var(--muted);
  font-size:10.5px;
  font-weight:700;
}
.range-separator{
  align-self:center;
  color:var(--muted);
  font-size:11px;
}
.date-text{width:150px}
.input{
  min-height:40px;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.input:focus{
  outline:0;
  border-color:var(--accent-strong);
  box-shadow:0 0 0 4px rgba(238,147,189,.12);
}
.input option{background:#fff;color:var(--text)}
.month-select{min-width:190px}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  scrollbar-color:#edb3ce transparent;
  scrollbar-width:thin;
}
table{
  width:100%;
  min-width:1050px;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #f4e5ec;
  text-align:left;
  vertical-align:middle;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:#fff4f9;
  color:#7c6070;
  font-size:clamp(10.5px,.16vw + 10px,12px);
  line-height:1.35;
  font-weight:800;
}
td{
  color:#543c49;
  font-size:clamp(11.5px,.16vw + 11px,13px);
  line-height:1.45;
}
td b{font-size:clamp(12px,.18vw + 11.5px,13.5px)}
tbody tr:hover td{background:#fffafd}
.money{color:#73485d;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:12px}

.notice{
  padding:11px 13px;
  border:1px solid #eadcaf;
  border-radius:8px;
  background:var(--warn-soft);
  color:#74551c;
  font-size:clamp(12px,.16vw + 11.5px,13.5px);
  line-height:1.55;
}
.notice.bad{border-color:#efc8d2;background:var(--danger-soft);color:#a84d63}
.notice.ok{border-color:#cce6dc;background:var(--ok-soft);color:#397761}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkline{
  min-height:25px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#664c59;
  font-size:clamp(11.5px,.15vw + 11px,13px);
}
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair-card{
  padding:clamp(12px,1vw,16px);
  border:1px solid var(--line);
  border-radius:9px;
  background:linear-gradient(135deg,#fff,#fff4f9);
}
.pair-card b{
  display:block;
  margin-bottom:3px;
  color:#704259;
  font-size:clamp(12.5px,.2vw + 12px,14px);
}
.approval-item{
  margin-top:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-soft);
}
.approved-user-row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.approved-user-row:last-child{border-bottom:0;padding-bottom:0}

.mobile-live-list{display:none}
.mobile-live-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  box-shadow:none;
}
.mobile-live-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.mobile-live-title{
  color:#553848;
  font-size:clamp(12.5px,.55vw + 10.5px,14px);
  line-height:1.4;
  font-weight:800;
}
.mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-field{
  min-width:0;
  padding:9px 10px;
  border:1px solid #f5dce8;
  border-radius:10px;
  background:var(--surface-soft);
}
.mobile-field .tiny{display:block;margin-bottom:2px}
.mobile-field strong{
  display:block;
  color:#614052;
  font-size:clamp(12px,.45vw + 10.5px,13.5px);
  line-height:1.35;
  overflow-wrap:anywhere;
}
.mobile-assign{
  display:grid;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line-strong);
}
.mobile-assign .input{width:100%;min-width:0!important}
.mobile-live-list .btn{width:100%}

.pagination-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.82);
  box-shadow:none;
}
.pagination-info{
  color:var(--muted);
  font-size:clamp(10.5px,.14vw + 10px,12px);
}
.pagination{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:wrap;
}
.page-btn{
  min-width:32px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:#744a5f;
  font-size:clamp(11px,.12vw + 10.5px,12px);
  font-weight:700;
  cursor:pointer;
}
.page-btn:hover:not(:disabled){border-color:var(--line-strong);background:#fff7fb}
.page-btn.active{border-color:#e5a9c6;background:var(--accent-soft);color:#954c70}
.page-ellipsis{min-width:22px;text-align:center;color:var(--muted)}

.menu-toggle{display:none}
.mobile-menu-overlay{display:none}
.action-toast{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top, 0px) + 20px);
  bottom:auto;
  z-index:120;
  width:max-content;
  min-width:min(340px,calc(100vw - 32px));
  max-width:min(92vw,560px);
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 20px 15px 16px;
  border:1px solid #edbfd4;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(255,254,255,.99),rgba(255,237,246,.99));
  color:#64404f;
  box-shadow:
    inset 4px 0 0 #d56e9e,
    0 18px 46px rgba(151,88,117,.20),
    0 5px 14px rgba(126,72,97,.11);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  font-size:14.5px;
  line-height:1.45;
  font-weight:800;
  letter-spacing:-.01em;
  text-align:left;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-10px) scale(.975);
  transition:opacity .2s ease,transform .24s cubic-bezier(.22,.61,.36,1);
}
.action-toast::before{
  content:'';
  width:12px;
  height:12px;
  flex:0 0 12px;
  border-radius:50%;
  background:#d56e9e;
  box-shadow:0 0 0 7px rgba(213,110,158,.15);
}

/* v1.6.0 unified soft UI */
:root{
  --bg:#f6f5f7;
  --bg-soft:#fbf7f9;
  --surface:#ffffff;
  --surface-soft:#faf7f9;
  --surface-strong:#f6e8ef;
  --line:#ece4e8;
  --line-strong:#dfcfd7;
  --text:#352a31;
  --muted:#7d7077;
  --accent:#d86f9f;
  --accent-strong:#c75f90;
  --accent-soft:#f8e7ef;
  --danger:#ba536d;
  --warn:#8a6829;
  --ok:#3f846d;
  --shadow-sm:0 1px 3px rgba(67,42,54,.05);
  --shadow-md:0 8px 24px rgba(67,42,54,.07);
  --radius-sm:6px;
  --radius-md:9px;
  --radius-lg:12px;
}
html,body{background:var(--bg)}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 85% -10%,rgba(240,196,216,.25),transparent 28%),
    linear-gradient(180deg,#faf8f9 0,#f6f5f7 52%,#f5f4f6 100%);
}
.ui-icon{display:inline-block;flex:0 0 auto;vertical-align:-3px}
.btn .ui-icon{margin-right:5px}
#app{grid-template-columns:244px minmax(0,1fr)}

.sidebar{
  padding:18px 14px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
}
.side-brand{padding:8px 10px 22px}
.side-brand .brand{font-size:24px;letter-spacing:-.04em}
.nav{gap:4px}
.nav button{
  min-height:44px;
  gap:11px;
  padding:10px 11px;
  border:0;
  border-radius:8px;
  color:#776a71;
  font-weight:650;
}
.nav button:hover{
  background:#faf7f9;
  color:#513b47;
  transform:none;
}
.nav button.active{
  position:relative;
  border:0;
  background:#f8edf2;
  color:#8b3f64;
  box-shadow:none;
}
.nav button.active::before{
  content:'';
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:3px;
  border-radius:2px;
  background:var(--accent);
}
.nav-icon{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  color:currentColor;
}
.side-bottom{left:14px;right:14px;bottom:16px}
.userbox{
  padding:10px;
  border:0;
  border-top:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}

.topbar{
  min-height:70px;
  padding:10px clamp(16px,2.2vw,30px);
  border-bottom:1px solid rgba(226,216,221,.8);
  background:rgba(249,248,249,.88);
  backdrop-filter:blur(18px);
}
.page-title{color:#3b2e35;font-size:clamp(20px,.6vw + 17px,25px)}
.content{
  max-width:1460px;
  padding:clamp(18px,2vw,28px) clamp(14px,2.1vw,30px) 56px;
}
.section.active{
  gap:18px;
  padding:clamp(16px,1.7vw,24px);
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.88);
  box-shadow:0 1px 2px rgba(67,42,54,.025);
}
.section.active>.card{
  padding:0 0 18px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.section.active>.card:last-child{padding-bottom:0;border-bottom:0}
.card:hover{box-shadow:none!important;transform:none!important}
.card h3{color:#47353e;font-size:15px;margin-bottom:7px}

.metrics-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.metrics-grid.metrics-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric-card{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:0;
  padding:15px;
  border:1px solid #f0e5ea;
  border-radius:10px;
  background:linear-gradient(145deg,#fff 0,#fcf8fa 100%);
}
.metric-icon{
  width:38px;height:38px;
  display:grid;place-items:center;
  flex:0 0 auto;
  border-radius:9px;
  background:var(--accent-soft);
  color:#a95079;

.status-dot{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  white-space:nowrap;
}
.status-dot::before{
  content:'';
  width:7px;height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 0 rgba(63,132,109,0);
  opacity:.92;
  transform:scale(.94);
}
.status-dot.ok{color:#3f846d;background:#eff8f4}
.status-dot.ok::before{
  animation:statusDotPulse 1.45s cubic-bezier(.22,.61,.36,1) infinite;
}
@keyframes statusDotPulse{
  0%{transform:scale(.9);box-shadow:0 0 0 0 rgba(63,132,109,.42);opacity:.82}
  42%{transform:scale(1.08);box-shadow:0 0 0 5px rgba(63,132,109,.16);opacity:1}
  72%{transform:scale(1);box-shadow:0 0 0 8px rgba(63,132,109,0);opacity:.96}
  100%{transform:scale(.9);box-shadow:0 0 0 0 rgba(63,132,109,0);opacity:.82}
}
@media (prefers-reduced-motion: reduce){
  .status-dot.ok::before{animation:none;box-shadow:0 0 0 3px rgba(63,132,109,.14);transform:none}

/* v1.7 calendar range picker */
.custom-range{

  background:#faf8f9;

}

  min-height:54px;

  padding:8px 11px;

}

:root{
  --bg:#fff8fb;
  --bg-soft:#fff1f6;
  --surface:#ffffff;
  --surface-soft:#fff7fa;
  --surface-strong:#fde8f1;
  --line:#f0dbe5;
  --line-strong:#e5bfd1;
  --text:#46323d;
  --muted:#88717d;
  --accent:#e7a3c0;
  --accent-strong:#d77ca5;
  --accent-soft:#fdeaf2;
  --shadow-sm:0 1px 4px rgba(151,88,117,.055);
  --shadow-md:0 10px 28px rgba(151,88,117,.09);
}
html,body{background:var(--bg)}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 88% -12%,rgba(247,205,224,.34),transparent 30%),
    radial-gradient(circle at 4% 10%,rgba(255,229,240,.42),transparent 24%),
    linear-gradient(180deg,#fffafb 0,#fff7fa 55%,#fff4f8 100%);

.brand-lockup{
  display:flex;

  gap:0;
  color:#5b3e4c;
  font-size:24px;
  font-weight:850;
  line-height:1;
  letter-spacing:-.045em;
  white-space:nowrap;
}
.brand-lockup .brand-seller{font-weight:750}
.brand-lockup b{color:var(--accent-strong);font-weight:950}
.brand-lockup .brand-live{

  border:1px solid #f0cfdd;
  border-radius:6px;

  color:#995d79;

  font-weight:850;
  letter-spacing:.08em;
}
.boot-card{border-color:var(--line);background:rgba(255,255,255,.96)}

.side-brand{padding:9px 10px 23px}
.nav{display:grid;gap:18px}
.nav-group{display:grid;gap:5px}

  line-height:1.3;

.nav-group-items{display:grid;gap:4px}
.nav button{color:#806c76}

.page-title{color:#533944}

.range-tabs{border-color:var(--line);background:#fff0f5}
.range-btn{color:#806c76}

.range-btn.active{background:#fff;color:#ad5a80;box-shadow:0 1px 4px rgba(151,88,117,.09)}
.custom-range{background:#fff6f9}
.date-pick.active{border-color:#e2a9c1;box-shadow:0 0 0 3px rgba(215,124,165,.11)}
.calendar-nav{background:#fff2f7;color:#94627a}

.storage-progress i{background:linear-gradient(90deg,#efb8cf,#da82a8)}
.user-list-avatar{border-color:#efd5e0}
.mobile-menu-overlay{background:rgba(78,49,63,.25)}
.approved-user-card{
  padding:14px 0;
  border-bottom:1px solid var(--line);

.approved-user-card:last-child{border-bottom:0;padding-bottom:0}
.user-access-grid{
  display:grid;
  grid-template-columns:minmax(180px,.7fr) minmax(260px,1.3fr);
  gap:14px;
  align-items:start;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;

.approved-user-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

.approved-user-side{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  min-width:0;
}
.approved-user-actions{display:flex;align-items:center;gap:6px}
.user-icon-btn{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:#a7557a;

.user-icon-btn:hover{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent-strong)}

.user-icon-btn.danger{color:var(--danger);background:#fffafb}
.user-icon-btn.danger:hover{background:var(--danger-soft);border-color:#efc8d2}

.user-access-grid{margin-top:12px}
.user-access-actions{margin-top:10px;justify-content:flex-end}

@media(max-width:1100px) and (min-width:701px){
  .nav{gap:12px}
  .nav-group{gap:0}
  .nav-group-title{display:none}
  .side-brand{text-align:center;padding-left:0;padding-right:0}
  .side-brand .brand-lockup{justify-content:center}
  .side-brand .brand-seller,.side-brand .brand-live{display:none!important}
  .side-brand .brand-lockup b{font-size:18px}
}
@media(max-width:700px){
  body{background:#fff7fa}
  .topbar{background:rgba(255,250,252,.96)}
  .sidebar{
    background:rgba(255,249,252,.995)!important;
    box-shadow:18px 0 42px rgba(117,68,91,.16)!important;
  }
  .side-brand .brand-seller,.side-brand .brand-live{display:inline-flex!important}
  .nav{gap:17px!important}
  .nav-group{gap:6px}
  .nav-group-title{display:block!important;padding:0 12px}
  .nav-group-items{display:grid!important;gap:4px!important}
  .section.active{background:#fff;border-color:var(--line)}
  .approved-user-summary{align-items:flex-start}

/* v1.13 manual KPI allocations */
.metrics-grid.metrics-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.manual-kpi-section-head{align-items:flex-start}
.manual-kpi-session-list{display:grid;gap:12px;margin-top:12px}
.manual-kpi-session{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:linear-gradient(145deg,#fff 0,#faf8fe 100%);
}
.manual-kpi-session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.manual-kpi-title-row{gap:8px;flex-wrap:wrap}
.manual-kpi-session-head>div:first-child{min-width:0}
.manual-kpi-total{display:grid;gap:2px;text-align:right;white-space:nowrap}
.manual-kpi-total span{font-size:9.5px;color:var(--muted)}
.manual-kpi-total b{color:#6f50a1;font-size:14px}
.manual-kpi-rule{display:flex;align-items:flex-start;gap:7px;margin:10px 0;padding:9px 10px;border-left:3px solid #b69add;border-radius:4px;background:#f5f1fb;color:#6f6379;font-size:10.5px;line-height:1.45}
.manual-kpi-rule .ui-icon{flex:0 0 auto;color:#8061b1;margin-top:1px}
.manual-kpi-entries{display:grid;gap:7px}
.manual-kpi-entry{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:end;
  gap:9px 10px;
  padding:10px;
  border:1px solid #e8e1f1;
  border-radius:8px;
  background:#fff;
}
.manual-kpi-entry label{display:grid;gap:4px;min-width:0}
.manual-kpi-entry label>span,.manual-kpi-entry.readonly>div>span{font-size:9.5px;color:var(--muted);font-weight:650}
.manual-kpi-entry .input{width:100%;min-width:0}
.manual-host-gmv-field{grid-column:1}
.manual-host-kpi-field{grid-column:1}
.manual-operator-kpi-field{grid-column:2}
.manual-entry-remove{width:34px;height:36px;padding:0;font-size:18px;grid-column:2;justify-self:end}
.manual-kpi-entry.readonly{grid-template-columns:repeat(2,minmax(0,1fr));align-items:center}
.manual-kpi-entry.readonly>div{display:grid;gap:3px}
.manual-kpi-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.manual-kpi-static-field{display:grid;gap:4px;min-width:0}
.manual-kpi-static-field>span{font-size:9.5px;color:var(--muted);font-weight:650}
.manual-kpi-output{
  width:100%;
  min-height:40px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:#fff5f8;
  color:#a45579;
  font-size:13px;
  font-weight:750;
  line-height:1.2;
  user-select:none;
  -webkit-user-select:none;
  pointer-events:none;
  cursor:default;
  touch-action:manipulation;
}
.manual-kpi-value{color:#7654a6!important;font-weight:750}
@media(max-width:1050px){
  .metrics-grid.metrics-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .metrics-grid.metrics-4{grid-template-columns:1fr 1fr}
  .manual-kpi-section-head,.manual-kpi-session-head{display:grid;gap:9px}
  .manual-kpi-total{text-align:left}
  .manual-kpi-entry,.manual-kpi-entry.readonly{grid-template-columns:1fr}
  .manual-host-gmv-field,.manual-host-kpi-field,.manual-operator-kpi-field,.manual-entry-remove{grid-column:1}
  .manual-entry-remove{justify-self:end}
  .manual-kpi-actions{display:grid;grid-template-columns:1fr}
  .manual-kpi-actions .btn{width:100%}
}

    function bindCalendarPicker(scope,section){
      const calendar=section.querySelector(`[data-date-calendar="${scope}"]`);
      if(!calendar)return;
      const startBtn=section.querySelector('[data-date-target="start"]');
      const endBtn=section.querySelector('[data-date-target="end"]');
      if(!startBtn||!endBtn)return;

      let target='start';
      let view=new Date((startBtn.dataset.value||localDateKey(new Date()))+'T00:00:00');
      const todayKey=localDateKey(new Date());

      const setTarget=next=>{
        target=next;
        startBtn.classList.toggle('active',target==='start');
        endBtn.classList.toggle('active',target==='end');
        const value=(target==='start'?startBtn:endBtn).dataset.value;
        if(value)view=new Date(value+'T00:00:00');
        draw();
      };

      const draw=()=>{
        const y=view.getFullYear(), m=view.getMonth();
        const first=new Date(y,m,1);
        const offset=(first.getDay()+6)%7;
        const days=new Date(y,m+1,0).getDate();
        const startKey=startBtn.dataset.value||'';
        const endKey=endBtn.dataset.value||'';
        let cells='';
        for(let i=0;i<offset;i++)cells+='<span class="calendar-day empty" aria-hidden="true"></span>';
        for(let day=1;day<=days;day++){
          const d=new Date(y,m,day);
          const key=localDateKey(d);
          const inRange=startKey&&endKey&&key>=startKey&&key<=endKey;
          const cls=['calendar-day',key===todayKey?'today':'',key===startKey?'start':'',key===endKey?'end':'',inRange?'in-range':''].filter(Boolean).join(' ');
          cells+=`<button type="button" class="${cls}" data-calendar-day="${key}">${day}</button>`;
        }
        calendar.innerHTML=`
          <div class="calendar-head">
            <button type="button" class="calendar-nav" data-calendar-nav="-1" aria-label="Tháng trước">‹</button>
            <b>Tháng ${m+1}/${y}</b>
            <button type="button" class="calendar-nav" data-calendar-nav="1" aria-label="Tháng sau">›</button>
          </div>
          <div class="calendar-week"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
          <div class="calendar-grid">${cells}</div>`;

        calendar.querySelectorAll('[data-calendar-nav]').forEach(btn=>btn.onclick=()=>{
          view=new Date(view.getFullYear(),view.getMonth()+Number(btn.dataset.calendarNav),1);
          draw();
        });
        calendar.querySelectorAll('[data-calendar-day]').forEach(btn=>btn.onclick=()=>{
          const value=btn.dataset.calendarDay;
          const pick=target==='start'?startBtn:endBtn;
          pick.dataset.value=value;
          pick.querySelector('b').textContent=displayDateKey(value);
          if(target==='start') setTarget('end');
          else draw();
        });
      };

      startBtn.onclick=()=>setTarget('start');
      endBtn.onclick=()=>setTarget('end');
      draw();
    }

      if(Number.isNaN(d.getTime()))return 'Chưa có lần đồng bộ';
      const parts=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hourCycle:'h23'}).formatToParts(d);
      const get=t=>parts.find(x=>x.type===t)?.value||'00';
      return get('hour')+':'+get('minute')+':'+get('second')+' , Ngày '+get('day')+'/'+get('month')+'/'+get('year')+'.';
    }

    async function fetchAutoSyncStatus(){
      if(PREVIEW)return state.autoSyncStatus;
      try{
        const result=await api('/api/tiktok/autosync/status');
        return result.autoSync||null;
      }catch(e){
        console.warn('auto sync status',e);
        return null;
      }
    }

    async function refreshAllFromAutoSync(nextStatus){
      state.autoSyncRefreshing=true;
      state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      renderAll();
      try{
        await loadData();
        state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      }finally{
        state.autoSyncRefreshing=false;
        renderAll();
      }
      showToast('Dữ liệu Tiktok vừa được cập nhật tự động');
    }

    async function checkAutoSyncUpdate(){
      if(document.hidden)return;
      if(PREVIEW){
        const next={...(state.autoSyncStatus||{}),ok:true,reason:'preview',finishedAt:new Date().toISOString(),cached:state.sessions.length};
        state.autoSyncRefreshing=true;
        state.autoSyncStatus=next;
        renderAll();
        setTimeout(()=>{ state.autoSyncRefreshing=false; renderAll(); },650);
        return;
      }
      const previous=state.autoSyncStatus?.finishedAt||'';
      const next=await fetchAutoSyncStatus();
      const stamp=next?.finishedAt||'';
      if(stamp && stamp!==previous){
        await refreshAllFromAutoSync(next);
      }else if(next){
        state.autoSyncStatus=next;
        renderDashboard();
      }
    }

    function startAutoSyncWatcher(){
      if(state.autoSyncWatcher)clearInterval(state.autoSyncWatcher);
      state.autoSyncWatcher=setInterval(checkAutoSyncUpdate,60000);
      if(!state.autoSyncVisibilityBound){
        state.autoSyncVisibilityBound=true;
        document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkAutoSyncUpdate(); });
      }
    }

    function bindInteractionEffects(){
      if(document.documentElement.dataset.fxBound==='1') return;
      document.documentElement.dataset.fxBound='1';
      document.addEventListener('pointerdown',e=>{
        const target=e.target.closest('.btn,.nav button,.page-btn,.menu-toggle');
        if(!target||target.disabled)return;
        const rect=target.getBoundingClientRect();
        target.style.setProperty('--tap-x',(e.clientX-rect.left)+'px');
        target.style.setProperty('--tap-y',(e.clientY-rect.top)+'px');
        target.classList.add('fx-press');
        target.classList.remove('fx-ripple');
        void target.offsetWidth;
        target.classList.add('fx-ripple');
      });
      const clear=()=>document.querySelectorAll('.fx-press').forEach(x=>x.classList.remove('fx-press'));
      document.addEventListener('pointerup',clear);
      document.addEventListener('pointercancel',clear);
    }

    async function mergeAutoSyncedSessions(){
      if(PREVIEW || !(can('live.read')||can('kpi.read'))) return;
      try{
        const auto=await api('/api/tiktok/autosync/sessions');
        const byId=new Map(state.sessions.map(x=>[String(x.liveId||x.id),x]));
        for(const src of auto.sessions||[]){
          const id=String(src.liveId||'');
          if(!id)continue;
          const old=byId.get(id)||{};
          const startMs=Number(src.startTimeSeconds||0)*1000;
          const endMs=Number(src.endTimeSeconds||0)*1000;
          const amount=Number(src.gmvAmount||0);
          byId.set(id,{
            ...old,
            id,
            liveId:id,
            title:src.title||old.title||'Phiên LIVE',
            channelUsername:src.channelUsername||old.channelUsername||'',
            channelId:src.channelId||old.channelId||'',
            accountType:src.accountType||old.accountType||'',
            shopId:src.shopId||old.shopId||'',
            shopName:src.shopName||old.shopName||'',
            startTime:{toDate:()=>new Date(startMs)},
            endTime:{toDate:()=>new Date(endMs)},
            durationSeconds:Number(src.durationSeconds||0),
            currency:src.currency||old.currency||'VND',
            recordedGmvAmount:old.recordedGmvAmount??amount,
            recordedItemsSold:old.recordedItemsSold??Number(src.itemsSold||0),
            currentGmvAmount:amount,
            finalGmvAmount:amount,
            currentItemsSold:Number(src.itemsSold||0),
            hostUid:old.kpiMode==='manual'?'':(old.hostUid||''),
            hostName:old.kpiMode==='manual'?'':(old.hostName||''),
            operatorUid:old.kpiMode==='manual'?'':(old.operatorUid||''),
            operatorName:old.kpiMode==='manual'?'':(old.operatorName||''),
            kpiMode:old.kpiMode||'auto',
            source:'tiktok-auto'
          });
        }
        state.sessions=[...byId.values()].sort((a,b)=>(b.startTime?.toDate?.()?.getTime?.()||0)-(a.startTime?.toDate?.()?.getTime?.()||0));
      }catch(e){
        console.warn('auto sync cache',e);
      }
    }

    async function loadStaffDirectory(){
      const fallback=defaultStaffMembers();
      try{
        const snap=await getDoc(doc(state.db,'settings','staffMembers'));
        if(snap.exists()){
          state.staff=normalizeStaffMembers(snap.data()?.items);
        }else{
          state.staff=fallback;
          if(isAdmin()){
            await setDoc(doc(state.db,'settings','staffMembers'),{items:state.staff,updatedAt:serverTimestamp(),updatedBy:state.user?.uid||''},{merge:true});
          }
        }
      }catch(error){
        console.warn('staff directory',error);
        state.staff=fallback;
      }
    }

    async function loadData(){
      state.sessions=[]; state.users=[]; state.staff=[];
      await loadStaffDirectory();
      if(isAdmin()&&!PREVIEW){
        try{
          const m=await api('/api/maintenance/settings');
          state.maintenance={...state.maintenance,...m,settings:{...state.maintenance.settings,...(m.settings||{})}};
        }catch(e){ console.warn('maintenance settings',e); }
      }
      if(can('live.read')||can('kpi.read')){
        if(!PREVIEW){ const syncStatus=await fetchAutoSyncStatus(); if(syncStatus)state.autoSyncStatus=syncStatus; }
        const days=Math.min(180,Number(state.maintenance.settings.retentionDays||180));
        const cutoff=Timestamp.fromMillis(Date.now()-days*86400000);
        const maxDocs=Math.min(12000,Number(state.maintenance.settings.firestoreMaxSessions||12000));
        const q=query(collection(state.db,'liveSessions'),where('startTime','>=',cutoff),orderBy('startTime','desc'),limit(maxDocs));
        const snap=await getDocs(q);
        state.sessions=snap.docs.map(d=>({id:d.id,...d.data()})).map(x=>isManualKpi(x)?{...x,hostUid:'',hostName:'',operatorUid:'',operatorName:''}:x);
        await mergeAutoSyncedSessions();
      }
      if(isAdmin()){
        const us=await getDocs(collection(state.db,'users'));
        state.users=us.docs.map(d=>({id:d.id,...d.data()}));
      }
    }

    function finalGmv(s){ return Number(s.finalGmvAmount ?? s.currentGmvAmount ?? s.recordedGmvAmount ?? 0); }

    function reconcileAfterSaleState(order){
      const rows=Array.isArray(order?.aftersales)?order.aftersales:[];
      if(rows.some(x=>['RETURN_OR_REFUND_REQUEST_PENDING','AWAITING_BUYER_SHIP','BUYER_SHIPPED_ITEM','REPLACEMENT_REQUEST_PENDING'].includes(x.status)))return 'returning';
      if(rows.some(x=>['RETURN_OR_REFUND_REQUEST_SUCCESS','RETURN_OR_REFUND_REQUEST_COMPLETE','REPLACEMENT_REQUEST_REFUND_SUCCESS','REPLACEMENT_REQUEST_COMPLETE'].includes(x.status)))return 'refunded';
      if(rows.length)return 'closed';
      return 'none';
    }
    function reconcileOrderState(order){
      const after=reconcileAfterSaleState(order);
      if(after==='returning'||after==='refunded')return after;
      const map={
        AWAITING_SHIPMENT:'packing',
        AWAITING_COLLECTION:'carrier',
        PARTIALLY_SHIPPING:'transport',
        IN_TRANSIT:'delivery',
        DELIVERED:'delivered',
        COMPLETED:'completed',
        CANCELLED:'cancelled'
      };
      return map[order?.status]||'processing';
    }
    function reconcileStatusMeta(order){
      const key=reconcileOrderState(order);
      const map={
        packing:{label:'Chờ đóng hàng',tone:'packing'},
        carrier:{label:'Chờ vận chuyển',tone:'carrier'},
        transport:{label:'Đang vận chuyển',tone:'transport'},
        delivery:{label:'Đang giao',tone:'delivery'},
        delivered:{label:'Đã giao',tone:'delivered'},
        returning:{label:'Đang hoàn / trả',tone:'returning'},
        refunded:{label:'Đã hoàn tiền',tone:'refunded'},
        cancelled:{label:'Đã hủy',tone:'cancelled'},
        completed:{label:'Hoàn tất',tone:'completed'},
        processing:{label:'Đang xử lý',tone:'processing'}
      };
      return {key,...map[key]};
    }

    function reconcileFilterDefinitions(orders){
      const defs=[
        ['all','Tất cả'],
        ['packing','Chờ đóng hàng'],
        ['carrier','Chờ vận chuyển'],
        ['transport','Đang vận chuyển'],
        ['delivery','Đang giao'],
        ['delivered','Đã giao'],
        ['returning','Đang hoàn / trả'],
        ['refunded','Đã hoàn tiền'],
        ['cancelled','Đã hủy'],
        ['completed','Hoàn tất'],
        ['processing','Đang xử lý']
      ];
      const counter={all:orders.length};
      orders.forEach(o=>{const key=reconcileOrderState(o);counter[key]=(counter[key]||0)+1;});
      return defs.filter(([key])=>key==='all'||counter[key]>0).map(([key,label])=>({key,label,count:counter[key]||0}));
    }

    function previewReconciliation(session){
      const samples=[
        {status:'AWAITING_SHIPMENT',after:null},
        {status:'AWAITING_COLLECTION',after:null},
        {status:'PARTIALLY_SHIPPING',after:null},
        {status:'IN_TRANSIT',after:null},
        {status:'DELIVERED',after:null},
        {status:'IN_TRANSIT',after:'BUYER_SHIPPED_ITEM'},
        {status:'DELIVERED',after:'RETURN_OR_REFUND_REQUEST_COMPLETE'},
        {status:'CANCELLED',after:null},
        {status:'COMPLETED',after:null}
      ];
      const orders=samples.map((sample,i)=>{
        const amount=Math.round(finalGmv(session)/11)+(i*95000);
        const refunded=sample.after==='RETURN_OR_REFUND_REQUEST_COMPLETE';
        return {
          id:'ORD-'+String(i+1).padStart(4,'0'),
          status:sample.status,
          amount,
          netAmount:sample.status==='CANCELLED'?0:(refunded?Math.round(amount*.62):amount),
          currency:session.currency||'VND',

    function liveEndTime(s){
      const explicit=s?.endTime?.toDate?.();
      if(explicit instanceof Date && !Number.isNaN(explicit.getTime())) return s.endTime;
      const start=s?.startTime?.toDate?.();
      const duration=Number(s?.durationSeconds||0);
      if(!(start instanceof Date)||Number.isNaN(start.getTime())||duration<=0)return null;
      return {toDate:()=>new Date(start.getTime()+duration*1000)};
    }
    function fmtLiveTimeRange(s){
      const start=s?.startTime?.toDate?.();
      const end=liveEndTime(s)?.toDate?.();
      if(!(start instanceof Date)||Number.isNaN(start.getTime()))return '—';
      const p=n=>String(n).padStart(2,'0');
      const startDate=`${p(start.getDate())}/${p(start.getMonth()+1)}/${start.getFullYear()}`;
      const startTime=`${p(start.getHours())}:${p(start.getMinutes())}`;
      if(!(end instanceof Date)||Number.isNaN(end.getTime()))return `${startDate} Vào lúc ${startTime}`;
      const endTime=`${p(end.getHours())}:${p(end.getMinutes())}`;
      const sameDay=start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()&&start.getDate()===end.getDate();
      if(sameDay)return `${startDate} Vào lúc ${startTime}-${endTime}`;
      const endDate=`${p(end.getDate())}/${p(end.getMonth()+1)}/${end.getFullYear()}`;
      return `${startDate} Vào lúc ${startTime}-${endDate} ${endTime}`;
    }

    function normalizedManualKpiEntries(session){
      return (Array.isArray(session?.manualKpiEntries)?session.manualKpiEntries:[])
        .map((entry,index)=>{
          const role=entry?.role==='operator'?'operator':'host';
          const gmv=Math.max(0,Number(entry?.gmv||0));
          return {
            uid:String(entry?.uid||''),
            name:String(entry?.name||''),
            role,
            gmv,
            kpi:Math.round(gmv*(role==='operator'?.001:.003)),
            currency:String(entry?.currency||session?.currency||'VND'),
            index
          };
        })
        .filter(entry=>entry.uid||entry.name);
    }

    function buildKpiRows(){
      const map=new Map();
      const ensure=(uid,name,currency)=>{
        const key=uid||name;
        if(!key)return null;
        let cur=map.get(key);
        if(!cur){
          cur={uid:uid||'',name:name||'',roles:new Set(),autoGmv:0,manualGmv:0,autoKpi:0,manualKpi:0,currency:currency||'VND'};
          map.set(key,cur);
        }
        if(name&&!cur.name)cur.name=name;
        if(currency)cur.currency=currency;
        return cur;
      };
      for(const session of sessionsForRange()){
        if(isManualKpi(session)){
          for(const entry of normalizedManualKpiEntries(session)){
            const cur=ensure(entry.uid,entry.name,entry.currency||session.currency);
            if(!cur)continue;
            cur.roles.add(entry.role);
            cur.manualGmv+=entry.gmv;
            cur.manualKpi+=entry.kpi;
          }
          continue;
        }
        const g=finalGmv(session);
        if(session.hostUid||session.hostName){
          const cur=ensure(session.hostUid,session.hostName,session.currency);
          if(cur){cur.roles.add('host');cur.autoGmv+=g;cur.autoKpi+=g*.003;}
        }
        if(session.operatorUid||session.operatorName){
          const cur=ensure(session.operatorUid,session.operatorName,session.currency);
          if(cur){cur.roles.add('operator');cur.autoGmv+=g;cur.autoKpi+=g*.001;}
        }
      }
      return [...map.values()].map(row=>({
        ...row,
        roles:[...row.roles],
        gmv:row.autoGmv+row.manualGmv,
        kpi:row.autoKpi+row.manualKpi
      })).sort((a,b)=>b.kpi-a.kpi);
    }

    function kpiRoleSummary(row){
      const roles=Array.isArray(row?.roles)?row.roles:[];
      if(roles.length===1)return roleLabel(roles[0]);
      if(roles.length>1)return 'Nhiều vai trò';
      return 'KPI thủ công';
    }

      return buildKpiRows();

    function exportKpiCsv(){
      const rows=kpiRowsForExport();
      const header=['name','role','gmv_auto','gmv_manual','gmv_total','kpi_auto','kpi_manual','kpi_total','currency'];
      const lines=[header,...rows.map(x=>[x.name,kpiRoleSummary(x),x.autoGmv,x.manualGmv,x.gmv,x.autoKpi,x.manualKpi,x.kpi,x.currency])];
      const csv=lines.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
      const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      const range=selectedRange();
      a.download='sellerkbb-kpi-'+range.startKey+'_'+range.endKey+'.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function manualMoneyNumber(value){
      const digits=String(value??'').replace(/[^0-9]/g,'');
      return Math.max(0,Number(digits||0));
    }

    function manualMoneyDisplay(value){
      return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(manualMoneyNumber(value))+'đ';
    }

    function setManualMoneyInput(input,value){
      if(!input)return;
      const display=manualMoneyDisplay(value);
      if('value' in input)input.value=display;
      else input.textContent=display;
    }

    function manualKpiPeople(role=''){
      return role?staffForRole(role):[...staffForRole('host'),...staffForRole('operator')];
    }

    function manualKpiPersonOptions(role,value=''){
      const people=manualKpiPeople(role);
      return '<option value="">— Chọn '+(role==='operator'?'nhân viên vận hành':'Host')+' —</option>'+
        people.map(u=>`<option value="${u.id}" ${u.id===staffSelectionId(role,value,'')?'selected':''}>${esc(u.displayName)}</option>`).join('');
    }

    function manualKpiPairs(session){
      const entries=normalizedManualKpiEntries(session);
      const pairs=[];
      for(const entry of entries){
        if(entry.role==='host'){
          pairs.push({host:entry,operator:null});
          continue;
        }
        let target=[...pairs].reverse().find(pair=>!pair.operator);
        if(!target){target={host:null,operator:null};pairs.push(target);}
        target.operator=entry;
      }
      return pairs;
    }

    function manualKpiPairRow(session,pair,index,editable){
      const host=pair?.host||{uid:'',name:'',role:'host',gmv:0,kpi:0,currency:session.currency||'VND'};
      const operator=pair?.operator||{uid:'',name:'',role:'operator',gmv:host.gmv||0,kpi:Math.round(Number(host.gmv||0)*.001),currency:session.currency||'VND'};
      const gmv=Math.max(0,Number(host.gmv||operator.gmv||0));
      const hostKpi=Math.round(gmv*.003);
      const operatorKpi=Math.round(gmv*.001);

      if(!editable){
        return `<div class="manual-kpi-entry readonly">
          <div><span>Host Livestream</span>${host.uid||host.name?userIdentityHtml(staffDisplayRecord(host.uid,host.name),true):'<b>—</b>'}</div>
          <div><span>Nhân viên vận hành Livestream</span>${operator.uid||operator.name?userIdentityHtml(staffDisplayRecord(operator.uid,operator.name),true):'<b>—</b>'}</div>
          <div><span>GMV sau hoàn/hủy của Host Livestream</span><b>${fmtMoney(gmv,session.currency)}</b></div>
          <div><span>KPI của Host Livestream (0,3%)</span><b>${fmtMoney(hostKpi,session.currency)}</b></div>
          <div><span>KPI của Nhân viên vận hành Livestream (0,1%)</span><b>${fmtMoney(operatorKpi,session.currency)}</b></div>
        </div>`;
      }

      return `<div class="manual-kpi-entry" data-manual-entry>
        <label><span>Host Livestream</span><select class="input" data-manual-host-person>${manualKpiPersonOptions('host',staffSelectionId('host',host.uid,host.name))}</select></label>
        <label><span>Nhân viên vận hành Livestream</span><select class="input" data-manual-operator-person>${manualKpiPersonOptions('operator',staffSelectionId('operator',operator.uid,operator.name))}</select></label>
        <label class="manual-host-gmv-field"><span>GMV sau hoàn/hủy của Host Livestream</span><input class="input" type="text" inputmode="numeric" autocomplete="off" data-manual-host-gmv value="${manualMoneyDisplay(gmv)}"></label>
        <div class="manual-host-kpi-field manual-kpi-static-field"><span>KPI của Host Livestream (0,3%)</span><div class="manual-kpi-output" data-manual-host-kpi aria-live="polite">${manualMoneyDisplay(hostKpi)}</div></div>
        <div class="manual-operator-kpi-field manual-kpi-static-field"><span>KPI của Nhân viên vận hành Livestream (0,1%)</span><div class="manual-kpi-output" data-manual-operator-kpi aria-live="polite">${manualMoneyDisplay(operatorKpi)}</div></div>
        <button class="btn small danger manual-entry-remove" type="button" data-manual-remove aria-label="Xóa nhóm người này">×</button>
      </div>`;
    }

    function bindManualKpiPair(row){
      const gmvInput=row.querySelector('[data-manual-host-gmv]');
      const hostKpiInput=row.querySelector('[data-manual-host-kpi]');
      const operatorKpiInput=row.querySelector('[data-manual-operator-kpi]');

      const syncKpis=()=>{
        const gmv=manualMoneyNumber(gmvInput?.value);
        setManualMoneyInput(hostKpiInput,Math.round(gmv*.003));
        setManualMoneyInput(operatorKpiInput,Math.round(gmv*.001));
      };

      setManualMoneyInput(gmvInput,manualMoneyNumber(gmvInput?.value));
      syncKpis();

      gmvInput?.addEventListener('input',()=>{
        setManualMoneyInput(gmvInput,manualMoneyNumber(gmvInput.value));
        syncKpis();
      });
    }

    function manualKpiSessionCard(session,editable){
      const saved=normalizedManualKpiEntries(session);
      const pairs=manualKpiPairs(session);
      const rows=pairs.length?pairs:[{host:null,operator:null}];
      const totalManual=saved.reduce((sum,e)=>sum+Math.round(Number(e.gmv||0)*(e.role==='operator'?.001:.003)),0);
      const peopleCount=saved.filter(e=>e.uid||e.name).length;
      const status=peopleCount?'Đã nhập '+peopleCount+' người':'Chưa nhập';
      return `<div class="manual-kpi-session" data-manual-session="${session.id}">

          <div>
            <div class="row manual-kpi-title-row"><b>${esc(session.title||'Phiên LIVE')}</b><span class="pill warn">${status}</span></div>

      </div>`;
    }

    function collectManualKpiEntries(card,session){
      const rows=[...card.querySelectorAll('[data-manual-entry]')];
      const entries=[];
      for(const row of rows){
        const hostUid=row.querySelector('[data-manual-host-person]')?.value||'';
        const operatorUid=row.querySelector('[data-manual-operator-person]')?.value||'';
        const gmv=manualMoneyNumber(row.querySelector('[data-manual-host-gmv]')?.value);
        const hostKpi=Math.round(gmv*.003);
        const operatorKpi=Math.round(gmv*.001);

        if(!hostUid&&(gmv||hostKpi||operatorUid))throw new Error('Hãy chọn Host Livestream cho nhóm KPI đã nhập.');
        if(!hostUid&&!operatorUid)continue;

        const host=state.staff.find(u=>u.id===hostUid);
        if(!host)throw new Error('Không tìm thấy Host Livestream đã chọn.');
        entries.push({uid:hostUid,name:host.displayName||'',role:'host',gmv,kpi:hostKpi,currency:session.currency||'VND'});

        if(operatorUid){
          const operator=state.staff.find(u=>u.id===operatorUid);
          if(!operator)throw new Error('Không tìm thấy Nhân viên vận hành Livestream đã chọn.');
          entries.push({uid:operatorUid,name:operator.displayName||'',role:'operator',gmv,kpi:operatorKpi,currency:session.currency||'VND'});
        }
      }
      return entries;
    }

    async function saveManualKpiSession(sessionId,button){
      const session=state.sessions.find(s=>s.id===sessionId);
      const card=button?.closest('[data-manual-session]');
      if(!session||!card)return;
      let entries;
      try{entries=collectManualKpiEntries(card,session)}catch(error){showToast(error.message||'Dữ liệu KPI thủ công chưa hợp lệ');return;}
      session.manualKpiEntries=entries;
      if(PREVIEW){
        persistPreviewState();
        showToast('Đã lưu KPI thủ công và cộng vào KPI nhân sự');
        renderManualKpi();
        renderKpi();
        return;
      }
      await setDoc(doc(state.db,'liveSessions',sessionId),{
        manualKpiEntries:entries,
        manualKpiUpdatedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      },{merge:true});
      showToast('Đã lưu KPI thủ công và cộng vào KPI nhân sự');
      await loadData();
      renderAll();
    }

    function bindManualKpiEditors(){
      if(!isAdmin())return;
      document.querySelectorAll('[data-manual-session]').forEach(card=>{
        const sessionId=card.dataset.manualSession;
        card.querySelectorAll('[data-manual-entry]').forEach(bindManualKpiPair);

        card.querySelector('[data-manual-add]')?.addEventListener('click',()=>{
          const list=card.querySelector('.manual-kpi-entries');
          const index=list.querySelectorAll('[data-manual-entry]').length;
          const session=state.sessions.find(s=>s.id===sessionId);
          list.insertAdjacentHTML('beforeend',manualKpiPairRow(session,{host:null,operator:null},index,true));
          bindManualKpiPair(list.lastElementChild);
        });

        card.addEventListener('click',event=>{
          const remove=event.target.closest('[data-manual-remove]');
          if(remove){
            const row=remove.closest('[data-manual-entry]');
            const rows=card.querySelectorAll('[data-manual-entry]');
            if(rows.length===1){
              row.querySelector('[data-manual-host-person]').value='';
              row.querySelector('[data-manual-operator-person]').value='';
              setManualMoneyInput(row.querySelector('[data-manual-host-gmv]'),0);
              setManualMoneyInput(row.querySelector('[data-manual-host-kpi]'),0);
              setManualMoneyInput(row.querySelector('[data-manual-operator-kpi]'),0);
            }else row.remove();
          }
        });

        card.querySelector('[data-manual-save]')?.addEventListener('click',event=>saveManualKpiSession(sessionId,event.currentTarget));
      });
    }

    function estimateSessionBytes(session){
      try{
        const plain={...session};
        delete plain.rawSummary;
        return new TextEncoder().encode(JSON.stringify(plain)).length + 900;
      }catch{return 1800}
    }

    function formatStorageBytes(bytes){
      const n=Math.max(0,Number(bytes||0));
      if(n<1024)return new Intl.NumberFormat('vi-VN').format(n)+' B';
      if(n<1024*1024)return (n/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' KB';
      if(n<1024*1024*1024)return (n/1024/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' MB';
      return (n/1024/1024/1024).toLocaleString('vi-VN',{maximumFractionDigits:2})+' GB';
    }

    function storagePercent(used,limit){
      if(!Number(limit))return 0;
      return Math.max(0,Math.min(100,Number(used||0)/Number(limit)*100));
    }

    function storageQuotaCard({provider,iconName,usedBytes,limitBytes,note,estimate=false,available=true}){
      const pct=storagePercent(usedBytes,limitBytes);
      const pctText=pct<0.01&&usedBytes>0?'0,01':pct.toLocaleString('vi-VN',{minimumFractionDigits:pct>=1?1:2,maximumFractionDigits:2});
      const width=usedBytes>0?Math.max(.7,pct):0;
      return `<div class="storage-quota-card">
        <div class="storage-quota-head">
          <div class="storage-provider-icon">${icon(iconName,20)}</div>
          <div class="storage-provider-copy"><b>${provider}</b><span>${estimate?'Ước tính':'Đang sử dụng'}</span></div>
          <strong>${available?pctText+'%':'—'}</strong>
        </div>
        <div class="storage-usage-line"><b>${available?formatStorageBytes(usedBytes):'Chưa lấy được'}</b><span>/ ${formatStorageBytes(limitBytes)}</span></div>
        <div class="storage-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${available?pct.toFixed(2):'0'}"><i style="width:${available?width:0}%"></i></div>
        <div class="storage-quota-foot"><span>${available?pctText+'% / 100%':'Không có dữ liệu'}</span><small>${note}</small></div>
      </div>`;
    }

    function effectiveRetentionDays(){
      return Math.max(RECONCILIATION_PROTECTION_DAYS,Number(state.maintenance.settings.retentionDays||180));
    }
    function maintenanceStats(){
      const settings=state.maintenance.settings;
      const totalBytes=state.sessions.reduce((a,s)=>a+estimateSessionBytes(s),0)*3;
      const totalMb=totalBytes/1024/1024;
      const count=state.sessions.length;
      const retention=effectiveRetentionDays();
      const cutoff=Date.now()-retention*86400000;
      const protectCutoff=Date.now()-RECONCILIATION_PROTECTION_DAYS*86400000;
      const expired=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)<cutoff).length;
      const protectedCount=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=protectCutoff).length;
      const countPct=Math.min(999,Math.round(count/Math.max(1,Number(settings.firestoreMaxSessions||12000))*100));
      const mbPct=Math.min(999,Math.round(totalMb/Math.max(1,Number(settings.firestoreSoftLimitMb||600))*100));
      return {count,totalMb,expired,protectedCount,retention,countPct,mbPct,pressure:Math.max(countPct,mbPct)};
    }

    async function cleanupFirestoreData(emergency=false){
      const settings=state.maintenance.settings;
      const retention=effectiveRetentionDays();
      const cutoff=Date.now()-retention*86400000;
      const protectCutoff=Date.now()-RECONCILIATION_PROTECTION_DAYS*86400000;
      if(PREVIEW){
        const before=state.sessions.length;
        state.sessions=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=cutoff);
        return before-state.sessions.length;
      }
      if(!isAdmin()||!state.db)return 0;
      if(settings.autoCleanup===false && emergency)return 0;
      const sorted=[...state.sessions].sort((a,b)=>(a.startTime?.toDate?.()?.getTime?.()||0)-(b.startTime?.toDate?.()?.getTime?.()||0));
      const deleteIds=new Set();
      // Chỉ đọc/xóa tối đa 300 phiên thực sự quá hạn. Vùng 60 ngày gần nhất luôn được bảo vệ.
      const staleQuery=query(collection(state.db,'liveSessions'),where('startTime','<',Timestamp.fromMillis(cutoff)),orderBy('startTime','asc'),limit(300));
      const staleSnap=await getDocs(staleQuery);
      staleSnap.docs.forEach(d=>deleteIds.add(d.id));
      const stats=maintenanceStats();
      const threshold=Number(settings.emergencyPercent||85);
      if(settings.autoCleanup!==false && (stats.countPct>=threshold || stats.mbPct>=threshold)){
        let remainingCount=stats.count-deleteIds.size;
        let remainingBytes=stats.totalMb;
        const targetCount=Math.floor(Number(settings.firestoreMaxSessions||12000)*.70);
        const targetMb=Number(settings.firestoreSoftLimitMb||600)*.70;
        for(const item of sorted){
          if(deleteIds.has(item.id)) continue;
          const started=item.startTime?.toDate?.()?.getTime?.()||0;
          if(started>=protectCutoff) continue;
          if(remainingCount<=targetCount && remainingBytes<=targetMb) break;
          deleteIds.add(item.id);
          remainingCount--;
          remainingBytes-=estimateSessionBytes(item)*3/1024/1024;
        }
      }
      if(!deleteIds.size)return 0;
      const ids=[...deleteIds];
      for(let i=0;i<ids.length;i+=300){
        const batch=writeBatch(state.db);
        ids.slice(i,i+300).forEach(id=>batch.delete(doc(state.db,'liveSessions',id)));
        await batch.commit();
      }
      return ids.length;
    }

        </div>

        <div class="card free-plan-note">
          <h3 class="heading-with-icon">${icon('shield',18)} Chế độ Firebase Free</h3>
          <div class="notice ok"><b>Không dùng Firestore TTL trả phí.</b> SellerKBB chỉ đọc tối đa dữ liệu trong thời gian lưu và tự dọn tối đa 300 phiên quá hạn mỗi lượt; phiên trong 60 ngày gần nhất không nằm trong danh sách xóa.</div>
          <div class="sub" style="margin-top:10px">Thanh Firebase phía trên là ước tính dữ liệu SellerKBB đang quản lý; số liệu Firestore thực tế có thể cao hơn do index và metadata. Cách này vẫn ưu tiên giữ trong quota Free và tránh tạo lượng đọc/ghi/xóa lớn bất ngờ.</div>
        </div>

        <div class="card">
          <h3 class="heading-with-icon">${icon('settings',18)} Gợi ý cài đặt</h3>
          <div class="recommend-list">
            <div><b>Khuyến nghị hiện tại</b><span>180 ngày · bảo vệ đối soát tối thiểu 60 ngày · dọn ở 85% · TikTok tự đồng bộ mỗi 1 giờ.</span></div>
            <div><b>Nếu dữ liệu tăng rất nhanh</b><span>Có thể giảm còn 60–120 ngày; hệ thống vẫn không xóa vùng 60 ngày gần nhất.</span></div>
            <div><b>Nếu muốn ưu tiên lịch sử</b><span>Giữ 180 ngày và nâng ngưỡng ứng dụng; không được vượt quá 180 ngày.</span></div>
          </div>
        </div>`;
      $('#retentionDays').value=String(m.retentionDays);
      $('#emergencyPercent').value=String(m.emergencyPercent);
      $('#saveMaintenance').onclick=saveMaintenanceSettings;
      $('#cleanupNow').onclick=async()=>{ const n=await cleanupFirestoreData(false); if(!PREVIEW&&n) await loadData(); showToast(n?`Đã xóa ${n} phiên cũ`:'Không có dữ liệu cần xóa'); renderAll(); };
      $('#runKvCleanup').onclick=async()=>{ if(PREVIEW){ showToast('Preview: Cloudflare KV đang trong vùng an toàn'); return; } const result=await api('/api/maintenance/run',{method:'POST'}); showToast(`Cloudflare: đã kiểm tra ${result.keyCount||0} khóa, xóa ${result.deleted||0}`); await loadData(); renderAll(); };
    }

    async function saveMaintenanceSettings(){
      const next={
        retentionDays:Number($('#retentionDays').value),
        emergencyPercent:Number($('#emergencyPercent').value),
        firestoreSoftLimitMb:Number($('#firestoreSoftLimitMb').value),
        firestoreMaxSessions:Number($('#firestoreMaxSessions').value),
        kvSoftKeyLimit:Number($('#kvSoftKeyLimit').value),
        autoCleanup:$('#autoCleanup').checked
      };
      if(next.retentionDays>180)next.retentionDays=180;
      if(PREVIEW){
        state.maintenance.settings={...state.maintenance.settings,...next};
        persistPreviewState();
        showToast('Đã lưu cài đặt Preview');
        renderAll(); return;
      }
      const saved=await api('/api/maintenance/settings',{method:'POST',body:JSON.stringify(next)});
      state.maintenance.settings={...state.maintenance.settings,...saved.settings};
      const deleted=await cleanupFirestoreData(false);
      await loadData();
      showToast(deleted?`Đã lưu cài đặt và dọn ${deleted} phiên cũ`:'Đã lưu cài đặt');
      renderAll();
    }

    async function renderTikTok(){
      if(!isAdmin()){ $('#section-tiktok').innerHTML='';return; }
      if(PREVIEW){
        $('#section-tiktok').innerHTML=`
          <div class="api-hero">
            <div class="api-hero-icon">${icon('plug')}</div>
            <div class="api-hero-copy"><span class="eyebrow">TikTok Shop Seller API</span><h3>Kết nối liên tục 24/24</h3><p>Dữ liệu LIVE tự được đồng bộ mỗi giờ. Không cần chọn ngày và không cần bấm đồng bộ thủ công.</p></div>
            <span class="status-dot ok">Đang hoạt động</span>
          </div>
          <div class="status-grid">
            <div class="status-item">${icon('refresh')}<div><span>Refresh Token</span><b>Tự gia hạn trước khi Access Token hết hạn</b></div></div>
            <div class="status-item">${icon('sync')}<div><span>Đồng bộ tự động</span><b>Mỗi 1 giờ · chạy 24/24</b></div></div>
            <div class="status-item">${icon('history')}<div><span>Đối soát số liệu</span><b>Mỗi ngày rà lại 30 ngày gần nhất</b></div></div>
          </div>
          <div class="api-foot"><div><b>LIVE Performance API</b><span>/analytics/202509/shop_lives/performance</span></div><button class="btn" id="previewSync">${icon('check')} Kiểm tra kết nối</button></div>`;
        $('#previewSync').onclick=()=>showToast('Kết nối TikTok mẫu hoạt động bình thường');
        return;
      }

      let status={configured:state.config.tiktokConfigured,connected:false,autoRefresh:false,autoSyncEnabled:true,autoSync:null,grantedScopes:[]};
      try{status=await api('/api/tiktok/status')}catch(e){status.error=e.message}
      const accessExpiry=status.accessTokenExpiresAt?fmtDate({toDate:()=>new Date(status.accessTokenExpiresAt*1000)}):'Chưa có';
      const refreshExpiry=status.refreshTokenExpiresAt?fmtDate({toDate:()=>new Date(status.refreshTokenExpiresAt*1000)}):'Chưa có';
      const sync=status.autoSync||{};
      const lastSync=sync.finishedAt?fmtDate({toDate:()=>new Date(sync.finishedAt)}):'Chưa chạy';
      const syncState=status.connected?(sync.ok===false?'Có lỗi cần kiểm tra':'Đang hoạt động'):'Chưa kết nối';

      $('#section-tiktok').innerHTML=`
        <div class="api-hero">
          <div class="api-hero-icon">${icon('plug')}</div>
          <div class="api-hero-copy"><span class="eyebrow">TikTok Shop Seller API</span><h3>${status.connected?'Kết nối liên tục 24/24':'Chưa kết nối TikTok'}</h3><p>${status.connected?'SellerKBB tự lấy dữ liệu LIVE mỗi giờ và tự đối soát lại số liệu hằng ngày.':'Kết nối một lần để bật đồng bộ tự động và gia hạn token.'}</p></div>
          <span class="status-dot ${status.connected&&sync.ok!==false?'ok':'warn'}">${syncState}</span>
        </div>
        ${!status.configured?'<div class="notice">Chưa cấu hình đủ TikTok App Key / Secret / Service ID / Seller Authorization URL / KV binding.</div>':''}
        <div class="status-grid">
          <div class="status-item">${icon('refresh')}<div><span>Refresh Token</span><b>${status.autoRefresh?'Tự gia hạn · Access Token hết hạn '+accessExpiry:'Chưa có refresh token'}</b><small>Refresh Token hết hạn: ${refreshExpiry}</small></div></div>
          <div class="status-item">${icon('sync')}<div><span>Đồng bộ tự động</span><b>Mỗi 1 giờ · chạy 24/24</b><small>Lần gần nhất: ${lastSync}</small></div></div>
          <div class="status-item">${icon('database')}<div><span>Dữ liệu cache</span><b>${new Intl.NumberFormat('vi-VN').format(Number(sync.cached||0))} phiên LIVE</b><small>Đối soát 30 ngày gần nhất mỗi ngày</small></div></div>
        </div>
        <div class="api-foot">
          <div><b>LIVE Performance API</b><span>/analytics/202509/shop_lives/performance</span></div>
          <div class="row">
            ${status.configured&&!status.connected?'<button id="connectTikTok" class="btn primary">'+icon('link')+' Kết nối TikTok Seller</button>':''}
            ${status.connected?'<button id="checkTikTok" class="btn">'+icon('check')+' Kiểm tra trạng thái</button>':''}
          </div>
        </div>
        ${sync.error?`<div class="notice bad">Đồng bộ gần nhất gặp lỗi: ${esc(sync.error)}</div>`:''}
        ${status.grantedScopes?.length?`<div class="scope-line tiny">Scopes: ${esc(status.grantedScopes.join(', '))}</div>`:''}`;

      if($('#connectTikTok')) $('#connectTikTok').onclick=async()=>{try{const result=await api('/api/tiktok/oauth/start',{method:'POST'});location.href=result.url}catch(e){showToast(e.message)}};
      if($('#checkTikTok')) $('#checkTikTok').onclick=()=>showToast(status.connected?'Kết nối đang hoạt động · đồng bộ 24/24 đã bật':'TikTok chưa kết nối');
    }

    function renderAll(){ renderNav(); renderDashboard(); renderLive(); renderReconcile(); renderKpi(); renderManualKpi(); renderExport(); renderUsers(); renderStaff(); renderTikTok(); renderStorage(); switchSection(state.section); }

    init().catch(e=>showBoot(`<b>Không khởi động được ứng dụng.</b><br><br>${esc(e.message)}`));
  </script>
</body>
</html>

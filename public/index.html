<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SellerKBB · TikTok LIVE Report</title>
  <meta name="theme-color" content="#fff4f9" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
    :root{
      --bg:#fff7fb;--bg2:#fff0f7;--panel:#ffffff;--panel2:#fffafd;--surface-soft:#fff4f9;
      --line:#f0d8e5;--line-strong:#e9bfd3;--text:#3b2633;--muted:#876c7b;
      --accent:#ee93bd;--accent2:#d96da4;--accent-soft:#fde4f0;
      --danger:#d85f7d;--danger-soft:#fff0f3;--warn:#a97924;--warn-soft:#fff6dc;
      --ok:#3d9377;--ok-soft:#edf9f4;--blue:#788ed9;
      --shadow:0 14px 40px rgba(156,91,124,.10);
      font-family:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:
      radial-gradient(circle at 0 -10%,rgba(248,197,222,.62) 0,transparent 29%),
      radial-gradient(circle at 100% 18%,rgba(255,222,237,.70) 0,transparent 24%),
      var(--bg);color:var(--text);min-height:100vh}
    button,input,select{font:inherit}.hidden{display:none!important}
    button{-webkit-tap-highlight-color:transparent}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .boot-card{max-width:680px;width:100%;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .brand{font-weight:900;letter-spacing:-.045em;font-size:28px;color:#543447}.brand b{color:var(--accent2)}
    .sub{color:var(--muted);line-height:1.7}
    .btn{border:1px solid var(--line);border-radius:13px;padding:10px 15px;cursor:pointer;font-weight:700;background:#fff;color:var(--text);box-shadow:0 3px 10px rgba(156,91,124,.05);min-height:42px}
    .btn:hover{border-color:var(--line-strong);transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn.primary{background:linear-gradient(135deg,#f5acd0,var(--accent));border-color:#e99ac0;color:#4d2639}
    .btn.danger{background:var(--danger-soft);border-color:#f2cad4;color:var(--danger)}
    .btn.ghost{background:rgba(255,255,255,.55);border:1px solid var(--line)}
    .btn.small{padding:7px 11px;font-size:12px;min-height:34px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:#8c4968;font-size:12px;font-weight:700;border:1px solid #f5cfe1}
    .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:#cdebdc}
    .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#f1dfad}
    .pill.bad{background:var(--danger-soft);color:var(--danger);border-color:#f2cad4}

    #app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    .sidebar{border-right:1px solid var(--line);background:rgba(255,246,251,.90);backdrop-filter:blur(18px);padding:20px;position:sticky;top:0;height:100vh;z-index:10}
    .side-brand{padding:8px 10px 22px}
    .nav{display:grid;gap:7px}
    .nav button{border:1px solid transparent;background:transparent;color:#856a79;text-align:left;padding:12px 13px;border-radius:14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:10px}
    .nav button:hover{background:#fff;border-color:var(--line);color:#5a394a}
    .nav button.active{background:linear-gradient(135deg,#fff,#fde7f2);border-color:#f2cade;color:#8b4265;box-shadow:0 7px 18px rgba(204,108,156,.10)}
    .nav-icon{width:22px;text-align:center;font-size:16px}
    .side-bottom{position:absolute;left:20px;right:20px;bottom:20px}
    .userbox{padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 6px 20px rgba(156,91,124,.07)}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);object-fit:cover}
    .tiny{font-size:12px;color:var(--muted);line-height:1.5}

    .main{min-width:0}
    .topbar{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;background:rgba(255,250,253,.84);backdrop-filter:blur(16px);position:sticky;top:0;z-index:4}
    .content{padding:24px 28px 64px;max-width:1600px;margin:0 auto;width:100%}
    .page-title{font-size:25px;font-weight:900;letter-spacing:-.035em;margin:0;color:#503245}
    .grid{display:grid;gap:14px}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}
    .card{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    .stat-label{color:var(--muted);font-size:13px;font-weight:600}
    .stat-value{font-size:24px;font-weight:900;margin-top:8px;color:#613d51;letter-spacing:-.03em;overflow-wrap:anywhere}
    .card h3{margin:0 0 12px;font-size:16px;color:#553448}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .input{background:#fff;color:var(--text);border:1px solid var(--line-strong);border-radius:12px;padding:9px 11px;min-height:42px}
    .input:focus{outline:3px solid rgba(238,147,189,.20);border-color:var(--accent2)}
    .input option{background:#fff;color:var(--text)}

    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;scrollbar-color:#efb6d1 transparent;scrollbar-width:thin}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:1050px;background:#fff}
    th,td{padding:12px 13px;border-bottom:1px solid #f5e6ed;text-align:left;vertical-align:middle}
    th{position:sticky;top:0;background:#fff4f9;color:#805f71;font-size:12px;letter-spacing:.01em;z-index:1;font-weight:800}
    tbody tr:hover td{background:#fffafd}
    td{font-size:13px;color:#533949}
    .money{font-variant-numeric:tabular-nums;font-weight:800;color:#74425b}
    .muted{color:var(--muted)}
    .empty{padding:44px;text-align:center;color:var(--muted)}
    .section{display:none}.section.active{display:block}
    .tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#795c6b;background:#fff9fc;font-weight:700}
    .tag.host{color:#a34374;border-color:#f0c2d9;background:#fff0f7}
    .tag.operator{color:#8b6b2f;border-color:#eadbb2;background:#fff9e9}
    .tag.admin{color:#477d6d;border-color:#cce5dc;background:#f0faf6}
    .notice{border:1px solid #eadbb2;background:var(--warn-soft);color:#76571e;border-radius:16px;padding:14px 16px;line-height:1.65}
    .notice.bad{border-color:#f1c6d1;background:var(--danger-soft);color:#aa4962}
    .notice.ok{border-color:#cde8de;background:var(--ok-soft);color:#377763}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .checkline{display:flex;gap:8px;align-items:center;color:#674b59;font-size:13px}
    .kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pair-card{padding:15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#fff,#fff3f9)}
    .pair-card b{display:block;margin-bottom:5px;color:#704057}

    .mobile-live-list{display:none}
    .mobile-live-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(156,91,124,.08)}
    .mobile-live-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:13px}
    .mobile-live-title{font-weight:800;color:#533448;line-height:1.45}
    .mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mobile-field{background:var(--surface-soft);border:1px solid #f7dce9;border-radius:12px;padding:10px;min-width:0}
    .mobile-field .tiny{display:block;margin-bottom:4px}
    .mobile-field strong{font-size:13px;display:block;overflow-wrap:anywhere}
    .mobile-assign{display:grid;gap:9px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
    .mobile-assign .input{width:100%;min-width:0!important}
    .mobile-live-list .btn{width:100%}

    @media(max-width:1050px){
      #app{grid-template-columns:88px minmax(0,1fr)}
      .sidebar{padding:16px 10px}.side-brand .brand span,.nav button span:not(.nav-icon),.side-bottom .usertext{display:none}
      .nav button{justify-content:center;text-align:center;padding:12px 8px}.nav-icon{font-size:18px}
      .side-bottom{left:10px;right:10px}.userbox{justify-content:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:700px){
      body{background:linear-gradient(180deg,#fff4f9 0,#fffafd 36%,#fff7fb 100%)}
      #app{display:block;padding-bottom:82px}
      .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;z-index:30;border-right:0;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,250,253,.96);box-shadow:0 -8px 30px rgba(156,91,124,.10)}
      .side-brand,.side-bottom{display:none}
      .nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
      .nav button{white-space:nowrap;flex:1 0 64px;min-width:64px;padding:7px 4px;border-radius:12px;display:flex;flex-direction:column;gap:2px;font-size:10px;line-height:1.2}
      .nav button span:not(.nav-icon){display:block!important}.nav-icon{font-size:17px;height:20px}
      .nav button.active{box-shadow:none}
      .topbar{min-height:70px;padding:10px 14px;align-items:flex-start}
      .topbar>.row{gap:6px;justify-content:flex-end}.topbar .pill{display:none}
      .topbar .btn{min-height:36px;padding:7px 10px;font-size:11px}
      .content{padding:14px 12px 26px}
      .page-title{font-size:21px}.page-title+.tiny{margin-top:2px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
      .card{border-radius:17px;padding:14px}
      .stat-value{font-size:18px;margin-top:5px}
      .stat-label{font-size:11px}
      .form-grid,.kpi-pair{grid-template-columns:1fr}
      .toolbar{align-items:stretch;gap:8px}.toolbar .input,.toolbar .btn{flex:1 1 100%}
      .desktop-live-table{display:none}.mobile-live-list{display:grid;gap:10px}
      .mobile-grid{grid-template-columns:1fr 1fr}
      .table-wrap:not(.desktop-live-table){margin-left:-2px;margin-right:-2px}
      table{min-width:720px}
      th,td{padding:10px;font-size:12px}
      .empty{padding:28px 14px}
      .boot{padding:16px}.boot-card{padding:24px 20px;border-radius:22px}
    }
    @media(max-width:390px){
      .stats{grid-template-columns:1fr}
      .mobile-grid{grid-template-columns:1fr}
      .nav button{flex-basis:58px;min-width:58px;font-size:9px}
    }
  
    /* v1.1.1 layout balance */
    .content{padding-top:30px;padding-bottom:80px}
    .section.active{display:flex;flex-direction:column;gap:24px}
    .section.active>*{margin-top:0!important;margin-bottom:0!important}
    .section.active>.toolbar{margin:0!important}
    .stats{
      grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:16px;
      margin:0
    }
    .stats .card{
      min-height:132px;
      display:flex;
      flex-direction:column;
      justify-content:space-between
    }
    .card{padding:20px}
    .card+.card{margin-top:0!important}
    .card>.row.space:first-child{gap:14px;margin-bottom:16px}
    .card>.row.space:first-child h3{margin:0}
    .toolbar{
      margin:0;
      padding:14px 16px;
      background:rgba(255,255,255,.76);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 8px 24px rgba(156,91,124,.06)
    }
    .toolbar>.tiny{min-width:max-content;font-weight:700}
    .kpi-pair{gap:16px}
    .pair-card{min-height:92px;display:flex;flex-direction:column;justify-content:center;padding:18px}
    .form-grid{gap:18px}
    .checkline{min-height:30px}
    .table-wrap{margin-top:2px}
    .mobile-live-list{gap:14px}
    .mobile-live-card{padding:18px}
    .mobile-grid{gap:12px}
    .mobile-field{padding:12px}
    .mobile-assign{gap:12px;margin-top:16px;padding-top:16px}
    .approval-item{
      margin-top:16px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--surface-soft)
    }
    .approved-user-row{
      padding:15px 0;
      border-bottom:1px solid var(--line);
      gap:16px
    }
    .approved-user-row:last-child{border-bottom:0;padding-bottom:0}
    @media(max-width:1050px){
      .content{padding-left:22px;padding-right:22px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:700px){
      .content{padding:18px 14px 34px}
      .section.active{gap:18px}
      .topbar{min-height:76px;padding:12px 14px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .stats .card{min-height:108px}
      .card{padding:16px}
      .toolbar{padding:12px;gap:10px}
      .toolbar .input,.toolbar .btn{width:100%;flex:1 1 100%}
      .kpi-pair{gap:12px}
      .pair-card{min-height:82px;padding:15px}
      .mobile-live-card{padding:16px}
      .mobile-live-head{margin-bottom:14px}
      .mobile-grid{gap:10px}
      .mobile-field{padding:11px}
      .approval-item{padding:15px;margin-top:14px}
      .form-grid{gap:14px}
      #section-live>.card{
        padding:0;
        border:0;
        background:transparent;
        box-shadow:none
      }
      #section-live>.card .mobile-live-list{margin:0}
    }
    @media(max-width:420px){
      .stats{grid-template-columns:1fr}
      .stats .card{min-height:96px}
      .mobile-grid{grid-template-columns:1fr}
      .page-title{font-size:20px}
    }


    .pagination-wrap{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:14px 16px;background:rgba(255,255,255,.78);border:1px solid var(--line);
      border-radius:16px;box-shadow:0 8px 24px rgba(156,91,124,.06)
    }
    .pagination-info{font-size:12px;color:var(--muted)}
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
    .page-btn{
      min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line);
      border-radius:10px;background:#fff;color:#74465c;font-weight:700;cursor:pointer
    }
    .page-btn:hover:not(:disabled){border-color:var(--line-strong);background:#fff5fa}
    .page-btn.active{background:var(--accent-soft);border-color:#e8acc8;color:#9a4d72}
    .page-btn:disabled{opacity:.38;cursor:not-allowed}
    .page-ellipsis{min-width:24px;text-align:center;color:var(--muted)}
    @media(max-width:700px){
      .pagination-wrap{flex-direction:column;align-items:stretch;gap:12px;padding:13px}
      .pagination-info{text-align:center}
      .pagination{justify-content:center}
      .page-btn{min-width:38px;height:38px}
    }


    .month-select{min-width:210px}
    @media(max-width:700px){.month-select{width:100%;min-width:0}}


    /* v1.1.6 compact UI normalization */
    body{font-size:13px}
    .content{padding:22px 24px 60px}
    .section.active{gap:16px}
    .topbar{min-height:66px;padding:9px 24px}
    .page-title{font-size:20px;line-height:1.25;letter-spacing:-.025em}
    .tiny{font-size:11px;line-height:1.4}
    .sub{font-size:13px;line-height:1.55}

    .stats{gap:12px}
    .stats .card{
      min-height:0;
      display:block;
      padding:14px 16px
    }
    .stat-label{font-size:11px;line-height:1.35}
    .stat-value{
      font-size:19px;
      line-height:1.25;
      margin-top:5px;
      letter-spacing:-.02em
    }

    .card{
      padding:16px;
      border-radius:16px;
      box-shadow:0 8px 26px rgba(156,91,124,.075)
    }
    .card h3{font-size:14px;line-height:1.4;margin-bottom:9px}
    .card>.row.space:first-child{margin-bottom:10px;gap:10px}

    .toolbar{
      padding:10px 12px;
      gap:8px;
      border-radius:14px
    }
    .input{
      min-height:38px;
      padding:7px 10px;
      border-radius:10px;
      font-size:12px
    }
    .btn{
      min-height:38px;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px
    }
    .btn.small{min-height:31px;padding:5px 9px;font-size:11px}
    .pill{font-size:10px;padding:5px 8px;line-height:1.2}
    .tag{font-size:10px;padding:4px 7px}

    .pair-card{
      min-height:0;
      padding:13px 14px;
      border-radius:14px
    }
    .pair-card b{font-size:13px;margin-bottom:3px}
    .kpi-pair{gap:10px}

    .table-wrap{border-radius:13px}
    th,td{padding:9px 10px}
    th{font-size:10px;line-height:1.35}
    td{font-size:11px;line-height:1.45}
    td b{font-size:12px}
    .money{font-size:11px}
    .empty{padding:26px 14px;font-size:12px}

    .notice{padding:11px 13px;border-radius:13px;font-size:12px;line-height:1.55}
    .approval-item{padding:13px;margin-top:10px;border-radius:13px}
    .approved-user-row{padding:10px 0;gap:10px}
    .form-grid{gap:12px}
    .checkline{min-height:24px;font-size:12px}

    .mobile-live-list{gap:10px}
    .mobile-live-card{
      padding:13px;
      border-radius:14px;
      box-shadow:0 5px 18px rgba(156,91,124,.065)
    }
    .mobile-live-head{margin-bottom:10px;gap:8px}
    .mobile-live-title{font-size:13px;line-height:1.4}
    .mobile-grid{gap:8px}
    .mobile-field{
      padding:9px 10px;
      border-radius:10px
    }
    .mobile-field .tiny{margin-bottom:2px}
    .mobile-field strong{font-size:12px;line-height:1.35}
    .mobile-assign{gap:8px;margin-top:10px;padding-top:10px}

    .pagination-wrap{padding:10px 12px;border-radius:13px}
    .pagination-info{font-size:10px}
    .page-btn{min-width:32px;height:32px;padding:0 8px;font-size:11px;border-radius:9px}
    .month-select{min-width:185px}

    @media(max-width:1050px){
      .content{padding:18px 18px 54px}
      .stats{gap:10px}
    }
    @media(max-width:700px){
      body{font-size:12px}
      #app{padding-bottom:72px}
      .content{padding:12px 10px 22px}
      .section.active{gap:12px}
      .topbar{min-height:60px;padding:8px 11px}
      .page-title{font-size:17px}
      .topbar .btn{min-height:32px;padding:5px 8px;font-size:10px}
      .stats{gap:8px}
      .stats .card{min-height:0;padding:11px 12px}
      .stat-value{font-size:16px;margin-top:3px}
      .stat-label{font-size:10px}
      .card{padding:12px;border-radius:13px}
      .card h3{font-size:13px;margin-bottom:7px}
      .toolbar{padding:9px;gap:7px;border-radius:12px}
      .input{min-height:36px;font-size:11px}
      .btn{min-height:36px;font-size:11px}
      .pair-card{min-height:0;padding:11px 12px}
      .mobile-live-card{padding:11px;border-radius:12px}
      .mobile-live-head{margin-bottom:8px}
      .mobile-live-title{font-size:12px}
      .mobile-field{padding:8px}
      .mobile-field strong{font-size:11px}
      .mobile-assign{margin-top:8px;padding-top:8px}
      .pagination-wrap{padding:9px;gap:8px}
      .page-btn{min-width:30px;height:30px;font-size:10px}
      .nav button{padding:5px 3px;font-size:9px}
      .nav-icon{font-size:15px;height:18px}
      .sidebar{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}
    }
    @media(max-width:420px){
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .mobile-grid{grid-template-columns:1fr 1fr}
    }
    @media(max-width:350px){
      .stats,.mobile-grid{grid-template-columns:1fr}
    }


    /* v1.1.7 responsive readable typography */
    html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      font-size:clamp(13px,0.22vw + 12.2px,15px);
      line-height:1.55
    }
    .page-title{
      font-size:clamp(20px,0.75vw + 17px,26px);
      line-height:1.25
    }
    .sub{font-size:clamp(12px,0.18vw + 11.5px,14px)}
    .tiny{font-size:clamp(11px,0.14vw + 10.5px,12.5px)}
    .card h3{font-size:clamp(14px,0.3vw + 13px,17px)}
    .stat-label{font-size:clamp(11px,0.18vw + 10.5px,13px)}
    .stat-value{

  <script type="module">
    const FIREBASE_VERSION = "12.19.0";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
    const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`);
    const { getFirestore, doc, getDoc, setDoc, updateDoc, getDocs, collection, query, orderBy, where, writeBatch, serverTimestamp, Timestamp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);

    const $ = (s) => document.querySelector(s);
    const esc = (v="") => String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const fmtMoney = (v,currency="VND") => {
      const n=Number(v||0), code=currency||'VND';
      if(code==='VND') return `${new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)} đ`;
      try{return new Intl.NumberFormat('vi-VN',{style:'currency',currency:code,currencyDisplay:'name',maximumFractionDigits:2}).format(n)}
      catch{return `${new Intl.NumberFormat('vi-VN').format(n)} ${code}`}
    };
    const fmtDate = (ts) => {
      if(!ts)return '—';
      const d=ts?.toDate?ts.toDate():new Date(Number(ts)*1000);
      const day=String(d.getDate()).padStart(2,'0'), month=String(d.getMonth()+1).padStart(2,'0'), year=d.getFullYear();
      const hour=String(d.getHours()).padStart(2,'0'), minute=String(d.getMinutes()).padStart(2,'0');
      return `${day}/${month}/${year} lúc ${hour} giờ ${minute} phút`;
    };
    const fmtDuration = seconds => {
      const total=Math.max(0,Number(seconds||0));
      const hours=Math.floor(total/3600), minutes=Math.floor(total%3600/60);
      if(hours<=0) return `${minutes} phút`;
      return `${hours} giờ ${String(minutes).padStart(2,'0')} phút`;
    };
    const monthLabel = ym => {
      const [year,month]=String(ym||'').split('-').map(Number);
      return month&&year?`Tháng ${month} năm ${year}`:'Chọn tháng và năm';
    };
    const monthPicker = id => {
      const currentYear=new Date().getFullYear();
      const years=new Set([currentYear-2,currentYear-1,currentYear,currentYear+1]);
      for(const item of state.sessions){
        const d=item.startTime?.toDate?.();
        if(d) years.add(d.getFullYear());
      }
      const options=[...years].sort((a,b)=>b-a).flatMap(year=>Array.from({length:12},(_,i)=>{
        const value=`${year}-${String(i+1).padStart(2,'0')}`;
        return `<option value="${value}" ${value===state.month?'selected':''}>Tháng ${i+1} năm ${year}</option>`;
      })).join('');
      return `<select id="${id}" class="input month-select" aria-label="Chọn tháng và năm báo cáo">${options}</select>`;
    };
    const monthBounds = (ym) => { const [y,m]=ym.split('-').map(Number); const start=new Date(y,m-1,1); const end=new Date(y,m,1); const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return {start:iso(start),end:iso(end)} };
    const roleLabel = r => ({admin:'Quản trị viên',host:'Host Livestream',operator:'Nhân viên vận hành livestream',pending:'Chờ duyệt'}[r]||r||'Chưa gán');
    const todayMonth = new Date().toISOString().slice(0,7);
    const PREVIEW = location.pathname === '/preview' || new URLSearchParams(location.search).get('preview') === '1';

    const LIVE_PAGE_SIZE = 20;
    const state = { config:null, auth:null, db:null, user:null, profile:null, sessions:[], users:[], month:todayMonth, section:'dashboard', livePage:1 };

    function previewTs(iso){ return {toDate:()=>new Date(iso)}; }
    function enterPreview(){
      state.config={version:'1.1.9-preview',tiktokConfigured:true};
      state.user={uid:'preview-admin',email:'admin@sellerkbb.demo',displayName:'Quản trị viên Demo',photoURL:''};
      state.profile={role:'admin',status:'approved',displayName:'Quản trị viên Demo',permissions:['live.read','kpi.read']};
      state.users=[
        {id:'thao-my',displayName:'Thảo My',email:'thaomy@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'hung-bg',displayName:'Hùng Bắc Giang',email:'hungbg@sellerkbb.demo',role:'operator',status:'approved',permissions:['live.read','kpi.read']},
        {id:'dung',displayName:'Dung',email:'dung@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'tam',displayName:'Tâm',email:'tam@sellerkbb.demo',role:'host',status:'approved',permissions:['live.read','kpi.read']},
        {id:'hung-hh',displayName:'Hùng Hiền Hòa',email:'hunghh@sellerkbb.demo',role:'operator',status:'approved',permissions:['live.read','kpi.read']},
        {id:'pending-01',displayName:'Nguyễn Minh Anh',email:'minhanh@example.com',role:'pending',status:'pending',permissions:[]},
        {id:'preview-admin',displayName:'Quản trị viên Demo',email:'admin@sellerkbb.demo',role:'admin',status:'approved',permissions:['live.read','kpi.read']}
      ];
      const base=[
        ['LIVE-202610-001','Mega Live 10.10 - Ca sáng','sellerkbb_official','743820194','2026-10-10T02:00:00+07:00',10800,186500000,1240,174320000,'thao-my','Thảo My','hung-bg','Hùng Bắc Giang'],
        ['LIVE-202610-002','Flash Sale buổi trưa','sellerkbb_official','743820194','2026-10-10T06:30:00+07:00',7200,93200000,611,88750000,'dung','Dung','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-003','Deal tối độc quyền','sellerkbb_official','743820194','2026-10-10T12:00:00+07:00',14400,241800000,1604,226910000,'tam','Tâm','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-004','Live săn voucher cuối tuần','sellerkbb_beauty','881003522','2026-10-12T13:15:00+07:00',12600,154900000,983,148210000,'thao-my','Thảo My','hung-bg','Hùng Bắc Giang'],
        ['LIVE-202610-005','Brand Day - Prime Time','sellerkbb_official','743820194','2026-10-15T12:30:00+07:00',16200,312400000,2018,294860000,'dung','Dung','hung-hh','Hùng Hiền Hòa'],
        ['LIVE-202610-006','Live chốt đơn cuối ngày','sellerkbb_beauty','881003522','2026-10-18T13:00:00+07:00',9000,128600000,802,121970000,'tam','Tâm','hung-bg','Hùng Bắc Giang']
      ];
      state.sessions=base.map(x=>({id:x[0],liveId:x[0],title:x[1],channelUsername:x[2],channelId:x[3],startTime:previewTs(x[4]),durationSeconds:x[5],recordedGmvAmount:x[6],recordedItemsSold:x[7],currentItemsSold:x[7],currentGmvAmount:x[8],finalGmvAmount:x[8],currency:'VND',hostUid:x[9],hostName:x[10],operatorUid:x[11],operatorName:x[12]}));
      for(let i=7;i<=34;i++){
        const d=String(((i-1)%19)+1).padStart(2,'0');
        const host=i%3===0?['tam','Tâm']:i%2===0?['dung','Dung']:['thao-my','Thảo My'];
        const op=i%2===0?['hung-hh','Hùng Hiền Hòa']:['hung-bg','Hùng Bắc Giang'];
        const gmv=72000000+i*4200000, final=Math.round(gmv*(.91+(i%5)*.01)), items=420+i*37;
        state.sessions.push({id:`LIVE-202610-${String(i).padStart(3,'0')}`,liveId:`LIVE-202610-${String(i).padStart(3,'0')}`,title:`Phiên LIVE mẫu #${i}`,channelUsername:i%2?'sellerkbb_official':'sellerkbb_beauty',channelId:i%2?'743820194':'881003522',startTime:previewTs(`2026-10-${d}T12:30:00+07:00`),durationSeconds:7200+(i%4)*1800,recordedGmvAmount:gmv,recordedItemsSold:items,currentItemsSold:items,currentGmvAmount:final,finalGmvAmount:final,currency:'VND',hostUid:host[0],hostName:host[1],operatorUid:op[0],operatorName:op[1]});
      }
      showApp(); bindShell(); renderAll();
      const bar=document.createElement('div');
      bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:99;background:#f7c5dc;color:#653a50;padding:9px 14px;border:1px solid #edb4cf;border-radius:999px;font-weight:800;font-size:11px;box-shadow:0 8px 24px rgba(156,91,124,.18);white-space:nowrap';
      bar.textContent='PREVIEW MODE · Dữ liệu mẫu · Không ảnh hưởng hệ thống thật';
      document.body.appendChild(bar);
    }

    function showBoot(message, actions='') { $('#boot').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#bootText').innerHTML=message; $('#bootActions').innerHTML=actions; }
    function showApp(){ $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); }
    function can(p){ return state.profile?.role==='admin' || (state.profile?.status==='approved' && (state.profile?.permissions||[]).includes(p)); }
    function isAdmin(){ return state.profile?.role==='admin' && state.profile?.status==='approved'; }

    async function api(path, options={}){
      const token = state.user ? await state.user.getIdToken() : null;
      const headers = { ...(options.headers||{}) };
      if(token) headers.authorization=`Bearer ${token}`;
      if(options.body && !headers['content-type']) headers['content-type']='application/json';
      const res=await fetch(path,{...options,headers});
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.message||data.error||`HTTP ${res.status}`);
      return data;
    }

    async function init(){
      if(PREVIEW){ enterPreview(); return; }
      const config=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
      state.config=config;
      if(!config?.firebase?.apiKey || !config.firebase.projectId){
        showBoot(`<b>Website đã chạy trên Cloudflare nhưng Firebase chưa được cấu hình.</b><br><br>Không có dữ liệu mẫu. Hãy thêm Firebase Web Config vào Worker để bật đăng nhập Google và Firestore.`, `<span class="pill warn">Production setup pending</span>`);
        return;
      }
      const app=initializeApp(config.firebase);
      state.auth=getAuth(app); state.db=getFirestore(app);
      onAuthStateChanged(state.auth, handleAuth);
    }

    async function handleAuth(user){
      state.user=user;
      if(!user){
        showBoot(`<b>Đăng nhập bằng Gmail để vào hệ thống.</b><br><br>Tài khoản đầu tiên sẽ bootstrap thành quản trị viên; các tài khoản tiếp theo sẽ chờ quản trị viên duyệt.`, `<button id="loginBtn" class="btn primary">Đăng nhập Google</button>`);
        $('#loginBtn').onclick=async()=>{ try{ await signInWithPopup(state.auth,new GoogleAuthProvider()); }catch(e){ alert(e.message); } };
        return;
      }
      await ensureProfile(user);
      state.profile=(await getDoc(doc(state.db,'users',user.uid))).data();
      if(state.profile?.status==='pending'){
        showBoot(`<b>Tài khoản đang chờ duyệt.</b><br><br>${esc(user.email||'')} đã đăng ký thành công. Quản trị viên cần chọn vai trò và quyền truy cập trước khi bạn dùng dashboard.`, `<button id="logoutPending" class="btn ghost">Đăng xuất</button>`);
        $('#logoutPending').onclick=()=>signOut(state.auth);
        return;
      }
      if(state.profile?.status!=='approved'){
        showBoot(`<b>Tài khoản chưa được phép truy cập.</b>`, `<button id="logoutBlocked" class="btn ghost">Đăng xuất</button>`); $('#logoutBlocked').onclick=()=>signOut(state.auth); return;
      }
      showApp(); bindShell(); await loadData(); renderAll();
    }

    async function ensureProfile(user){
      const uref=doc(state.db,'users',user.uid); const snap=await getDoc(uref);
      if(snap.exists()){
        await updateDoc(uref,{displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(()=>{}); return;
      }
      const bootstrapRef=doc(state.db,'system','bootstrap'); const bs=await getDoc(bootstrapRef);
      if(!bs.exists()){
        const batch=writeBatch(state.db);
        batch.set(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'admin',status:'approved',permissions:['live.read','kpi.read'],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
        batch.set(bootstrapRef,{adminUid:user.uid,createdAt:serverTimestamp()});
        try{await batch.commit();return;}catch(e){console.warn('bootstrap race',e)}
      }
      await setDoc(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'pending',status:'pending',permissions:[],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
    }

    function bindShell(){
      $('#logoutBtn').onclick=()=>{ if(PREVIEW) location.href='/'; else signOut(state.auth); };
      $('#logoutBtn').textContent=PREVIEW?'Thoát Preview':'Đăng xuất';
      $('#userAvatar').src=state.user.photoURL||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="%23223044"/></svg>';
      $('#userName').textContent=state.profile.displayName||state.user.email||'';
      $('#userRole').textContent=roleLabel(state.profile.role);
      $('#syncBadge').textContent=`v${state.config.version||'1.0.0'}`;
    }

    async function loadData(){
      state.sessions=[]; state.users=[];
      if(can('live.read')||can('kpi.read')){
        const q=query(collection(state.db,'liveSessions'),orderBy('startTime','desc'));
        const snap=await getDocs(q); state.sessions=snap.docs.map(d=>({id:d.id,...d.data()}));
      }
      if(isAdmin()){
        const us=await getDocs(collection(state.db,'users')); state.users=us.docs.map(d=>({id:d.id,...d.data()}));
      }
    }

    function renderNav(){
      const items=[{id:'dashboard',icon:'⌂',label:'Tổng quan',show:true},{id:'live',icon:'◉',label:'Phiên LIVE',show:can('live.read')},{id:'kpi',icon:'✦',label:'KPI nhân sự',show:can('kpi.read')},{id:'users',icon:'♙',label:'Tài khoản',show:isAdmin()},{id:'tiktok',icon:'↗',label:'TikTok',show:isAdmin()}].filter(x=>x.show);
      $('#nav').innerHTML=items.map(x=>`<button data-section="${x.id}" class="${state.section===x.id?'active':''}"><span class="nav-icon">${x.icon}</span><span>${x.label}</span></button>`).join('');
      $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>switchSection(b.dataset.section));
    }

    function switchSection(id){ state.section=id; document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); $(`#section-${id}`).classList.add('active'); renderNav(); const meta={dashboard:['Tổng quan','Báo cáo LIVE & KPI'],live:['Phiên LIVE','Gắn Host/Operator cho từng phiên'],kpi:['KPI nhân sự','Host 0,3% · Operator 0,1%'],users:['Duyệt tài khoản','Phân vai trò và nội dung được phép xem'],tiktok:['Kết nối TikTok Shop','Chỉ quản trị viên nhìn thấy phần này']}[id]; $('#pageTitle').textContent=meta[0]; $('#pageSub').textContent=meta[1]; }

    function sessionsForMonth(){ const [y,m]=state.month.split('-').map(Number); return state.sessions.filter(s=>{const d=s.startTime?.toDate?.()||new Date(0);return d.getFullYear()===y&&d.getMonth()===m-1}); }
    function finalGmv(s){ return Number(s.finalGmvAmount ?? s.currentGmvAmount ?? s.recordedGmvAmount ?? 0); }

    function renderDashboard(){
      const ss=sessionsForMonth(), gmv=ss.reduce((a,s)=>a+finalGmv(s),0), items=ss.reduce((a,s)=>a+Number(s.currentItemsSold??s.recordedItemsSold??0),0), totalSec=ss.reduce((a,s)=>a+Number(s.durationSeconds||0),0), currency=ss.find(s=>s.currency)?.currency||'VND';
      $('#section-dashboard').innerHTML=`
        <div class="toolbar"><label class="tiny" for="dashMonth">Tháng báo cáo</label>${monthPicker('dashMonth')}<span class="pill">${monthLabel(state.month)}</span></div>
        <div class="grid stats"><div class="card"><div class="stat-label">Phiên LIVE</div><div class="stat-value">${ss.length}</div></div><div class="card"><div class="stat-label">GMV cuối kỳ</div><div class="stat-value">${fmtMoney(gmv,currency)}</div></div><div class="card"><div class="stat-label">Sản phẩm bán</div><div class="stat-value">${new Intl.NumberFormat('vi-VN').format(items)}</div></div><div class="card"><div class="stat-label">Tổng thời lượng</div><div class="stat-value">${fmtDuration(totalSec)}</div></div></div>
        <div class="card"><div class="row space"><h3>Phiên LIVE gần nhất trong tháng</h3><span class="pill">GMV dùng KPI = GMV cuối kỳ</span></div>${renderLiveTable(ss.slice(0,8),false)}</div>`;
      $('#dashMonth').onchange=e=>{state.month=e.target.value;renderAll()};
    }

    function renderLiveTable(rows, editable){
      if(!rows.length)return `<div class="empty">Chưa có dữ liệu LIVE trong khoảng này.</div>`;
      const approvedHosts=state.users.filter(u=>u.status==='approved'&&u.role==='host'); const operators=state.users.filter(u=>u.status==='approved'&&u.role==='operator');
      const desktop=`<div class="table-wrap desktop-live-table"><table><thead><tr><th>Phiên / Kênh</th><th>Thời gian bắt đầu</th><th>Thời lượng phiên LIVE</th><th>GMV đã ghi nhận</th><th>Số món bán đã ghi nhận</th><th>GMV sau hoàn/hủy</th><th>Host</th><th>Vận hành</th>${editable?'<th></th>':''}</tr></thead><tbody>${rows.map(s=>`<tr>
        <td><b>${esc(s.title||'Phiên LIVE')}</b><div class="tiny">@${esc(s.channelUsername||'—')} ${s.channelId?`· ID kênh ${esc(s.channelId)}`:''}</div></td>
        <td>${fmtDate(s.startTime)}</td><td>${fmtDuration(s.durationSeconds)}</td><td class="money">${fmtMoney(s.recordedGmvAmount,s.currency)}</td><td>${new Intl.NumberFormat('vi-VN').format(Number(s.currentItemsSold??s.recordedItemsSold??0))}</td><td class="money">${fmtMoney(finalGmv(s),s.currency)}</td>
        <td>${editable?personSelect('host',s.id,s.hostUid,approvedHosts):esc(s.hostName||'—')}</td><td>${editable?personSelect('operator',s.id,s.operatorUid,operators):esc(s.operatorName||'—')}</td>${editable?`<td><button class="btn small" data-save-session="${s.id}">Lưu</button></td>`:''}
      </tr>`).join('')}</tbody></table></div>`;
      const mobile=`<div class="mobile-live-list">${rows.map(s=>`<article class="mobile-live-card">
        <div class="mobile-live-head"><div><div class="mobile-live-title">${esc(s.title||'Phiên LIVE')}</div><div class="tiny">@${esc(s.channelUsername||'—')} · ${fmtDate(s.startTime)}</div></div><span class="pill">${fmtDuration(s.durationSeconds)}</span></div>
        <div class="mobile-grid">
          <div class="mobile-field"><span class="tiny">GMV đã ghi nhận</span><strong>${fmtMoney(s.recordedGmvAmount,s.currency)}</strong></div>
          <div class="mobile-field"><span class="tiny">GMV sau hoàn/hủy</span><strong>${fmtMoney(finalGmv(s),s.currency)}</strong></div>
          <div class="mobile-field"><span class="tiny">Số món bán đã ghi nhận</span><strong>${new Intl.NumberFormat('vi-VN').format(Number(s.currentItemsSold??s.recordedItemsSold??0))}</strong></div>
        </div>
        ${editable?`<div class="mobile-assign"><label><span class="tiny">Host Livestream</span>${personSelect('host',s.id,s.hostUid,approvedHosts)}</label><label><span class="tiny">Nhân viên vận hành</span>${personSelect('operator',s.id,s.operatorUid,operators)}</label><button class="btn primary" data-save-session="${s.id}">Lưu nhân sự</button></div>`:`<div class="mobile-assign"><div class="row space"><span class="tiny">Host</span><b>${esc(s.hostName||'—')}</b></div><div class="row space"><span class="tiny">Vận hành</span><b>${esc(s.operatorName||'—')}</b></div></div>`}
      </article>`).join('')}</div>`;
      return desktop+mobile;
    }
    function personSelect(kind,id,val,users){ return `<select class="input" style="min-width:170px" data-person="${kind}" data-id="${id}"><option value="">— Chưa gán —</option>${users.map(u=>`<option value="${u.id}" ${u.id===val?'selected':''}>${esc(u.displayName||u.email)}</option>`).join('')}</select>`; }

    function renderLive(){
      if(!can('live.read')){ $('#section-live').innerHTML='<div class="notice bad">Bạn không có quyền xem dữ liệu LIVE.</div>';return; }
      const ss=sessionsForMonth();
      const totalPages=Math.max(1,Math.ceil(ss.length/LIVE_PAGE_SIZE));
      state.livePage=Math.min(Math.max(1,state.livePage),totalPages);
      const start=(state.livePage-1)*LIVE_PAGE_SIZE;
      const pageRows=ss.slice(start,start+LIVE_PAGE_SIZE);
      const from=ss.length?start+1:0, to=Math.min(start+LIVE_PAGE_SIZE,ss.length);
      const pageButtons=Array.from({length:totalPages},(_,i)=>i+1)
        .filter(p=>p===1||p===totalPages||Math.abs(p-state.livePage)<=1)
        .reduce((arr,p,idx,list)=>{ if(idx&&p-list[idx-1]>1) arr.push('…'); arr.push(p); return arr; },[])
        .map(p=>p==='…'?'<span class="page-ellipsis">…</span>':`<button class="page-btn ${p===state.livePage?'active':''}" data-page="${p}">${p}</button>`).join('');
      $('#section-live').innerHTML=`
        <div class="toolbar">
          ${monthPicker('liveMonth')}
          ${isAdmin()?'<button id="syncMonthBtn" class="btn primary">Đồng bộ tháng này từ TikTok</button>':''}
          <button id="csvBtn" class="btn">Xuất CSV</button>
        </div>
        <div class="card live-list-card">${renderLiveTable(pageRows,isAdmin())}</div>
        <div class="pagination-wrap">
          <div class="pagination-info">Đang hiển thị từ phiên <b>${from}</b> đến phiên <b>${to}</b> trên tổng số <b>${ss.length}</b> phiên · Mỗi trang hiển thị 20 phiên</div>
          <div class="pagination">
            <button class="page-btn nav-page" data-page="${state.livePage-1}" ${state.livePage<=1?'disabled':''}>‹</button>
            ${pageButtons}
            <button class="page-btn nav-page" data-page="${state.livePage+1}" ${state.livePage>=totalPages?'disabled':''}>›</button>
          </div>
        </div>`;
      $('#liveMonth').onchange=e=>{state.month=e.target.value;state.livePage=1;renderAll()};
      $('#csvBtn').onclick=()=>exportCsv(ss);
      document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{
        const p=Number(b.dataset.page); if(!p||p===state.livePage||p<1||p>totalPages)return;
        state.livePage=p; renderLive(); document.querySelector('#section-live')?.scrollIntoView({behavior:'smooth',block:'start'});
      });
      if(isAdmin()){
        $('#syncMonthBtn').onclick=syncMonth;
        document.querySelectorAll('[data-save-session]').forEach(b=>b.onclick=()=>saveAssignment(b.dataset.saveSession));
      }
    }

    async function saveAssignment(id){
      const h=document.querySelector(`[data-person="host"][data-id="${CSS.escape(id)}"]`), o=document.querySelector(`[data-person="operator"][data-id="${CSS.escape(id)}"]`);
      if(PREVIEW){
        const host=state.users.find(u=>u.id===h.value), op=state.users.find(u=>u.id===o.value), item=state.sessions.find(x=>x.id===id);
        Object.assign(item,{hostUid:h.value||'',hostName:host?.displayName||'',operatorUid:o.value||'',operatorName:op?.displayName||''});
        renderAll(); return;
      }
      const host=state.users.find(u=>u.id===h.value), op=state.users.find(u=>u.id===o.value);
      await updateDoc(doc(state.db,'liveSessions',id),{hostUid:h.value||'',hostName:host?.displayName||host?.email||'',operatorUid:o.value||'',operatorName:op?.displayName||op?.email||'',updatedAt:serverTimestamp()});
      await loadData(); renderAll();
    }

    async function syncMonth(){
      if(PREVIEW){ alert('Preview Mode: đây là thao tác mô phỏng. Bản production sẽ đồng bộ dữ liệu thật từ TikTok Shop API.'); return; }
      const btn=$('#syncMonthBtn'); btn.disabled=true; btn.textContent='Đang đồng bộ…';
      try{
        const {start,end}=monthBounds(state.month); const result=await api('/api/tiktok/sync',{method:'POST',body:JSON.stringify({startDate:start,endDate:end})});
        const batchSize=300; let count=0;
        for(let i=0;i<result.sessions.length;i+=batchSize){
          const batch=writeBatch(state.db);
          for(const s of result.sessions.slice(i,i+batchSize)){
            const ref=doc(state.db,'liveSessions',s.liveId); const old=await getDoc(ref); const oldData=old.exists()?old.data():null;
            const amount=Number(s.gmvAmount||0);
            batch.set(ref,{
              liveId:s.liveId,title:s.title,channelUsername:s.channelUsername,channelId:s.channelId||'',accountType:s.accountType||'',shopId:s.shopId||'',shopName:s.shopName||'',
              startTime:Timestamp.fromMillis(s.startTimeSeconds*1000),endTime:Timestamp.fromMillis(s.endTimeSeconds*1000),durationSeconds:s.durationSeconds,currency:s.currency||'VND',
              recordedGmvAmount:oldData?.recordedGmvAmount ?? amount,recordedItemsSold:oldData?.recordedItemsSold ?? Number(s.itemsSold||0),
              currentGmvAmount:amount,finalGmvAmount:amount,currentItemsSold:Number(s.itemsSold||0),skuOrders:Number(s.skuOrders||0),customers:Number(s.customers||0),
              hostUid:oldData?.hostUid||'',hostName:oldData?.hostName||'',operatorUid:oldData?.operatorUid||'',operatorName:oldData?.operatorName||'',
              source:'tiktok',rawSummary:s.raw||{},firstSyncedAt:oldData?.firstSyncedAt||serverTimestamp(),lastSyncedAt:serverTimestamp(),updatedAt:serverTimestamp()
            },{merge:true}); count++;
          }
          await batch.commit();
        }
        alert(`Đã đồng bộ ${count} phiên LIVE.`); await loadData(); renderAll();
      }catch(e){ alert('Đồng bộ thất bại: '+e.message); }
      finally{ if(btn){btn.disabled=false;btn.textContent='Đồng bộ tháng này từ TikTok';} }
    }

    function exportCsv(rows){
      const header=['live_id','title','channel_username','channel_id','start_time','duration_seconds','gmv_recorded','items_sold','gmv_final','currency','host','operator'];
      const lines=[header,...rows.map(s=>[s.liveId||s.id,s.title||'',s.channelUsername||'',s.channelId||'',s.startTime?.toDate?.().toISOString?.()||'',s.durationSeconds||0,s.recordedGmvAmount||0,s.currentItemsSold??s.recordedItemsSold??0,finalGmv(s),s.currency||'',s.hostName||'',s.operatorName||''])];
      const csv=lines.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'); const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tiktok-live-${state.month}.csv`;a.click();URL.revokeObjectURL(a.href);
    }

    function renderKpi(){
      if(!can('kpi.read')){ $('#section-kpi').innerHTML='<div class="notice bad">Bạn không có quyền xem KPI.</div>';return; }
      const ss=sessionsForMonth(); const map=new Map();
      const add=(uid,name,role,rate,gmv,currency)=>{ if(!uid&&!name)return; const key=uid||name; const cur=map.get(key)||{uid,name,role,rate,gmv:0,kpi:0,currency}; cur.gmv+=gmv; cur.kpi+=gmv*rate; map.set(key,cur); };
      for(const s of ss){ const g=finalGmv(s); add(s.hostUid,s.hostName,'host',.003,g,s.currency); add(s.operatorUid,s.operatorName,'operator',.001,g,s.currency); }
      const rows=[...map.values()].sort((a,b)=>b.kpi-a.kpi); const currency=rows[0]?.currency||'VND'; const totalKpi=rows.reduce((a,r)=>a+r.kpi,0);
      $('#section-kpi').innerHTML=`
        <div class="toolbar">${monthPicker('kpiMonth')}<span class="pill">${monthLabel(state.month)}</span><span class="pill">Host 0,3%</span><span class="pill">Vận hành 0,1%</span></div>
        <div class="kpi-pair"><div class="pair-card"><b>Thảo My + Hùng Bắc Giang</b><span class="tiny">Đi theo cặp — Host / Vận hành</span></div><div class="pair-card"><b>Dung hoặc Tâm + Hùng Hiền Hòa</b><span class="tiny">Đi theo cặp — Host / Vận hành</span></div></div>
        <div class="grid stats"><div class="card"><div class="stat-label">Nhân sự có KPI</div><div class="stat-value">${rows.length}</div></div><div class="card"><div class="stat-label">Tổng KPI tháng</div><div class="stat-value">${fmtMoney(totalKpi,currency)}</div></div></div>
        <div class="card">${rows.length?`<div class="table-wrap"><table style="min-width:700px"><thead><tr><th>Nhân sự</th><th>Vai trò</th><th>GMV gắn thẻ</th><th>Tỷ lệ</th><th>KPI</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name||'Chưa đặt tên')}</b></td><td><span class="tag ${r.role}">${roleLabel(r.role)}</span></td><td class="money">${fmtMoney(r.gmv,r.currency)}</td><td>${(r.rate*100).toFixed(1).replace('.',',')}%</td><td class="money">${fmtMoney(r.kpi,r.currency)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có phiên LIVE được gắn nhân sự trong tháng này.</div>'}</div>`;
      $('#kpiMonth').onchange=e=>{state.month=e.target.value;renderAll()};
    }

    function renderUsers(){
      if(!isAdmin()){ $('#section-users').innerHTML='';return; }
      const pending=state.users.filter(u=>u.status==='pending'); const approved=state.users.filter(u=>u.status==='approved');
      $('#section-users').innerHTML=`<div class="card"><h3>Tài khoản chờ duyệt <span class="pill warn">${pending.length}</span></h3>${pending.length?pending.map(userApprovalCard).join(''):'<div class="empty">Không có tài khoản đang chờ.</div>'}</div><div class="card" style="margin-top:14px"><h3>Tài khoản đã duyệt</h3>${approved.map(userApprovedRow).join('')}</div>`;
      document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveUser(b.dataset.approve));
    }

    function userApprovalCard(u){return `<div class="approval-item"><div class="row space"><div><b>${esc(u.displayName||u.email)}</b><div class="tiny">${esc(u.email||'')}</div></div><span class="pill warn">Chờ duyệt</span></div><div class="form-grid" style="margin-top:16px"><label><div class="tiny">Vai trò</div><select class="input" style="width:100%" data-role="${u.id}"><option value="host">Host Livestream</option><option value="operator">Nhân viên vận hành livestream</option><option value="admin">Quản trị viên</option></select></label><div><div class="tiny">Nội dung được phép xem</div><label class="checkline"><input type="checkbox" data-perm="live.read" data-uid="${u.id}" checked> Phiên LIVE</label><label class="checkline"><input type="checkbox" data-perm="kpi.read" data-uid="${u.id}" checked> KPI cá nhân / báo cáo</label></div></div><div class="row" style="margin-top:16px"><button class="btn primary" data-approve="${u.id}">Duyệt tài khoản</button></div></div>`;}
    function userApprovedRow(u){return `<div class="row space approved-user-row"><div><b>${esc(u.displayName||u.email)}</b><div class="tiny">${esc(u.email||'')} · ${(u.permissions||[]).join(', ')||'full/admin'}</div></div><span class="tag ${u.role}">${roleLabel(u.role)}</span></div>`;}
    async function approveUser(uid){ const role=document.querySelector(`[data-role="${CSS.escape(uid)}"]`).value; const permissions=[...document.querySelectorAll(`[data-uid="${CSS.escape(uid)}"][data-perm]:checked`)].map(x=>x.dataset.perm); if(role==='admin'){permissions.splice(0,permissions.length,'live.read','kpi.read')} if(PREVIEW){ const u=state.users.find(x=>x.id===uid); Object.assign(u,{role,status:'approved',permissions}); renderAll(); return; } await updateDoc(doc(state.db,'users',uid),{role,status:'approved',permissions,approvedAt:serverTimestamp(),approvedBy:state.user.uid,updatedAt:serverTimestamp()}); await loadData(); renderAll(); }

    async function renderTikTok(){
      if(!isAdmin()){ $('#section-tiktok').innerHTML='';return; }
      if(PREVIEW){
        $('#section-tiktok').innerHTML=`<div class="card"><div class="row space"><div><h3>Kết nối TikTok Shop Seller</h3><div class="sub">Preview giao diện dành riêng cho Quản trị viên. Host/Operator sẽ không thấy mục này.</div></div><span class="pill ok">Đã kết nối · Demo</span></div><div class="notice ok" style="margin-top:14px">Shop mẫu: SellerKBB Official · Khu vực VN · Token được lưu phía backend Cloudflare trong bản production.</div><div class="row" style="margin-top:14px"><button class="btn" id="previewSync">Kiểm tra kết nối</button><button class="btn danger" id="previewDisconnect">Ngắt kết nối</button></div><div class="tiny" style="margin-top:12px">Scopes minh họa: data.shop_analytics.public.read</div></div><div class="card" style="margin-top:14px"><h3>API dùng cho báo cáo</h3><div class="sub"><b>LIVE Performance:</b> /analytics/202509/shop_lives/performance<br><b>Authorized Shops:</b> /authorization/202309/shops<br><b>Finance đối soát:</b> dùng để mở rộng đối soát hoàn/hủy khi shop cấp quyền phù hợp.</div></div>`;
        $('#previewSync').onclick=()=>alert('Kết nối TikTok mẫu hoạt động bình thường.');
        $('#previewDisconnect').onclick=()=>alert('Preview Mode không thay đổi kết nối thật.');
        return;
      }
      let status={configured:state.config.tiktokConfigured,connected:false,grantedScopes:[]}; try{status=await api('/api/tiktok/status')}catch(e){status.error=e.message}
      $('#section-tiktok').innerHTML=`<div class="card"><div class="row space"><div><h3>Kết nối TikTok Shop Seller</h3><div class="sub">Token được giữ trong Cloudflare KV. Host/Operator không thấy khu vực này.</div></div><span class="pill ${status.connected?'ok':'warn'}">${status.connected?'Đã kết nối':'Chưa kết nối'}</span></div>${!status.configured?'<div class="notice" style="margin-top:14px">Chưa cấu hình đủ TikTok App Key / Secret / Service ID / Seller Authorization URL / KV binding.</div>':''}<div class="row" style="margin-top:14px">${status.configured&&!status.connected?'<button id="connectTikTok" class="btn primary">Kết nối TikTok Seller</button>':''}${status.connected?'<button id="disconnectTikTok" class="btn danger">Ngắt kết nối</button>':''}</div>${status.grantedScopes?.length?`<div class="tiny" style="margin-top:12px">Scopes: ${esc(status.grantedScopes.join(', '))}</div>`:''}</div><div class="card" style="margin-top:14px"><h3>API dùng cho báo cáo</h3><div class="sub"><b>LIVE Performance:</b> /analytics/202509/shop_lives/performance<br><b>Authorized Shops:</b> /authorization/202309/shops<br><b>Finance đối soát:</b> có thể bổ sung /finance/202501/orders/{order_id}/statement_transactions khi shop cấp scope Finance.</div></div>`;
      if($('#connectTikTok')) $('#connectTikTok').onclick=async()=>{try{const r=await api('/api/tiktok/oauth/start',{method:'POST'});location.href=r.url}catch(e){alert(e.message)}};
      if($('#disconnectTikTok')) $('#disconnectTikTok').onclick=async()=>{if(confirm('Ngắt kết nối TikTok Shop?')){await api('/api/tiktok/disconnect',{method:'POST'});renderTikTok()}};
    }

    function renderAll(){ renderNav(); renderDashboard(); renderLive(); renderKpi(); renderUsers(); renderTikTok(); switchSection(state.section); }

    init().catch(e=>showBoot(`<b>Không khởi động được ứng dụng.</b><br><br>${esc(e.message)}`));
  </script>
</body>
</html>

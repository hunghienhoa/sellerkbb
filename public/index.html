<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SellerKBB · TikTok LIVE Report</title>
  <meta name="theme-color" content="#fff4f9" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#fff8fb;
  --bg-soft:#fff1f7;
  --surface:#ffffff;
  --surface-soft:#fff5fa;
  --surface-strong:#fde8f2;
  --line:#efd7e3;
  --line-strong:#e6b9cf;
  --text:#422d38;
  --muted:#856d79;
  --accent:#eb8db9;
  --accent-strong:#d96ca3;
  --accent-soft:#fde4f0;
  --danger:#cc5e79;
  --danger-soft:#fff0f3;
  --warn:#946b20;
  --warn-soft:#fff8e6;
  --ok:#3f8c72;
  --ok-soft:#eef9f5;
  --shadow-sm:0 2px 8px rgba(144,77,111,.045);
  --shadow-md:0 8px 24px rgba(144,77,111,.07);
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html{
  background:var(--bg);
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 0 -10%,rgba(248,196,220,.48) 0,transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(255,224,238,.62) 0,transparent 25%),
    var(--bg);
  font-size:clamp(13px,.22vw + 12.2px,15px);
  line-height:1.55;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.boot{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.boot-card{
  width:min(100%,680px);
  padding:30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(16px);
}
.brand{
  color:#58394a;
  font-size:28px;
  font-weight:900;
  letter-spacing:-.045em;
}
.brand b{color:var(--accent-strong)}
.sub{
  color:var(--muted);
  font-size:clamp(12px,.18vw + 11.5px,14px);
  line-height:1.65;
}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.grid{display:grid;gap:12px}
.tiny{
  color:var(--muted);
  font-size:clamp(11px,.14vw + 10.5px,12.5px);
  line-height:1.45;
}

.btn,.page-btn,.range-btn,.menu-toggle,.nav button{
  position:relative;
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,opacity .18s ease,color .18s ease;
}
.btn{
  min-height:40px;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(144,77,111,.04);
}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.btn:active,.page-btn:active,.range-btn:active,.menu-toggle:active,.nav button:active{transform:scale(.965)}
.btn.fx-press,.page-btn.fx-press,.range-btn.fx-press,.menu-toggle.fx-press,.nav button.fx-press{transform:scale(.97)}
.btn.primary{
  border-color:#e79abd;
  background:linear-gradient(135deg,#f6b0d2,var(--accent));
  color:#522c40;
}
.btn.danger{
  border-color:#f0c9d3;
  background:var(--danger-soft);
  color:var(--danger);
}
.btn.ghost{background:rgba(255,255,255,.62)}
.btn.small{min-height:32px;padding:5px 9px;font-size:11.5px}
.btn:disabled,.page-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.btn::after,.nav button::after,.page-btn::after,.range-btn::after,.menu-toggle::after{
  content:'';
  position:absolute;
  left:var(--tap-x,50%);
  top:var(--tap-y,50%);
  width:12px;height:12px;
  border-radius:50%;
  background:rgba(217,109,164,.20);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
}
.btn.fx-ripple::after,.nav button.fx-ripple::after,.page-btn.fx-ripple::after,.range-btn.fx-ripple::after,.menu-toggle.fx-ripple::after{
  animation:fx-ripple .48s ease-out;
}
@keyframes fx-ripple{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.65}
  100%{transform:translate(-50%,-50%) scale(18);opacity:0}
}

.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #f2cade;
  border-radius:999px;
  background:var(--accent-soft);
  color:#8d4969;
  font-weight:700;
  white-space:nowrap;
}
.pill{padding:5px 9px;font-size:clamp(10.5px,.12vw + 10px,12px)}
.tag{padding:4px 7px;font-size:clamp(10px,.1vw + 9.8px,11.5px)}
.pill.ok{border-color:#cce7dd;background:var(--ok-soft);color:var(--ok)}
.pill.warn{border-color:#eadcaf;background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:#efc8d2;background:var(--danger-soft);color:var(--danger)}
.tag.host{border-color:#f0c3d9;background:#fff0f7;color:#a34773}
.tag.operator{border-color:#eadcaf;background:#fff9e9;color:#856527}
.tag.admin{border-color:#cce5db;background:#f0faf6;color:#477d6c}

#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  height:100vh;
  padding:20px;
  border-right:1px solid var(--line);
  background:rgba(255,247,251,.91);
  backdrop-filter:blur(18px);
}
.side-brand{padding:6px 10px 20px}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#806876;
  text-align:left;
  font-weight:700;
  cursor:pointer;
}
.nav button:hover{border-color:var(--line);background:#fff;color:#5d3e4d}
.nav button.active{
  border-color:#efc8da;
  background:linear-gradient(135deg,#fff,#fde8f2);
  color:#8e4268;
  box-shadow:0 6px 17px rgba(190,89,140,.09);
}
.nav-icon{width:23px;text-align:center;font-size:16px}
.side-bottom{position:absolute;left:20px;right:20px;bottom:20px}
.userbox{
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(255,255,255,.9);
  box-shadow:var(--shadow-sm);
}
.avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--accent-soft);
  object-fit:cover;
}

.main{min-width:0}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px clamp(16px,2vw,28px);
  border-bottom:1px solid var(--line);
  background:rgba(255,251,253,.88);
  backdrop-filter:blur(16px);
}
.topbar-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.page-title{
  margin:0;
  color:#513544;
  font-size:clamp(20px,.75vw + 17px,26px);
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.03em;
}
.content{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:clamp(18px,2vw,28px) clamp(14px,2vw,28px) 64px;
}
.section{display:none}
.section.active{
  display:flex;
  flex-direction:column;
  gap:clamp(14px,1.4vw,20px);
  animation:section-enter .22s ease-out both;
}
@keyframes section-enter{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  padding:clamp(14px,1.3vw,18px);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:rgba(255,255,255,.92);
  box-shadow:none;
  transition:border-color .18s ease,background-color .18s ease;
}
.card h3{
  margin:0 0 9px;
  color:#583849;
  font-size:clamp(14px,.3vw + 13px,17px);
  line-height:1.4;
}
.card>.row.space:first-child{gap:10px;margin-bottom:10px}
.stats{
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:12px;
}
.stats .card{min-height:0;padding:clamp(13px,1.2vw,17px)}
.stat-label{
  color:var(--muted);
  font-size:clamp(11px,.18vw + 10.5px,13px);
  font-weight:600;
}
.stat-value{
  margin-top:5px;
  color:#673f54;
  font-size:clamp(18px,.75vw + 15px,25px);
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere;
}

.toolbar,.time-filter{
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding:11px 13px;
}
.time-filter{padding:11px 12px}
.range-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.range-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.range-btn{
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#715665;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.range-btn:hover{border-color:var(--line-strong);background:#fff8fb}
.range-btn.active{
  border-color:#e7abc7;
  background:var(--accent-soft);
  color:#944c70;
}
.range-summary{
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.range-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-left:auto;
  align-items:center;
}
.custom-range{
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}
.range-field{
  display:grid;
  gap:4px;
  min-width:150px;
}
.range-field>span{
  color:var(--muted);
  font-size:10.5px;
  font-weight:700;
}
.range-separator{
  align-self:center;
  color:var(--muted);
  font-size:11px;
}
.date-text{width:150px}
.input{
  min-height:40px;
  padding:8px 10px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:clamp(12px,.16vw + 11.5px,14px);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
.input:focus{
  outline:0;
  border-color:var(--accent-strong);
  box-shadow:0 0 0 4px rgba(238,147,189,.12);
}
.input option{background:#fff;color:var(--text)}
.month-select{min-width:190px}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  scrollbar-color:#edb3ce transparent;
  scrollbar-width:thin;
}
table{
  width:100%;
  min-width:1050px;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #f4e5ec;
  text-align:left;
  vertical-align:middle;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  background:#fff4f9;
  color:#7c6070;
  font-size:clamp(10.5px,.16vw + 10px,12px);
  line-height:1.35;
  font-weight:800;
}
td{
  color:#543c49;
  font-size:clamp(11.5px,.16vw + 11px,13px);
  line-height:1.45;
}
td b{font-size:clamp(12px,.18vw + 11.5px,13.5px)}
tbody tr:hover td{background:#fffafd}
.money{color:#73485d;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:12px}

.notice{
  padding:11px 13px;
  border:1px solid #eadcaf;
  border-radius:8px;
  background:var(--warn-soft);
  color:#74551c;
  font-size:clamp(12px,.16vw + 11.5px,13.5px);
  line-height:1.55;
}
.notice.bad{border-color:#efc8d2;background:var(--danger-soft);color:#a84d63}
.notice.ok{border-color:#cce6dc;background:var(--ok-soft);color:#397761}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkline{
  min-height:25px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#664c59;
  font-size:clamp(11.5px,.15vw + 11px,13px);
}
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair-card{
  padding:clamp(12px,1vw,16px);
  border:1px solid var(--line);
  border-radius:9px;
  background:linear-gradient(135deg,#fff,#fff4f9);
}
.pair-card b{
  display:block;
  margin-bottom:3px;
  color:#704259;
  font-size:clamp(12.5px,.2vw + 12px,14px);
}
.approval-item{
  margin-top:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface-soft);
}
.approved-user-row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.approved-user-row:last-child{border-bottom:0;padding-bottom:0}

.mobile-live-list{display:none}
.mobile-live-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  box-shadow:none;
}
.mobile-live-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.mobile-live-title{
  color:#553848;
  font-size:clamp(12.5px,.55vw + 10.5px,14px);
  line-height:1.4;
  font-weight:800;
}
.mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-field{
  min-width:0;
  padding:9px 10px;
  border:1px solid #f5dce8;
  border-radius:10px;
  background:var(--surface-soft);
}
.mobile-field .tiny{display:block;margin-bottom:2px}
.mobile-field strong{
  display:block;
  color:#614052;
  font-size:clamp(12px,.45vw + 10.5px,13.5px);
  line-height:1.35;
  overflow-wrap:anywhere;
}
.mobile-assign{
  display:grid;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line-strong);
}
.mobile-assign .input{width:100%;min-width:0!important}
.mobile-live-list .btn{width:100%}

.pagination-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.82);
  box-shadow:none;
}
.pagination-info{
  color:var(--muted);
  font-size:clamp(10.5px,.14vw + 10px,12px);
}
.pagination{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:wrap;
}
.page-btn{
  min-width:32px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:#744a5f;
  font-size:clamp(11px,.12vw + 10.5px,12px);
  font-weight:700;
  cursor:pointer;
}
.page-btn:hover:not(:disabled){border-color:var(--line-strong);background:#fff7fb}
.page-btn.active{border-color:#e5a9c6;background:var(--accent-soft);color:#954c70}
.page-ellipsis{min-width:22px;text-align:center;color:var(--muted)}

.menu-toggle{display:none}
.mobile-menu-overlay{display:none}
.action-toast{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top, 0px) + 14px);
  bottom:auto;
  z-index:120;
  max-width:min(88vw,420px);
  padding:10px 14px;
  border:1px solid #cbe5dc;
  border-radius:8px;
  background:rgba(246,253,250,.98);
  color:#397964;
  box-shadow:0 12px 34px rgba(106,62,84,.18);
  font-weight:700;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-12px);
  transition:opacity .2s ease,transform .2s ease;
}
.action-toast.show{opacity:1;transform:translate(-50%,0)}

@media(hover:hover){
  .card:hover{box-shadow:0 11px 28px rgba(144,77,111,.09)}
  .nav button:hover{transform:translateX(2px)}
  .mobile-live-card:hover{transform:translateY(-1px)}
}

@media(max-width:1050px) and (min-width:701px){
  #app{grid-template-columns:86px minmax(0,1fr)}
  .sidebar{padding:16px 10px}
  .side-brand .brand span,.nav button span:not(.nav-icon),.side-bottom .usertext{display:none}
  .nav button{justify-content:center;padding:11px 7px}
  .nav-icon{font-size:18px}
  .side-bottom{left:10px;right:10px}
  .userbox{justify-content:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
  body{font-size:14px;background:linear-gradient(180deg,#fff4f9 0,#fffafd 38%,#fff8fb 100%)}
  #app{display:block}
  .topbar{min-height:62px;padding:8px 11px}
  .topbar-title-wrap{gap:9px}
  .page-title{font-size:clamp(19px,5.2vw,22px)}
  .topbar .pill{display:none}
  .topbar .btn{min-height:34px;padding:6px 9px;font-size:10.5px}
  .content{padding:12px 10px 28px}
  .section.active{gap:12px}
  .tiny{font-size:11.5px}
  .card{padding:12px;border-radius:13px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats .card{padding:11px 12px}
  .stat-label{font-size:11.5px}
  .stat-value{font-size:clamp(18px,4.9vw,21px)}
  .card h3{font-size:14px}
  .btn,.input{min-height:40px;font-size:13px}
  .pill{font-size:11px}
  .form-grid,.kpi-pair{grid-template-columns:1fr}
  .desktop-live-table{display:none}
  .mobile-live-list{display:grid;gap:10px}
  .mobile-live-card{padding:12px}
  .mobile-live-title{font-size:13.5px}
  .mobile-field strong{font-size:13px}
  #section-live>.live-list-card{
    padding:0;
    border:0;
    background:transparent;
    box-shadow:none;
  }
  .pagination-wrap{flex-direction:column;align-items:stretch;gap:8px;padding:9px}
  .pagination-info{text-align:center;font-size:11px;line-height:1.45}
  .pagination{justify-content:center}
  .page-btn{min-width:32px;height:32px;font-size:11.5px}
  .range-row{align-items:stretch}
  .range-tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .range-btn{min-width:0;padding:7px 5px;font-size:11px}
  .range-summary{width:100%;text-align:center}
  .range-actions{width:100%;margin-left:0}
  .range-actions .btn{flex:1}
  .custom-range{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:end;
    gap:8px;
  }
  .range-field{min-width:0}
  .date-text{width:100%}
  .range-separator{display:none}
  .custom-range>.btn{grid-column:1/-1;width:100%}

  .menu-toggle{
    display:grid;
    place-items:center;
    width:40px;height:40px;min-width:40px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:#70465a;
    font-size:21px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .mobile-menu-overlay{
    display:block;
    position:fixed;
    inset:0;
    z-index:39;
    background:rgba(69,42,56,.26);
    backdrop-filter:blur(2px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease,visibility .22s ease;
  }
  .mobile-menu-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
  .sidebar{
    position:fixed!important;
    z-index:40!important;

  .side-bottom{display:block!important;position:static!important;margin-top:24px}

/* v1.6.0 unified soft UI */
:root{
  --bg:#f6f5f7;
  --bg-soft:#fbf7f9;
  --surface:#ffffff;
  --surface-soft:#faf7f9;
  --surface-strong:#f6e8ef;
  --line:#ece4e8;
  --line-strong:#dfcfd7;
  --text:#352a31;
  --muted:#7d7077;
  --accent:#d86f9f;
  --accent-strong:#c75f90;
  --accent-soft:#f8e7ef;
  --danger:#ba536d;
  --warn:#8a6829;
  --ok:#3f846d;
  --shadow-sm:0 1px 3px rgba(67,42,54,.05);
  --shadow-md:0 8px 24px rgba(67,42,54,.07);
  --radius-sm:6px;
  --radius-md:9px;
  --radius-lg:12px;
}
html,body{background:var(--bg)}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 85% -10%,rgba(240,196,216,.25),transparent 28%),
    linear-gradient(180deg,#faf8f9 0,#f6f5f7 52%,#f5f4f6 100%);
}
.ui-icon{display:inline-block;flex:0 0 auto;vertical-align:-3px}
.btn .ui-icon{margin-right:5px}
#app{grid-template-columns:244px minmax(0,1fr)}

.sidebar{
  padding:18px 14px;
  border-right:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
}
.side-brand{padding:8px 10px 22px}
.side-brand .brand{font-size:24px;letter-spacing:-.04em}
.nav{gap:4px}
.nav button{
  min-height:44px;
  gap:11px;
  padding:10px 11px;
  border:0;
  border-radius:8px;
  color:#776a71;
  font-weight:650;
}
.nav button:hover{
  background:#faf7f9;
  color:#513b47;
  transform:none;
}
.nav button.active{
  position:relative;
  border:0;
  background:#f8edf2;
  color:#8b3f64;
  box-shadow:none;
}
.nav button.active::before{
  content:'';
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:3px;
  border-radius:2px;
  background:var(--accent);
}
.nav-icon{
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  color:currentColor;
}
.side-bottom{left:14px;right:14px;bottom:16px}
.userbox{
  padding:10px;
  border:0;
  border-top:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}

.topbar{
  min-height:70px;
  padding:10px clamp(16px,2.2vw,30px);
  border-bottom:1px solid rgba(226,216,221,.8);
  background:rgba(249,248,249,.88);
  backdrop-filter:blur(18px);
}
.page-title{color:#3b2e35;font-size:clamp(20px,.6vw + 17px,25px)}
.content{
  max-width:1460px;
  padding:clamp(18px,2vw,28px) clamp(14px,2.1vw,30px) 56px;
}
.section.active{
  gap:18px;
  padding:clamp(16px,1.7vw,24px);
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.88);
  box-shadow:0 1px 2px rgba(67,42,54,.025);
}
.section.active>.card{
  padding:0 0 18px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.section.active>.card:last-child{padding-bottom:0;border-bottom:0}
.card:hover{box-shadow:none!important;transform:none!important}
.card h3{color:#47353e;font-size:15px;margin-bottom:7px}

.metrics-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.metrics-grid.metrics-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric-card{
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:0;
  padding:15px;
  border:1px solid #f0e5ea;
  border-radius:10px;
  background:linear-gradient(145deg,#fff 0,#fcf8fa 100%);
}
.metric-icon{
  width:38px;height:38px;
  display:grid;place-items:center;
  flex:0 0 auto;
  border-radius:9px;
  background:var(--accent-soft);
  color:#a95079;
}
.metric-copy{min-width:0;display:grid;gap:3px}
.metric-copy>span{
  color:var(--muted);
  font-size:11px;
  font-weight:650;
}
.metric-copy>strong{
  color:#4f3643;
  font-size:clamp(17px,.55vw + 14px,22px);
  line-height:1.25;
  font-weight:850;
  letter-spacing:-.025em;
  overflow-wrap:anywhere;
}
.metric-copy>small{color:var(--muted);font-size:10.5px}

.time-filter{
  padding:0 0 14px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
}
.range-row{gap:10px}
.range-tabs{
  padding:3px;
  gap:2px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#f8f6f7;
}
.range-btn{
  min-height:34px;
  padding:6px 11px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:#74676e;
  font-weight:650;
}
.range-btn:hover{border:0;background:#fff;color:#5c4752}
.range-btn.active{
  border:0;
  background:#fff;
  color:#93486c;
  box-shadow:0 1px 3px rgba(70,45,57,.08);
}
.range-summary{
  display:flex;
  align-items:center;
  gap:6px;
  color:#81737a;
}
.custom-range{
  border-top:0;
  margin-top:12px;
  padding:12px;
  background:#faf8f9;
  border-radius:8px;
}

.btn{
  border-color:var(--line-strong);
  border-radius:8px;
  background:#fff;
  color:#55424c;
  box-shadow:none;
  font-weight:700;
}
.btn:hover{border-color:#d9c5cf;box-shadow:none;background:#fdfafb}
.btn.primary{
  border-color:var(--accent);
  background:var(--accent);
  color:#fff;
}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.input{
  border-color:var(--line-strong);
  border-radius:8px;
  background:#fff;
}
.pill,.tag{border-radius:999px}

.table-wrap{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}
table{background:#fff}
th{
  background:#faf8f9;
  color:#74676e;
  font-weight:750;
}
th,td{padding:10px 11px;border-bottom-color:#f0e9ec}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fcfafb}

.kpi-pair{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.pair-card{
  padding:13px 14px;
  border:0;
  border-radius:0;
  background:transparent;
}
.pair-card+ .pair-card{border-left:1px solid var(--line)}
.pair-card b{color:#54404a}

.notice{
  border:0;
  border-left:3px solid #d9b268;
  border-radius:4px;
  background:#fcf9f0;
}
.notice.ok{border:0;border-left:3px solid #7eb8a3;background:#f2f8f5}
.notice.bad{border:0;border-left:3px solid #d27a8d;background:#fcf3f5}

.pagination-wrap{
  padding:4px 0 0;
  border:0;
  border-radius:0;
  background:transparent;
}
.page-btn{border-radius:6px}

.approval-item{
  padding:14px 0;
  margin-top:0;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  background:transparent;
}
.approved-user-row{padding:12px 0}

.export-list{border-top:0}
.export-row{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:16px 0;
}
.export-icon{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:9px;
  background:var(--accent-soft);
  color:#a95079;
}
.export-copy{min-width:0}
.export-row b{color:#493740}
.export-row .btn{white-space:nowrap}

.api-hero{
  display:grid;
  grid-template-columns:52px minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  padding:4px 0 18px;
  border-bottom:1px solid var(--line);
}
.api-hero-icon{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:11px;
  background:var(--accent-soft);
  color:#a94f79;
}
.api-hero-copy h3{margin:2px 0 4px;font-size:18px;color:#44323b}
.api-hero-copy p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}
.eyebrow{
  color:#a5557b;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.status-dot{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  white-space:nowrap;
}
.status-dot::before{
  content:'';
  width:7px;height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 4px currentColor;
  opacity:.8;
}
.status-dot.ok{color:#3f846d;background:#eff8f4}
.status-dot.warn{color:#9a6d26;background:#fbf6e9}
.status-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  border-bottom:1px solid var(--line);
}
.status-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
  padding:16px 14px 16px 0;
  color:#9a5576;
}
.status-item+ .status-item{padding-left:14px;border-left:1px solid var(--line)}
.status-item>div{min-width:0;display:grid;gap:3px}
.status-item span{color:var(--muted);font-size:10.5px;font-weight:650}
.status-item b{color:#4e3a44;font-size:12px;line-height:1.4}
.status-item small{color:#94858c;font-size:10px;line-height:1.4}
.api-foot{

}
.api-foot>div:first-child{display:grid;gap:2px;min-width:0}

.api-foot span{color:var(--muted);font-size:11px;overflow-wrap:anywhere}

.storage-stats{
  grid-template-columns:repeat(3,minmax(0,1fr));

  border-bottom:1px solid var(--line);
}
.storage-stats>.card{
  padding:14px!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
}
.storage-stats>.card+.card{border-left:1px solid var(--line)!important}
.settings-grid{
  padding:4px 0;
  gap:12px 18px;
}
.toggle-row{
  border:0;
  border-left:3px solid #e0c0cf;
  border-radius:4px;
  background:#faf8f9;

.recommend-list>div{padding:12px 0}

.mobile-live-card{

  border-bottom:1px solid var(--line);

  background:transparent;
}
.mobile-live-list{gap:0}
.mobile-field{

.mobile-assign{border-top:1px solid var(--line-strong)}

@media(max-width:1100px) and (min-width:701px){

/* v1.7 calendar range picker */
.custom-range{

  min-height:54px;

.calendar-week{

    const FIREBASE_VERSION = "12.19.0";

    const $ = (s) => document.querySelector(s);

    const fmtMoney = (v,currency="VND") => {
      const n=Number(v||0), code=currency||'VND';
      if(code==='VND') return `${new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)} đ`;
      try{return new Intl.NumberFormat('vi-VN',{style:'currency',currency:code,currencyDisplay:'name',maximumFractionDigits:2}).format(n)}
      catch{return `${new Intl.NumberFormat('vi-VN').format(n)} ${code}`}
    };
    const fmtDate = (ts) => {
      if(!ts)return '—';
      const d=ts?.toDate?ts.toDate():new Date(Number(ts)*1000);
      const day=String(d.getDate()).padStart(2,'0'), month=String(d.getMonth()+1).padStart(2,'0'), year=d.getFullYear();
      const hour=String(d.getHours()).padStart(2,'0'), minute=String(d.getMinutes()).padStart(2,'0');
      return `${day}/${month}/${year} lúc ${hour} giờ ${minute} phút`;
    };
    const fmtDuration = seconds => {
      const total=Math.max(0,Number(seconds||0));
      const hours=Math.floor(total/3600), minutes=Math.floor(total%3600/60);
      if(hours<=0) return `${minutes} phút`;
      return `${hours} giờ ${String(minutes).padStart(2,'0')} phút`;

      const m=String(key||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m?`${m[3]}/${m[2]}/${m[1]}`:'';
    };
    const parseDisplayDate = value => {
      const m=String(value||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!m)return null;
      const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
      const d=new Date(year,month-1,day);
      if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)return null;
      d.setHours(0,0,0,0);
      return d;
    };
    function selectedRange(){
      const today=new Date(); today.setHours(0,0,0,0);
      let start=new Date(today), endInclusive=new Date(today);
      if(state.rangeMode==='7d') start.setDate(start.getDate()-6);
      else if(state.rangeMode==='30d') start.setDate(start.getDate()-29);
      else if(state.rangeMode==='custom'){
        const a=state.customStart?new Date(state.customStart+'T00:00:00'):null;
        const b=state.customEnd?new Date(state.customEnd+'T00:00:00'):null;
        if(a&&!Number.isNaN(a.getTime())) start=a;
        if(b&&!Number.isNaN(b.getTime())) endInclusive=b;
        if(start>endInclusive){ const t=start; start=endInclusive; endInclusive=t; }
      }
      const endExclusive=new Date(endInclusive); endExclusive.setDate(endExclusive.getDate()+1);
      const startKey=localDateKey(start), endKey=localDateKey(endInclusive);
      const label=startKey===endKey?displayDateKey(startKey):`${displayDateKey(startKey)} – ${displayDateKey(endKey)}`;
      return {start,endInclusive,endExclusive,startKey,endKey,label};
    }

      return all.filter(s=>{
        const d=s.startTime?.toDate?.()||new Date(0);
        return d>=start&&d<endExclusive;
      });

    function bindCalendarPicker(scope,section){
      const calendar=section.querySelector(`[data-date-calendar="${scope}"]`);
      if(!calendar)return;
      const startBtn=section.querySelector('[data-date-target="start"]');
      const endBtn=section.querySelector('[data-date-target="end"]');
      if(!startBtn||!endBtn)return;

      let target='start';
      let view=new Date((startBtn.dataset.value||localDateKey(new Date()))+'T00:00:00');
      const todayKey=localDateKey(new Date());

      const setTarget=next=>{
        target=next;
        startBtn.classList.toggle('active',target==='start');
        endBtn.classList.toggle('active',target==='end');
        const value=(target==='start'?startBtn:endBtn).dataset.value;
        if(value)view=new Date(value+'T00:00:00');
        draw();
      };

      const draw=()=>{
        const y=view.getFullYear(), m=view.getMonth();
        const first=new Date(y,m,1);
        const offset=(first.getDay()+6)%7;
        const days=new Date(y,m+1,0).getDate();
        const startKey=startBtn.dataset.value||'';
        const endKey=endBtn.dataset.value||'';
        let cells='';
        for(let i=0;i<offset;i++)cells+='<span class="calendar-day empty" aria-hidden="true"></span>';
        for(let day=1;day<=days;day++){
          const d=new Date(y,m,day);
          const key=localDateKey(d);
          const inRange=startKey&&endKey&&key>=startKey&&key<=endKey;
          const cls=['calendar-day',key===todayKey?'today':'',key===startKey?'start':'',key===endKey?'end':'',inRange?'in-range':''].filter(Boolean).join(' ');
          cells+=`<button type="button" class="${cls}" data-calendar-day="${key}">${day}</button>`;
        }
        calendar.innerHTML=`
          <div class="calendar-head">
            <button type="button" class="calendar-nav" data-calendar-nav="-1" aria-label="Tháng trước">‹</button>
            <b>Tháng ${m+1}/${y}</b>
            <button type="button" class="calendar-nav" data-calendar-nav="1" aria-label="Tháng sau">›</button>
          </div>
          <div class="calendar-week"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
          <div class="calendar-grid">${cells}</div>`;

        calendar.querySelectorAll('[data-calendar-nav]').forEach(btn=>btn.onclick=()=>{
          view=new Date(view.getFullYear(),view.getMonth()+Number(btn.dataset.calendarNav),1);
          draw();
        });
        calendar.querySelectorAll('[data-calendar-day]').forEach(btn=>btn.onclick=()=>{
          const value=btn.dataset.calendarDay;
          const pick=target==='start'?startBtn:endBtn;
          pick.dataset.value=value;
          pick.querySelector('b').textContent=displayDateKey(value);
          if(target==='start') setTarget('end');
          else draw();
        });
      };

      startBtn.onclick=()=>setTarget('start');
      endBtn.onclick=()=>setTarget('end');
      draw();
    }

        showBoot(`<b>Website đã chạy trên Cloudflare nhưng Firebase chưa được cấu hình.</b><br><br>Không có dữ liệu mẫu. Hãy thêm Firebase Web Config vào Worker để bật đăng nhập Google và Firestore.`, `<span class="pill warn">Production setup pending</span>`);
        return;
      }
      const app=initializeApp(config.firebase);
      state.auth=getAuth(app); state.db=getFirestore(app);
      onAuthStateChanged(state.auth, handleAuth);
    }

    async function handleAuth(user){
      state.user=user;
      if(!user){
        showBoot(`<b>Đăng nhập bằng Gmail để vào hệ thống.</b><br><br>Tài khoản đầu tiên sẽ bootstrap thành quản trị viên; các tài khoản tiếp theo sẽ chờ quản trị viên duyệt.`, `<button id="loginBtn" class="btn primary">Đăng nhập Google</button>`);
        $('#loginBtn').onclick=async()=>{ try{ await signInWithPopup(state.auth,new GoogleAuthProvider()); }catch(e){ alert(e.message); } };
        return;
      }
      await ensureProfile(user);
      state.profile=(await getDoc(doc(state.db,'users',user.uid))).data();
      if(state.profile?.status==='pending'){
        showBoot(`<b>Tài khoản đang chờ duyệt.</b><br><br>${esc(user.email||'')} đã đăng ký thành công. Quản trị viên cần chọn vai trò và quyền truy cập trước khi bạn dùng dashboard.`, `<button id="logoutPending" class="btn ghost">Đăng xuất</button>`);
        $('#logoutPending').onclick=()=>signOut(state.auth);
        return;
      }
      if(state.profile?.status!=='approved'){
        showBoot(`<b>Tài khoản chưa được phép truy cập.</b>`, `<button id="logoutBlocked" class="btn ghost">Đăng xuất</button>`); $('#logoutBlocked').onclick=()=>signOut(state.auth); return;
      }
      showApp(); bindShell(); await loadData();
      if(isAdmin()){
        const key='sellerkbb:last-free-cleanup';
        const last=Number(localStorage.getItem(key)||0);
        if(Date.now()-last>86400000){
          const cleaned=await cleanupFirestoreData(true);
          localStorage.setItem(key,String(Date.now()));
          if(cleaned>0) await loadData();
        }
      }
      renderAll(); startAutoSyncWatcher();
    }

    async function ensureProfile(user){
      const uref=doc(state.db,'users',user.uid); const snap=await getDoc(uref);
      if(snap.exists()){
        await updateDoc(uref,{displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(()=>{}); return;
      }
      const bootstrapRef=doc(state.db,'system','bootstrap'); const bs=await getDoc(bootstrapRef);
      if(!bs.exists()){
        const batch=writeBatch(state.db);
        batch.set(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'admin',status:'approved',permissions:['live.read','kpi.read'],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
        batch.set(bootstrapRef,{adminUid:user.uid,createdAt:serverTimestamp()});
        try{await batch.commit();return;}catch(e){console.warn('bootstrap race',e)}
      }
      await setDoc(uref,{uid:user.uid,email:user.email||'',displayName:user.displayName||user.email||'',photoURL:user.photoURL||'',role:'pending',status:'pending',permissions:[],createdAt:serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()});
    }

    function setMobileMenu(open){
      const sidebar=$('#sidebar'), overlay=$('#mobileMenuOverlay'), toggle=$('#menuToggle');
      if(!sidebar||!overlay||!toggle)return;
      sidebar.classList.toggle('open',open);
      overlay.classList.toggle('open',open);
      toggle.setAttribute('aria-expanded',String(open));
      toggle.setAttribute('aria-label',open?'Đóng menu':'Mở menu');
      document.body.classList.toggle('menu-open',open);
    }

    function showToast(message){
      let el=$('#actionToast');
      if(!el){ el=document.createElement('div'); el.id='actionToast'; el.className='action-toast'; document.body.appendChild(el); }
      el.textContent=message;
      el.classList.remove('show');
      requestAnimationFrame(()=>el.classList.add('show'));
      clearTimeout(showToast.timer);
      showToast.timer=setTimeout(()=>el.classList.remove('show'),1800);
    }

    function fmtSyncMoment(iso){
      if(!iso)return 'Chưa có lần đồng bộ';
      const d=new Date(iso);
      if(Number.isNaN(d.getTime()))return 'Chưa có lần đồng bộ';
      const parts=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hourCycle:'h23'}).formatToParts(d);
      const get=t=>parts.find(x=>x.type===t)?.value||'00';
      return get('hour')+':'+get('minute')+':'+get('second')+' , Ngày '+get('day')+'/'+get('month')+'/'+get('year')+'.';
    }

    async function fetchAutoSyncStatus(){
      if(PREVIEW)return state.autoSyncStatus;
      try{
        const result=await api('/api/tiktok/autosync/status');
        return result.autoSync||null;
      }catch(e){
        console.warn('auto sync status',e);
        return null;
      }
    }

    async function refreshAllFromAutoSync(nextStatus){
      state.autoSyncRefreshing=true;
      state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      renderAll();
      try{
        await loadData();
        state.autoSyncStatus=nextStatus||state.autoSyncStatus;
      }finally{
        state.autoSyncRefreshing=false;
        renderAll();
      }
      showToast('Dữ liệu Tiktok vừa được cập nhật tự động');
    }

    async function checkAutoSyncUpdate(){
      if(document.hidden)return;
      if(PREVIEW){
        const next={...(state.autoSyncStatus||{}),ok:true,reason:'preview',finishedAt:new Date().toISOString(),cached:state.sessions.length};
        state.autoSyncRefreshing=true;
        state.autoSyncStatus=next;
        renderAll();
        setTimeout(()=>{ state.autoSyncRefreshing=false; renderAll(); },650);
        return;
      }
      const previous=state.autoSyncStatus?.finishedAt||'';
      const next=await fetchAutoSyncStatus();
      const stamp=next?.finishedAt||'';
      if(stamp && stamp!==previous){
        await refreshAllFromAutoSync(next);
      }else if(next){
        state.autoSyncStatus=next;
        renderDashboard();
      }
    }

    function startAutoSyncWatcher(){
      if(state.autoSyncWatcher)clearInterval(state.autoSyncWatcher);
      state.autoSyncWatcher=setInterval(checkAutoSyncUpdate,60000);
      if(!state.autoSyncVisibilityBound){
        state.autoSyncVisibilityBound=true;
        document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkAutoSyncUpdate(); });
      }
    }

    function bindInteractionEffects(){
      if(document.documentElement.dataset.fxBound==='1') return;
      document.documentElement.dataset.fxBound='1';
      document.addEventListener('pointerdown',e=>{
        const target=e.target.closest('.btn,.nav button,.page-btn,.menu-toggle');
        if(!target||target.disabled)return;
        const rect=target.getBoundingClientRect();
        target.style.setProperty('--tap-x',(e.clientX-rect.left)+'px');
        target.style.setProperty('--tap-y',(e.clientY-rect.top)+'px');
        target.classList.add('fx-press');
        target.classList.remove('fx-ripple');
        void target.offsetWidth;
        target.classList.add('fx-ripple');
      });
      const clear=()=>document.querySelectorAll('.fx-press').forEach(x=>x.classList.remove('fx-press'));
      document.addEventListener('pointerup',clear);
      document.addEventListener('pointercancel',clear);
    }
    function bindShell(){
      bindInteractionEffects();
      $('#menuToggle').onclick=()=>setMobileMenu(!$('#sidebar').classList.contains('open'));
      $('#mobileMenuOverlay').onclick=()=>setMobileMenu(false);
      document.addEventListener('keydown',e=>{ if(e.key==='Escape') setMobileMenu(false); });
      $('#logoutBtn').onclick=()=>{ if(PREVIEW) location.href='/'; else signOut(state.auth); };
      $('#logoutBtn').textContent=PREVIEW?'Thoát Preview':'Đăng xuất';
      $('#userAvatar').src=state.user.photoURL||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="%23223044"/></svg>';
      $('#userName').textContent=state.profile.displayName||state.user.email||'';
      $('#userRole').textContent=roleLabel(state.profile.role);
      $('#syncBadge').textContent=`v${state.config.version||'1.0.0'}`;
    }

    async function mergeAutoSyncedSessions(){
      if(PREVIEW || !(can('live.read')||can('kpi.read'))) return;
      try{
        const auto=await api('/api/tiktok/autosync/sessions');
        const byId=new Map(state.sessions.map(x=>[String(x.liveId||x.id),x]));
        for(const src of auto.sessions||[]){
          const id=String(src.liveId||'');
          if(!id)continue;
          const old=byId.get(id)||{};
          const startMs=Number(src.startTimeSeconds||0)*1000;
          const endMs=Number(src.endTimeSeconds||0)*1000;
          const amount=Number(src.gmvAmount||0);
          byId.set(id,{
            ...old,
            id,
            liveId:id,
            title:src.title||old.title||'Phiên LIVE',
            channelUsername:src.channelUsername||old.channelUsername||'',
            channelId:src.channelId||old.channelId||'',
            accountType:src.accountType||old.accountType||'',
            shopId:src.shopId||old.shopId||'',
            shopName:src.shopName||old.shopName||'',
            startTime:{toDate:()=>new Date(startMs)},
            endTime:{toDate:()=>new Date(endMs)},
            durationSeconds:Number(src.durationSeconds||0),
            currency:src.currency||old.currency||'VND',
            recordedGmvAmount:old.recordedGmvAmount??amount,
            recordedItemsSold:old.recordedItemsSold??Number(src.itemsSold||0),
            currentGmvAmount:amount,
            finalGmvAmount:amount,
            currentItemsSold:Number(src.itemsSold||0),
            hostUid:old.kpiMode==='manual'?'':(old.hostUid||''),
            hostName:old.kpiMode==='manual'?'':(old.hostName||''),
            operatorUid:old.kpiMode==='manual'?'':(old.operatorUid||''),
            operatorName:old.kpiMode==='manual'?'':(old.operatorName||''),
            kpiMode:old.kpiMode||'auto',
            source:'tiktok-auto'
          });
        }
        state.sessions=[...byId.values()].sort((a,b)=>(b.startTime?.toDate?.()?.getTime?.()||0)-(a.startTime?.toDate?.()?.getTime?.()||0));
      }catch(e){
        console.warn('auto sync cache',e);
      }
    }

    async function loadData(){
      state.sessions=[]; state.users=[];
      if(isAdmin()&&!PREVIEW){
        try{
          const m=await api('/api/maintenance/settings');
          state.maintenance={...state.maintenance,...m,settings:{...state.maintenance.settings,...(m.settings||{})}};
        }catch(e){ console.warn('maintenance settings',e); }
      }
      if(can('live.read')||can('kpi.read')){
        if(!PREVIEW){ const syncStatus=await fetchAutoSyncStatus(); if(syncStatus)state.autoSyncStatus=syncStatus; }
        const days=Math.min(180,Number(state.maintenance.settings.retentionDays||180));
        const cutoff=Timestamp.fromMillis(Date.now()-days*86400000);
        const maxDocs=Math.min(12000,Number(state.maintenance.settings.firestoreMaxSessions||12000));
        const q=query(collection(state.db,'liveSessions'),where('startTime','>=',cutoff),orderBy('startTime','desc'),limit(maxDocs));
        const snap=await getDocs(q);
        state.sessions=snap.docs.map(d=>({id:d.id,...d.data()})).map(x=>isManualKpi(x)?{...x,hostUid:'',hostName:'',operatorUid:'',operatorName:''}:x);
        await mergeAutoSyncedSessions();
      }
      if(isAdmin()){
        const us=await getDocs(collection(state.db,'users'));
        state.users=us.docs.map(d=>({id:d.id,...d.data()}));
      }
    }

      const items=[{id:'dashboard',icon:'home',label:'Tổng quan',show:true},{id:'live',icon:'live',label:'Phiên LIVE',show:can('live.read')},{id:'kpi',icon:'kpi',label:'KPI nhân sự',show:can('kpi.read')},{id:'export',icon:'export',label:'Xuất file',show:can('live.read')||can('kpi.read')},{id:'users',icon:'users',label:'Tài khoản',show:isAdmin()},{id:'tiktok',icon:'plug',label:'TikTok / API',show:isAdmin()},{id:'storage',icon:'database',label:'Lưu trữ',show:isAdmin()}].filter(x=>x.show);
      $('#nav').innerHTML=items.map(x=>`<button data-section="${x.id}" class="${state.section===x.id?'active':''}"><span class="nav-icon">${icon(x.icon,18)}</span><span>${x.label}</span></button>`).join('');

    function switchSection(id){ state.section=id; setMobileMenu(false); document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); $(`#section-${id}`).classList.add('active'); renderNav(); const meta={dashboard:['Tổng quan','Báo cáo LIVE & KPI'],live:['Phiên LIVE','Gắn Host/Operator cho từng phiên'],kpi:['KPI nhân sự','Host 0,3% · Operator 0,1%'],users:['Duyệt tài khoản','Phân vai trò và nội dung được phép xem'],export:['Xuất file','Xuất báo cáo theo khoảng thời gian đã chọn'],tiktok:['TikTok / API','Tự động đồng bộ LIVE và gia hạn token 24/24'],storage:['Lưu trữ & tự dọn','Giữ dữ liệu tối đa 6 tháng và bảo vệ dung lượng']}[id]; $('#pageTitle').textContent=meta[0]; $('#pageSub').textContent=meta[1]; }

    function finalGmv(s){ return Number(s.finalGmvAmount ?? s.currentGmvAmount ?? s.recordedGmvAmount ?? 0); }
    function liveEndTime(s){
      const explicit=s?.endTime?.toDate?.();
      if(explicit instanceof Date && !Number.isNaN(explicit.getTime())) return s.endTime;
      const start=s?.startTime?.toDate?.();
      const duration=Number(s?.durationSeconds||0);
      if(!(start instanceof Date)||Number.isNaN(start.getTime())||duration<=0)return null;
      return {toDate:()=>new Date(start.getTime()+duration*1000)};
    }
    function fmtLiveTimeRange(s){
      const start=s?.startTime?.toDate?.();
      const end=liveEndTime(s)?.toDate?.();
      if(!(start instanceof Date)||Number.isNaN(start.getTime()))return '—';
      const p=n=>String(n).padStart(2,'0');
      const startDate=`${p(start.getDate())}/${p(start.getMonth()+1)}/${start.getFullYear()}`;
      const startTime=`${p(start.getHours())}:${p(start.getMinutes())}`;
      if(!(end instanceof Date)||Number.isNaN(end.getTime()))return `${startDate}  ${startTime}`;
      const endTime=`${p(end.getHours())}:${p(end.getMinutes())}`;
      const sameDay=start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()&&start.getDate()===end.getDate();
      if(sameDay)return `${startDate}  ${startTime}-${endTime}`;
      const endDate=`${p(end.getDate())}/${p(end.getMonth()+1)}/${end.getFullYear()}`;
      return `${startDate}  ${startTime}-${endDate} ${endTime}`;
    }

    function renderLiveTable(rows, editable){
      if(!rows.length)return `<div class="empty">Chưa có dữ liệu LIVE trong khoảng này.</div>`;

    function estimateSessionBytes(session){
      try{
        const plain={...session};
        delete plain.rawSummary;
        return new TextEncoder().encode(JSON.stringify(plain)).length + 900;
      }catch{return 1800}
    }

    function maintenanceStats(){
      const settings=state.maintenance.settings;
      const totalBytes=state.sessions.reduce((a,s)=>a+estimateSessionBytes(s),0)*3;
      const totalMb=totalBytes/1024/1024;
      const count=state.sessions.length;
      const cutoff=Date.now()-Number(settings.retentionDays||180)*86400000;
      const expired=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)<cutoff).length;
      const countPct=Math.min(999,Math.round(count/Math.max(1,Number(settings.firestoreMaxSessions||12000))*100));
      const mbPct=Math.min(999,Math.round(totalMb/Math.max(1,Number(settings.firestoreSoftLimitMb||600))*100));
      return {count,totalMb,expired,countPct,mbPct,pressure:Math.max(countPct,mbPct)};
    }

    async function cleanupFirestoreData(emergency=false){
      if(PREVIEW){
        const retention=Number(state.maintenance.settings.retentionDays||180);
        const cutoff=Date.now()-retention*86400000;
        const before=state.sessions.length;
        state.sessions=state.sessions.filter(s=>(s.startTime?.toDate?.()?.getTime?.()||0)>=cutoff);
        return before-state.sessions.length;
      }
      if(!isAdmin()||!state.db)return 0;
      const settings=state.maintenance.settings;
      if(settings.autoCleanup===false && emergency)return 0;
      const retention=Number(settings.retentionDays||180);
      const cutoff=Date.now()-retention*86400000;
      const sorted=[...state.sessions].sort((a,b)=>(a.startTime?.toDate?.()?.getTime?.()||0)-(b.startTime?.toDate?.()?.getTime?.()||0));
      const deleteIds=new Set();
      // Free-plan cleanup: read at most 300 expired docs per run, then delete them in one batch.
      const staleQuery=query(collection(state.db,'liveSessions'),where('startTime','<',Timestamp.fromMillis(cutoff)),orderBy('startTime','asc'),limit(300));
      const staleSnap=await getDocs(staleQuery);
      staleSnap.docs.forEach(d=>deleteIds.add(d.id));
      const stats=maintenanceStats();
      const threshold=Number(settings.emergencyPercent||85);
      if(settings.autoCleanup!==false && (stats.countPct>=threshold || stats.mbPct>=threshold)){
        let remainingCount=stats.count-deleteIds.size;
        let remainingBytes=stats.totalMb;
        const targetCount=Math.floor(Number(settings.firestoreMaxSessions||12000)*.70);
        const targetMb=Number(settings.firestoreSoftLimitMb||600)*.70;
        for(const item of sorted){
          if(deleteIds.has(item.id)) continue;
          if(remainingCount<=targetCount && remainingBytes<=targetMb) break;
          deleteIds.add(item.id);
          remainingCount--;
          remainingBytes-=estimateSessionBytes(item)*3/1024/1024;
        }
      }
      if(!deleteIds.size)return 0;
      const ids=[...deleteIds];
      for(let i=0;i<ids.length;i+=300){
        const batch=writeBatch(state.db);
        ids.slice(i,i+300).forEach(id=>batch.delete(doc(state.db,'liveSessions',id)));
        await batch.commit();
      }
      return ids.length;
    }

    function renderStorage(){
      if(!isAdmin()){ $('#section-storage').innerHTML=''; return; }
      const m=state.maintenance.settings, st=maintenanceStats();
      const cf=state.maintenance.cloudflare||{};
      const last=cf.lastRun?.ranAt?fmtDate({toDate:()=>new Date(cf.lastRun.ranAt)}):'Chưa chạy';
      const pressureClass=st.pressure>=Number(m.emergencyPercent||85)?'bad':st.pressure>=70?'warn':'ok';

          <div class="card storage-stat"><div class="metric-icon">${icon('shield',19)}</div><div><div class="stat-label">Mức sử dụng so với ngưỡng ứng dụng</div><div class="stat-value">${st.pressure}%</div><div class="pill ${pressureClass}">${st.pressure>=Number(m.emergencyPercent||85)?'Cần dọn':'Trong vùng an toàn'}</div></div></div>
          <div class="card storage-stat"><div class="metric-icon">${icon('database',19)}</div><div><div class="stat-label">Cloudflare KV</div><div class="stat-value">${new Intl.NumberFormat('vi-VN').format(cf.keyCount||0)} khóa</div><div class="tiny">Lần dọn gần nhất: ${last}</div></div></div>
        </div>

        <div class="card">
          <div class="row space"><div><h3 class="heading-with-icon">${icon('settings',18)} Cài đặt tự động dọn dữ liệu</h3><div class="sub">Chỉ áp dụng cho dữ liệu báo cáo và cache. Source website, GitHub, tài khoản người dùng và token TikTok được bảo vệ.</div></div><span class="pill ok">Tối đa 6 tháng</span></div>
          <div class="settings-grid">
            <label><span class="tiny">Thời gian lưu dữ liệu LIVE</span><select id="retentionDays" class="input"><option value="30">30 ngày</option><option value="60">60 ngày</option><option value="90">90 ngày</option><option value="120">120 ngày</option><option value="150">150 ngày</option><option value="180">180 ngày (6 tháng)</option></select></label>
            <label><span class="tiny">Ngưỡng bắt đầu dọn khẩn cấp</span><select id="emergencyPercent" class="input"><option value="75">75%</option><option value="80">80%</option><option value="85">85% (khuyến nghị)</option><option value="90">90%</option></select></label>
            <label><span class="tiny">Ngưỡng Firestore của ứng dụng</span><div class="input-unit"><input id="firestoreSoftLimitMb" class="input" type="number" min="100" max="900" value="${m.firestoreSoftLimitMb}"><span>MB</span></div></label>
            <label><span class="tiny">Số phiên LIVE tối đa trước khi dọn</span><input id="firestoreMaxSessions" class="input" type="number" min="500" max="50000" value="${m.firestoreMaxSessions}"></label>
            <label><span class="tiny">Ngưỡng số khóa Cloudflare KV</span><input id="kvSoftKeyLimit" class="input" type="number" min="100" max="50000" value="${m.kvSoftKeyLimit}"></label>
            <label class="toggle-row"><input id="autoCleanup" type="checkbox" ${m.autoCleanup!==false?'checked':''}><span><b>Tự động dọn khi chạm ngưỡng</b><small>Ưu tiên xóa dữ liệu cũ nhất; không xóa source hoặc khóa được bảo vệ.</small></span></label>
          </div>
          <div class="row storage-actions"><button id="saveMaintenance" class="btn primary">${icon('check',15)} Lưu và áp dụng</button><button id="cleanupNow" class="btn">${icon('database',15)} Dọn dữ liệu ngay</button><button id="runKvCleanup" class="btn">${icon('shield',15)} Kiểm tra Cloudflare</button></div>
        </div>

        <div class="card free-plan-note">
          <h3 class="heading-with-icon">${icon('shield',18)} Chế độ Firebase Free</h3>
          <div class="notice ok"><b>Không dùng Firestore TTL trả phí.</b> SellerKBB chỉ đọc tối đa dữ liệu trong thời gian lưu và tự dọn tối đa 300 phiên quá hạn mỗi lượt khi Admin đăng nhập hoặc bấm dọn thủ công.</div>
          <div class="sub" style="margin-top:10px">Cách này ưu tiên giữ trong quota Free và tránh tạo lượng đọc/ghi/xóa lớn bất ngờ.</div>
        </div>

        <div class="card">
          <h3 class="heading-with-icon">${icon('settings',18)} Gợi ý cài đặt</h3>
          <div class="recommend-list">
            <div><b>Khuyến nghị hiện tại</b><span>180 ngày · dọn ở 85% · TikTok tự đồng bộ mỗi 1 giờ · dọn KV 1 lần/ngày</span></div>
            <div><b>Nếu dữ liệu tăng rất nhanh</b><span>Giữ 120–150 ngày hoặc hạ ngưỡng khẩn cấp xuống 80%.</span></div>
            <div><b>Nếu muốn ưu tiên lịch sử</b><span>Giữ 180 ngày và nâng ngưỡng ứng dụng; không được vượt quá 180 ngày.</span></div>
          </div>
        </div>`;
      $('#retentionDays').value=String(m.retentionDays);
      $('#emergencyPercent').value=String(m.emergencyPercent);
      $('#saveMaintenance').onclick=saveMaintenanceSettings;
      $('#cleanupNow').onclick=async()=>{ const n=await cleanupFirestoreData(false); if(!PREVIEW&&n) await loadData(); showToast(n?`Đã xóa ${n} phiên cũ`:'Không có dữ liệu cần xóa'); renderAll(); };
      $('#runKvCleanup').onclick=async()=>{ if(PREVIEW){ showToast('Preview: Cloudflare KV đang trong vùng an toàn'); return; } const result=await api('/api/maintenance/run',{method:'POST'}); showToast(`Cloudflare: đã kiểm tra ${result.keyCount||0} khóa, xóa ${result.deleted||0}`); await loadData(); renderAll(); };
    }

    async function saveMaintenanceSettings(){
      const next={
        retentionDays:Number($('#retentionDays').value),
        emergencyPercent:Number($('#emergencyPercent').value),
        firestoreSoftLimitMb:Number($('#firestoreSoftLimitMb').value),
        firestoreMaxSessions:Number($('#firestoreMaxSessions').value),
        kvSoftKeyLimit:Number($('#kvSoftKeyLimit').value),
        autoCleanup:$('#autoCleanup').checked
      };
      if(next.retentionDays>180)next.retentionDays=180;
      if(PREVIEW){
        state.maintenance.settings={...state.maintenance.settings,...next};
        persistPreviewState();
        showToast('Đã lưu cài đặt Preview');
        renderAll(); return;
      }
      const saved=await api('/api/maintenance/settings',{method:'POST',body:JSON.stringify(next)});
      state.maintenance.settings={...state.maintenance.settings,...saved.settings};
      const deleted=await cleanupFirestoreData(false);
      await loadData();
      showToast(deleted?`Đã lưu cài đặt và dọn ${deleted} phiên cũ`:'Đã lưu cài đặt');
      renderAll();
    }

    async function renderTikTok(){
      if(!isAdmin()){ $('#section-tiktok').innerHTML='';return; }
      if(PREVIEW){
        $('#section-tiktok').innerHTML=`
          <div class="api-hero">
            <div class="api-hero-icon">${icon('plug')}</div>
            <div class="api-hero-copy"><span class="eyebrow">TikTok Shop Seller API</span><h3>Kết nối liên tục 24/24</h3><p>Dữ liệu LIVE tự được đồng bộ mỗi giờ. Không cần chọn ngày và không cần bấm đồng bộ thủ công.</p></div>
            <span class="status-dot ok">Đang hoạt động</span>
          </div>
          <div class="status-grid">
            <div class="status-item">${icon('refresh')}<div><span>Refresh Token</span><b>Tự gia hạn trước khi Access Token hết hạn</b></div></div>
            <div class="status-item">${icon('sync')}<div><span>Đồng bộ tự động</span><b>Mỗi 1 giờ · chạy 24/24</b></div></div>
            <div class="status-item">${icon('history')}<div><span>Đối soát số liệu</span><b>Mỗi ngày rà lại 30 ngày gần nhất</b></div></div>
          </div>
          <div class="api-foot"><div><b>LIVE Performance API</b><span>/analytics/202509/shop_lives/performance</span></div><button class="btn" id="previewSync">${icon('check')} Kiểm tra kết nối</button></div>`;
        $('#previewSync').onclick=()=>showToast('Kết nối TikTok mẫu hoạt động bình thường');
        return;
      }

      let status={configured:state.config.tiktokConfigured,connected:false,autoRefresh:false,autoSyncEnabled:true,autoSync:null,grantedScopes:[]};
      try{status=await api('/api/tiktok/status')}catch(e){status.error=e.message}
      const accessExpiry=status.accessTokenExpiresAt?fmtDate({toDate:()=>new Date(status.accessTokenExpiresAt*1000)}):'Chưa có';
      const refreshExpiry=status.refreshTokenExpiresAt?fmtDate({toDate:()=>new Date(status.refreshTokenExpiresAt*1000)}):'Chưa có';
      const sync=status.autoSync||{};
      const lastSync=sync.finishedAt?fmtDate({toDate:()=>new Date(sync.finishedAt)}):'Chưa chạy';
      const syncState=status.connected?(sync.ok===false?'Có lỗi cần kiểm tra':'Đang hoạt động'):'Chưa kết nối';

      $('#section-tiktok').innerHTML=`
        <div class="api-hero">
          <div class="api-hero-icon">${icon('plug')}</div>
          <div class="api-hero-copy"><span class="eyebrow">TikTok Shop Seller API</span><h3>${status.connected?'Kết nối liên tục 24/24':'Chưa kết nối TikTok'}</h3><p>${status.connected?'SellerKBB tự lấy dữ liệu LIVE mỗi giờ và tự đối soát lại số liệu hằng ngày.':'Kết nối một lần để bật đồng bộ tự động và gia hạn token.'}</p></div>
          <span class="status-dot ${status.connected&&sync.ok!==false?'ok':'warn'}">${syncState}</span>
        </div>
        ${!status.configured?'<div class="notice">Chưa cấu hình đủ TikTok App Key / Secret / Service ID / Seller Authorization URL / KV binding.</div>':''}
        <div class="status-grid">
          <div class="status-item">${icon('refresh')}<div><span>Refresh Token</span><b>${status.autoRefresh?'Tự gia hạn · Access Token hết hạn '+accessExpiry:'Chưa có refresh token'}</b><small>Refresh Token hết hạn: ${refreshExpiry}</small></div></div>
          <div class="status-item">${icon('sync')}<div><span>Đồng bộ tự động</span><b>Mỗi 1 giờ · chạy 24/24</b><small>Lần gần nhất: ${lastSync}</small></div></div>
          <div class="status-item">${icon('database')}<div><span>Dữ liệu cache</span><b>${new Intl.NumberFormat('vi-VN').format(Number(sync.cached||0))} phiên LIVE</b><small>Đối soát 30 ngày gần nhất mỗi ngày</small></div></div>
        </div>
        <div class="api-foot">
          <div><b>LIVE Performance API</b><span>/analytics/202509/shop_lives/performance</span></div>
          <div class="row">
            ${status.configured&&!status.connected?'<button id="connectTikTok" class="btn primary">'+icon('link')+' Kết nối TikTok Seller</button>':''}
            ${status.connected?'<button id="checkTikTok" class="btn">'+icon('check')+' Kiểm tra trạng thái</button>':''}
          </div>
        </div>
        ${sync.error?`<div class="notice bad">Đồng bộ gần nhất gặp lỗi: ${esc(sync.error)}</div>`:''}
        ${status.grantedScopes?.length?`<div class="scope-line tiny">Scopes: ${esc(status.grantedScopes.join(', '))}</div>`:''}`;

      if($('#connectTikTok')) $('#connectTikTok').onclick=async()=>{try{const result=await api('/api/tiktok/oauth/start',{method:'POST'});location.href=result.url}catch(e){showToast(e.message)}};
      if($('#checkTikTok')) $('#checkTikTok').onclick=()=>showToast(status.connected?'Kết nối đang hoạt động · đồng bộ 24/24 đã bật':'TikTok chưa kết nối');
    }

    function renderAll(){ renderNav(); renderDashboard(); renderLive(); renderKpi(); renderExport(); renderUsers(); renderTikTok(); renderStorage(); switchSection(state.section); }

    init().catch(e=>showBoot(`<b>Không khởi động được ứng dụng.</b><br><br>${esc(e.message)}`));
  </script>
</body>
</html>
